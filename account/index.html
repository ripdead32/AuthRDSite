<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Rip_Dead</title>
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card account-card">
            <div class="auth-logo">
                <div class="logo-mark">RD</div>
                <h1>Rip_Dead</h1>
            </div>

            <div id="loading">
                <p>Loading your account...</p>
            </div>

            <div id="account-content" hidden>
                <div class="profile-avatar-container">
                    <div class="account-avatar" id="avatar">
                        ?
                    </div>

                    <label class="upload-button">
                        Change PFP
                        <input
                            type="file"
                            id="avatar-input"
                            accept="image/jpeg,image/png,image/webp"
                            hidden
                        >
                    </label>
                </div>

                <div class="account-header">
                    <h2 id="display-name">
                        Loading...
                    </h2>

                    <p class="username" id="username">
                        @username
                    </p>

                    <span
                        class="verified-badge"
                        id="verified-badge"
                        hidden
                    >
                        ✓ Verified
                    </span>
                </div>

                <div class="form-group">
                    <label for="username-input">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username-input"
                        maxlength="24"
                        placeholder="Username"
                    >
                </div>

                <div class="form-group">
                    <label for="display-name-input">
                        Display name
                    </label>

                    <input
                        type="text"
                        id="display-name-input"
                        maxlength="32"
                        placeholder="Display name"
                    >
                </div>

                <div class="form-group">
                    <label for="bio-input">
                        Bio
                    </label>

                    <textarea
                        id="bio-input"
                        maxlength="160"
                        placeholder="Tell people about yourself..."
                    ></textarea>
                </div>

                <p
                    class="auth-message"
                    id="message"
                ></p>

                <button id="save-button">
                    Save Profile
                </button>

                <button
                    class="secondary-button"
                    id="logout-button"
                >
                    Log Out
                </button>

                <div class="account-links">
                    <a href="../profile/">View Profile</a>
                    <a href="../search/">Search Users</a>
                    <a href="../friends/">Friends</a>
                    <a href="../settings/">Settings</a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/auth.js"></script>

    <script>
        let currentSession = null;
        let currentProfile = null;

        async function loadAccount() {
            currentSession = await requireAuth();

            if (!currentSession) {
                return;
            }

            currentProfile =
                await getProfile(currentSession.user.id);

            if (!currentProfile) {
                document.getElementById("loading").textContent =
                    "Unable to load your profile.";
                return;
            }

            document.getElementById("loading").hidden = true;
            document.getElementById("account-content").hidden = false;

            document.getElementById("username-input").value =
                currentProfile.username || "";

            document.getElementById("display-name-input").value =
                currentProfile.display_name || "";

            document.getElementById("bio-input").value =
                currentProfile.bio || "";

            updateProfilePreview();
        }

        function updateProfilePreview() {
            const avatar =
                document.getElementById("avatar");

            const avatarUrl =
                getAvatarUrl(currentProfile);

            if (avatarUrl) {
                avatar.innerHTML =
                    `<img src="${avatarUrl}" alt="Profile picture">`;
            } else {
                avatar.textContent =
                    getAvatarLetter(currentProfile);
            }

            document.getElementById("display-name").textContent =
                currentProfile.display_name ||
                currentProfile.username ||
                "Unnamed User";

            document.getElementById("username").textContent =
                currentProfile.username
                    ? "@" + currentProfile.username
                    : "No username";

            const badge =
                document.getElementById("verified-badge");

            badge.hidden =
                !currentProfile.is_verified;
        }

        document
            .getElementById("save-button")
            .addEventListener("click", async () => {
                const message =
                    document.getElementById("message");

                const username =
                    document
                        .getElementById("username-input")
                        .value
                        .trim();

                const displayName =
                    document
                        .getElementById("display-name-input")
                        .value
                        .trim();

                const bio =
                    document
                        .getElementById("bio-input")
                        .value
                        .trim();

                if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
                    message.textContent =
                        "Username must be 3–24 characters and only contain letters, numbers, and underscores.";
                    message.className =
                        "auth-message error";
                    return;
                }

                if (!displayName) {
                    message.textContent =
                        "Please enter a display name.";
                    message.className =
                        "auth-message error";
                    return;
                }

                const button =
                    document.getElementById("save-button");

                button.disabled = true;
                button.textContent = "Saving...";

                const { error } =
                    await window.supabaseClient
                        .from("profiles")
                        .update({
                            username,
                            display_name: displayName,
                            bio
                        })
                        .eq("id", currentSession.user.id);

                button.disabled = false;
                button.textContent = "Save Profile";

                if (error) {
                    console.error(error);

                    if (error.code === "23505") {
                        message.textContent =
                            "That username is already taken.";
                    } else {
                        message.textContent =
                            "Failed to save your profile.";
                    }

                    message.className =
                        "auth-message error";

                    return;
                }

                currentProfile.username = username;
                currentProfile.display_name = displayName;
                currentProfile.bio = bio;

                updateProfilePreview();

                message.textContent =
                    "Profile saved successfully.";

                message.className =
                    "auth-message success";
            });

        document
            .getElementById("avatar-input")
            .addEventListener("change", async (event) => {
                const file = event.target.files[0];

                if (!file || !currentSession) {
                    return;
                }

                const allowedTypes = [
                    "image/jpeg",
                    "image/png",
                    "image/webp"
                ];

                if (!allowedTypes.includes(file.type)) {
                    alert(
                        "Only JPEG, PNG, and WebP images are allowed."
                    );
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    alert(
                        "Profile pictures must be 5 MB or smaller."
                    );
                    return;
                }

                const extension =
                    file.type === "image/jpeg"
                        ? "jpg"
                        : file.type === "image/png"
                            ? "png"
                            : "webp";

                const path =
                    `${currentSession.user.id}/profile.${extension}`;

                const button =
                    document.querySelector(".upload-button");

                button.textContent = "Uploading...";

                const { error } =
                    await window.supabaseClient
                        .storage
                        .from("avatars")
                        .upload(path, file, {
                            upsert: true,
                            contentType: file.type
                        });

                if (error) {
                    console.error(error);

                    alert(
                        "Failed to upload profile picture."
                    );

                    button.textContent = "Change PFP";
                    return;
                }

                const { data } =
                    window.supabaseClient
                        .storage
                        .from("avatars")
                        .getPublicUrl(path);

                const avatarUrl =
                    data.publicUrl + "?t=" + Date.now();

                const { error: profileError } =
                    await window.supabaseClient
                        .from("profiles")
                        .update({
                            avatar_url: avatarUrl
                        })
                        .eq("id", currentSession.user.id);

                if (profileError) {
                    console.error(profileError);

                    alert(
                        "Picture uploaded, but the profile could not be updated."
                    );

                    button.textContent = "Change PFP";
                    return;
                }

                currentProfile.avatar_url =
                    avatarUrl;

                updateProfilePreview();

                button.textContent = "Change PFP";
            });

        document
            .getElementById("logout-button")
            .addEventListener("click", signOut);

        loadAccount();
    </script>
</body>
</html>
