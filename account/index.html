<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account — Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">
            <a href="/">Home</a>

            <a href="/search/" class="auth-only" hidden>
                Search
            </a>

            <a href="/friends/" class="auth-only" hidden>
                Friends
            </a>

            <a href="/settings/" class="auth-only" hidden>
                Settings
            </a>

            <a href="/account/" class="auth-only" hidden>
                Account
            </a>

            <a href="/login/" class="guest-only">
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link"
            >
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden
            >
                Log Out
            </button>
        </div>

    </div>
</nav>


<main class="page page-small">

    <div class="account-header">

        <div id="account-avatar" class="account-avatar empty"></div>

        <div>
            <h1 id="account-name" class="account-name">
                Loading...
            </h1>

            <div
                id="account-username"
                class="account-username"
            >
                Loading...
            </div>
        </div>

    </div>


    <section class="card">

        <h2 class="section-title">
            Account Information
        </h2>

        <div class="form-group">
            <label class="form-label">
                Email
            </label>

            <input
                id="account-email"
                type="email"
                class="account-field"
                readonly
            >
        </div>

        <div class="form-group">
            <label class="form-label">
                Username
            </label>

            <input
                id="account-username-field"
                type="text"
                class="account-field"
                readonly
            >
        </div>

        <div class="form-group">
            <label class="form-label">
                Display Name
            </label>

            <input
                id="account-display-name"
                type="text"
                class="account-field"
                readonly
            >
        </div>

    </section>


    <section class="card">

        <h2 class="section-title">
            Profile
        </h2>

        <div
            id="account-bio"
            style="
                color:#c7c7d0;
                white-space:pre-wrap;
            "
        >
            No bio yet.
        </div>

        <div
            class="button-row"
            style="margin-top:18px;"
        >
            <a
                href="/profile/"
                class="button"
            >
                Edit Profile
            </a>
        </div>

    </section>

</main>


<script>
document.addEventListener("DOMContentLoaded", async () => {

    const session = await initNavbar();

    if (!session) {
        window.location.href = "/login/";
        return;
    }

    const profile = await getProfile(session.user.id);

    if (!profile) {
        document.getElementById("account-name").textContent =
            "Account";

        document.getElementById("account-username").textContent =
            "Profile unavailable";

        document.getElementById("account-email").value =
            session.user.email || "";

        return;
    }

    const displayName =
        profile.display_name ||
        profile.username ||
        "Account";

    const username =
        profile.username ||
        "No username";

    document.getElementById("account-name").textContent =
        displayName;

    document.getElementById("account-username").textContent =
        `@${username}`;

    document.getElementById("account-email").value =
        session.user.email || "";

    document.getElementById("account-username-field").value =
        profile.username || "";

    document.getElementById("account-display-name").value =
        profile.display_name || "";

    document.getElementById("account-bio").textContent =
        profile.bio || "No bio yet.";


    const avatarContainer =
        document.getElementById("account-avatar");

    avatarContainer.innerHTML = "";

    const avatarUrl = getAvatarUrl(profile);

    if (avatarUrl) {
        const image = document.createElement("img");

        image.src = avatarUrl;
        image.alt = "";

        image.onerror = () => {
            image.remove();
        };

        avatarContainer.appendChild(image);
    }
});
</script>

</body>
</html>
