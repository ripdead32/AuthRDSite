<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account - Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="/">Home</a>
            <a href="/search/" class="auth-only" hidden>Search</a>
            <a href="/friends/" class="auth-only" hidden>Friends</a>
            <a href="/settings/" class="auth-only" hidden>Settings</a>
            <a href="/account/" class="auth-only" hidden>Account</a>

            <a href="/login/" class="guest-only">Log In</a>

            <a href="/signup/" class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>

        </div>

    </div>
</nav>

<main class="auth-container">

    <section class="auth-card">

        <div id="account-loading">
            <span class="auth-eyebrow">
                RIP_DEAD ACCOUNT
            </span>

            <h1>Loading account...</h1>
        </div>

        <div id="account-content" hidden>

            <div id="avatar-container"></div>

            <span
                id="verification"
                class="verified-badge">
            </span>

            <h1 id="display-name"></h1>

            <p id="username" class="auth-subtitle"></p>

            <p id="email"></p>

            <p id="bio"></p>

            <div class="auth-actions">

                <a
                    href="/profile/"
                    class="button-link">
                    Edit Profile
                </a>

                <a
                    href="/search/"
                    class="button-link">
                    Find Users
                </a>

                <a
                    href="/friends/"
                    class="button-link">
                    Friends
                </a>

            </div>

        </div>

        <div
            id="account-message"
            class="auth-message"
            aria-live="polite">
        </div>

    </section>

</main>

<script>
async function initializeAccount() {

    const session =
        await requireAuth();

    if (!session) {
        return;
    }

    await initNavbar();

    const loading =
        document.getElementById(
            "account-loading"
        );

    const content =
        document.getElementById(
            "account-content"
        );

    const message =
        document.getElementById(
            "account-message"
        );

    const profile =
        await getProfile(
            session.user.id
        );

    if (!profile) {

        loading.hidden = true;

        setMessage(
            message,
            "Could not load your profile.",
            "error"
        );

        return;
    }

    document.getElementById(
        "display-name"
    ).textContent =
        profile.display_name ||
        profile.username ||
        "Account";

    document.getElementById(
        "username"
    ).textContent =
        profile.username
            ? "@" + profile.username
            : "";

    document.getElementById(
        "email"
    ).textContent =
        session.user.email || "";

    document.getElementById(
        "bio"
    ).textContent =
        profile.bio ||
        "No bio yet.";

    const verification =
        document.getElementById(
            "verification"
        );

    verification.textContent =
        profile.is_verified
            ? "✓ Verified"
            : "";

    const avatarContainer =
        document.getElementById(
            "avatar-container"
        );

    avatarContainer.innerHTML = "";

    avatarContainer.appendChild(
        createAvatar(
            profile,
            "profile-avatar"
        )
    );

    loading.hidden = true;
    content.hidden = false;
}

initializeAccount();
</script>

</body>
</html>
