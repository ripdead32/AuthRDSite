<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account - Rip_Dead Authentication</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a
            href="../"
            class="navbar-brand"
        >
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="../">
                Home
            </a>

            <a href="../search/">
                Search
            </a>

            <a href="../friends/">
                Friends
            </a>

            <a href="../settings/">
                Settings
            </a>

            <a href="../account/">
                Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="navbar-logout"
            >
                Log Out
            </button>

        </div>

    </div>

</nav>

<main class="auth-container">

    <div class="auth-card">

        <div class="account-header">

            <div
                id="account-avatar"
                class="account-avatar"
            >
                ?
            </div>

            <h1 id="display-name">
                Loading account
            </h1>

            <p
                id="username"
                class="username"
            ></p>

            <div
                id="verified"
                class="verified-badge"
                hidden
            >
                Verified
            </div>

            <p
                id="bio"
                class="profile-bio"
            ></p>

        </div>

        <div class="profile-stats">

            <div>
                <strong id="friend-count">
                    0
                </strong>

                <span>
                    Friends
                </span>
            </div>

            <div>
                <strong id="follower-count">
                    0
                </strong>

                <span>
                    Followers
                </span>
            </div>

            <div>
                <strong id="following-count">
                    0
                </strong>

                <span>
                    Following
                </span>
            </div>

        </div>

        <div
            id="account-message"
            class="auth-message"
        ></div>

        <div class="account-links">

            <a
                href="../profile/"
                class="button-link"
            >
                Edit Profile
            </a>

            <a
                href="../settings/"
                class="button-link secondary-button"
            >
                Settings
            </a>

        </div>

    </div>

</main>

<script>
async function initializeAccount() {

    const session =
        await requireAuth();

    if (!session) {
        return;
    }

    const profile =
        await getProfile(
            session.user.id
        );

    if (!profile) {

        setMessage(
            document.getElementById(
                "account-message"
            ),
            "Unable to load your profile.",
            "error"
        );

        return;
    }

    document.getElementById(
        "display-name"
    ).textContent =
        profile.display_name ||
        profile.username ||
        "Rip_Dead User";

    document.getElementById(
        "username"
    ).textContent =
        profile.username
            ? "@" + profile.username
            : "";

    document.getElementById(
        "bio"
    ).textContent =
        profile.bio || "";

    if (profile.is_verified) {

        document.getElementById(
            "verified"
        ).hidden = false;
    }

    const avatar =
        document.getElementById(
            "account-avatar"
        );

    if (profile.avatar_url) {

        avatar.innerHTML =
            "<img src=\"" +
            profile.avatar_url +
            "\" alt=\"\">";

    } else {

        avatar.textContent =
            getAvatarLetter(profile);
    }

    const userId =
        session.user.id;

    const { count: friendCount } =
        await window.supabaseClient
            .from("friendships")
            .select(
                "*",
                {
                    count: "exact",
                    head: true
                }
            )
            .or(
                "requester_id.eq." +
                userId +
                ",addressee_id.eq." +
                userId
            )
            .eq(
                "status",
                "accepted"
            );

    const { count: followerCount } =
        await window.supabaseClient
            .from("follows")
            .select(
                "*",
                {
                    count: "exact",
                    head: true
                }
            )
            .eq(
                "following_id",
                userId
            );

    const { count: followingCount } =
        await window.supabaseClient
            .from("follows")
            .select(
                "*",
                {
                    count: "exact",
                    head: true
                }
            )
            .eq(
                "follower_id",
                userId
            );

    document.getElementById(
        "friend-count"
    ).textContent =
        friendCount || 0;

    document.getElementById(
        "follower-count"
    ).textContent =
        followerCount || 0;

    document.getElementById(
        "following-count"
    ).textContent =
        followingCount || 0;

    await initNavbar();
}

initializeAccount();
</script>

</body>
</html>
