<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account - Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/search/" class="auth-only" hidden>Search</a>
            <a href="/friends/" class="auth-only" hidden>Friends</a>
            <a href="/settings/" class="auth-only" hidden>Settings</a>
            <a href="/account/" class="auth-only" hidden>Account</a>

            <a href="/login/" class="guest-only">Log In</a>
            <a href="/signup/" class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>
        </div>

    </div>
</nav>

<main class="auth-container">

    <section class="auth-card">

        <h1 id="welcome">
            Loading account...
        </h1>

        <p class="auth-subtitle" id="email">
            Loading...
        </p>

        <div id="account-content">

            <div id="avatar-container"></div>

            <h2 id="display-name"></h2>

            <p id="username"></p>

            <p id="bio"></p>

            <p id="verification"></p>

            <div class="auth-actions">

                <a
                    href="/profile/"
                    class="button-link">
                    Edit Profile
                </a>

                <a
                    href="/settings/"
                    class="button-link">
                    Settings
                </a>

            </div>

        </div>

        <div
            id="message"
            class="auth-message"
            aria-live="polite">
        </div>

    </section>

</main>

<script>
async function initializeAccount() {

    const session =
        await requireAuth();

    if (!session) {
        return;
    }

    await initNavbar();

    const message =
        document.getElementById("message");

    const welcome =
        document.getElementById("welcome");

    const email =
        document.getElementById("email");

    const displayName =
        document.getElementById("display-name");

    const username =
        document.getElementById("username");

    const bio =
        document.getElementById("bio");

    const verification =
        document.getElementById("verification");

    const avatarContainer =
        document.getElementById("avatar-container");

    email.textContent =
        session.user.email || "";

    const profile =
        await getProfile(session.user.id);

    if (!profile) {

        welcome.textContent =
            "Account";

        setMessage(
            message,
            "Your account profile could not be loaded.",
            "error"
        );

        return;
    }

    const name =
        profile.display_name ||
        profile.username ||
        "Account";

    welcome.textContent =
        "Welcome, " + name;

    displayName.textContent =
        profile.display_name || "";

    username.textContent =
        profile.username
            ? "@" + profile.username
            : "";

    bio.textContent =
        profile.bio || "No bio yet.";

    if (profile.is_verified) {

        verification.textContent =
            "✓ Verified";

        verification.className =
            "verified-badge";

    } else {

        verification.textContent =
            "";
    }

    avatarContainer.innerHTML = "";

    const avatar =
        createAvatar(
            profile,
            "profile-avatar"
        );

    avatarContainer.appendChild(
        avatar
    );
}

initializeAccount();
</script>

</body>
</html>
