<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account — Rip_Dead Account</title>

    <link rel="stylesheet" href="/css/auth.css">

    <style>
        #account-avatar {
            width: 96px;
            height: 96px;
            min-width: 96px;
            min-height: 96px;
            overflow: hidden;
            border-radius: 50%;
        }

        #account-avatar img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
        }
    </style>
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Account
        </a>

        <div class="navbar-links">

            <a href="/">
                Home
            </a>

            <a
                href="/search/"
                class="auth-only"
                hidden
            >
                Search
            </a>

            <a
                href="/friends/"
                class="auth-only"
                hidden
            >
                Friends
            </a>

            <a
                href="/chat/"
                class="auth-only"
                hidden
            >
                Chat
            </a>

            <a
                href="/settings/"
                class="auth-only"
                hidden
            >
                Settings
            </a>

            <a
                href="/account/"
                class="auth-only"
                hidden
            >
                Account
            </a>

            <a
                href="/login/"
                class="guest-only"
            >
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link"
            >
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden
            >
                Log Out
            </button>

        </div>

    </div>

</nav>


<main class="page page-small">

    <section class="card">

        <div class="page-header">

            <div>

                <h1>
                    Your Account
                </h1>

                <p>
                    Manage your Rip_Dead Account profile.
                </p>

            </div>

        </div>


        <div
            id="account-message"
            class="message"
            hidden
        ></div>


        <div class="account-profile">

            <div
                id="account-avatar"
                class="account-avatar empty"
            ></div>

            <div class="account-profile-info">

                <div
                    id="account-name"
                    class="account-name"
                >
                    Loading...
                </div>

                <div
                    id="account-username"
                    class="account-username"
                >
                    @loading
                </div>

            </div>

        </div>


        <div class="form-group">

            <label for="account-email">
                Email
            </label>

            <input
                id="account-email"
                class="account-field"
                type="email"
                readonly
            >

        </div>


        <div class="form-group">

            <label for="account-username-field">
                Username
            </label>

            <input
                id="account-username-field"
                class="account-field"
                type="text"
                readonly
            >

        </div>


        <div class="form-group">

            <label for="account-display-name">
                Display Name
            </label>

            <input
                id="account-display-name"
                class="account-field"
                type="text"
                readonly
            >

        </div>


        <div class="form-group">

            <label for="account-bio">
                Bio
            </label>

            <textarea
                id="account-bio"
                class="account-field"
                rows="4"
                readonly
            ></textarea>

        </div>


        <div class="button-row">

            <a
                href="/settings/"
                class="button"
            >
                Edit Profile
            </a>

            <a
                href="/user/"
                id="view-profile-button"
                class="button secondary"
            >
                Public Profile
            </a>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>


<script>

document.addEventListener("DOMContentLoaded", async () => {

    const message =
        document.getElementById("account-message");

    const accountAvatar =
        document.getElementById("account-avatar");

    const accountName =
        document.getElementById("account-name");

    const accountUsername =
        document.getElementById("account-username");

    const emailField =
        document.getElementById("account-email");

    const usernameField =
        document.getElementById("account-username-field");

    const displayNameField =
        document.getElementById("account-display-name");

    const bioField =
        document.getElementById("account-bio");


    try {

        const session =
            await initNavbar();


        if (!session) {

            window.location.href =
                "/login/";

            return;
        }


        const profile =
            await getProfile(session.user.id);


        if (!profile) {

            message.textContent =
                "Could not load your profile.";

            message.hidden = false;

            return;
        }


        const displayName =
            profile.display_name ||
            profile.username ||
            "Rip_Dead User";


        const username =
            profile.username ||
            "unknown";


        accountName.textContent =
            displayName;


        accountUsername.textContent =
            "@" + username;


        if (profile.is_verified) {

            const badge =
                document.createElement("span");

            badge.className =
                "verified-badge";

            badge.textContent =
                "✓";

            badge.title =
                "Verified account";

            badge.setAttribute(
                "aria-label",
                "Verified account"
            );

            badge.style.display =
                "inline-flex";

            badge.style.alignItems =
                "center";

            badge.style.justifyContent =
                "center";

            badge.style.marginLeft =
                "8px";

            badge.style.width =
                "20px";

            badge.style.height =
                "20px";

            badge.style.borderRadius =
                "50%";

            badge.style.background =
                "var(--purple-hover)";

            badge.style.color =
                "#ffffff";

            badge.style.fontSize =
                "13px";

            badge.style.fontWeight =
                "900";


            accountName.appendChild(
                badge
            );
        }


        emailField.value =
            session.user.email || "";


        usernameField.value =
            profile.username || "";


        displayNameField.value =
            profile.display_name || "";


        bioField.value =
            profile.bio || "";


        const avatarUrl =
            getAvatarUrl(profile);


        if (avatarUrl) {

            accountAvatar.classList.remove(
                "empty"
            );


            const image =
                document.createElement("img");


            image.src =
                avatarUrl;


            image.alt =
                "Profile avatar";


            image.width =
                96;


            image.height =
                96;


            image.style.width =
                "100%";


            image.style.height =
                "100%";


            image.style.maxWidth =
                "100%";


            image.style.maxHeight =
                "100%";


            image.style.objectFit =
                "cover";


            image.style.objectPosition =
                "center";


            image.style.display =
                "block";


            image.style.borderRadius =
                "50%";


            accountAvatar.innerHTML =
                "";


            accountAvatar.appendChild(
                image
            );
        }


        document.title =
            `${displayName} — Rip_Dead Account`;


        const publicProfileButton =
            document.getElementById(
                "view-profile-button"
            );


        publicProfileButton.href =
            `/user/?id=${encodeURIComponent(
                session.user.id
            )}`;

    } catch (error) {

        console.error(error);


        message.textContent =
            "Something went wrong while loading your account.";


        message.hidden = false;
    }

});

</script>

</body>
</html>
```
