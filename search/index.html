<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search - Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="/">
                Home
            </a>

            <a
                href="/search/"
                class="auth-only"
                hidden>
                Search
            </a>

            <a
                href="/friends/"
                class="auth-only"
                hidden>
                Friends
            </a>

            <a
                href="/settings/"
                class="auth-only"
                hidden>
                Settings
            </a>

            <a
                href="/account/"
                class="auth-only"
                hidden>
                Account
            </a>

            <a
                href="/login/"
                class="guest-only">
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>

        </div>

    </div>
</nav>


<main class="page page-small">

    <div class="page-header">

        <span style="
            display: block;
            margin-bottom: 10px;
            color: var(--purple-hover);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.12em;
        ">
            RIP_DEAD SOCIAL
        </span>

        <h1>
            Search Users
        </h1>

        <p>
            Find people on Rip_Dead.
        </p>

    </div>


    <section class="card">

        <form id="search-form">

            <div class="form-group">

                <label for="search-input">
                    Username or display name
                </label>

                <input
                    type="search"
                    id="search-input"
                    maxlength="64"
                    placeholder="Search for someone..."
                    autocomplete="off"
                    required>

            </div>

            <button type="submit">
                Search
            </button>

        </form>


        <div
            id="search-message"
            class="message"
            aria-live="polite">
        </div>


        <div
            id="search-results"
            style="margin-top: 18px;">
        </div>

    </section>

</main>


<script>

let searchSession = null;

const searchForm =
    document.getElementById("search-form");

const searchInput =
    document.getElementById("search-input");

const searchResults =
    document.getElementById("search-results");

const searchMessage =
    document.getElementById("search-message");


async function initializeSearch() {

    searchSession =
        await requireAuth();

    if (!searchSession) {
        return;
    }

    await initNavbar();
}


function createSearchResult(profile) {

    const card =
        document.createElement("div");

    card.className = "user-card";


    const avatar =
        createAvatar(
            profile,
            "user-avatar"
        );


    const information =
        document.createElement("div");

    information.className = "user-info";


    const name =
        document.createElement("div");

    name.className = "user-name";

    name.textContent =
        profile.display_name ||
        profile.username ||
        "Unknown User";


    const username =
        document.createElement("div");

    username.className = "user-username";

    username.textContent =
        profile.username
            ? "@" + profile.username
            : "";


    information.appendChild(name);
    information.appendChild(username);


    if (profile.is_verified) {

        const badge =
            document.createElement("span");

        badge.className = "verified-badge";

        badge.textContent =
            "✓ Verified";

        badge.style.display = "inline-block";
        badge.style.marginTop = "5px";
        badge.style.color = "var(--purple-hover)";
        badge.style.fontSize = "12px";
        badge.style.fontWeight = "700";

        information.appendChild(badge);
    }


    const viewButton =
        document.createElement("a");

    viewButton.href =
        "/user/?id=" +
        encodeURIComponent(profile.id);

    viewButton.className =
        "button secondary";

    viewButton.textContent =
        "View Profile";


    card.appendChild(avatar);
    card.appendChild(information);
    card.appendChild(viewButton);


    return card;
}


searchForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const query =
            searchInput.value.trim();


        if (!query) {
            return;
        }


        searchResults.innerHTML = "";


        setMessage(
            searchMessage,
            "Searching...",
            ""
        );


        /*
         * ilike provides case-insensitive
         * partial matching.
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, username, display_name, avatar_url, bio, is_verified"
                )
                .or(
                    `username.ilike.%${query}%,display_name.ilike.%${query}%`
                )
                .neq(
                    "id",
                    searchSession.user.id
                )
                .limit(25);


        if (error) {

            console.error(
                "Search error:",
                error
            );

            setMessage(
                searchMessage,
                error.message,
                "error"
            );

            return;
        }


        if (
            !data ||
            data.length === 0
        ) {

            setMessage(
                searchMessage,
                "No users found.",
                ""
            );

            return;
        }


        setMessage(
            searchMessage,
            `${data.length} user${data.length === 1 ? "" : "s"} found.`,
            "success"
        );


        data.forEach(
            (profile) => {

                searchResults.appendChild(
                    createSearchResult(
                        profile
                    )
                );

            }
        );

    }
);


initializeSearch();

</script>

</body>
</html>
