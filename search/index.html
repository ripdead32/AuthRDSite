<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search - Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/search/" class="auth-only" hidden>Search</a>
            <a href="/friends/" class="auth-only" hidden>Friends</a>
            <a href="/settings/" class="auth-only" hidden>Settings</a>
            <a href="/account/" class="auth-only" hidden>Account</a>

            <a href="/login/" class="guest-only">Log In</a>

            <a href="/signup/" class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>
        </div>

    </div>
</nav>

<main class="auth-container">

    <section class="auth-card">

        <h1>Search Users</h1>

        <p class="auth-subtitle">
            Find people on Rip_Dead.
        </p>

        <form id="search-form">

            <label for="search-input">
                Username or display name
            </label>

            <input
                type="search"
                id="search-input"
                placeholder="Search users..."
                autocomplete="off"
                maxlength="64"
                required>

            <button type="submit">
                Search
            </button>

        </form>

        <div
            id="search-message"
            class="auth-message"
            aria-live="polite">
        </div>

        <div id="search-results"></div>

    </section>

</main>

<script>
let searchSession = null;

const searchForm =
    document.getElementById("search-form");

const searchInput =
    document.getElementById("search-input");

const searchResults =
    document.getElementById("search-results");

const searchMessage =
    document.getElementById("search-message");

async function initializeSearch() {

    searchSession =
        await requireAuth();

    if (!searchSession) {
        return;
    }

    await initNavbar();
}

function clearResults() {
    searchResults.innerHTML = "";
}

function createSearchResult(profile) {

    const card =
        document.createElement("div");

    card.className =
        "search-result";

    const avatar =
        createAvatar(
            profile,
            "search-result-avatar"
        );

    const information =
        document.createElement("div");

    information.className =
        "search-result-info";

    const name =
        document.createElement("h3");

    name.textContent =
        profile.display_name ||
        profile.username ||
        "Unknown User";

    const username =
        document.createElement("p");

    username.textContent =
        profile.username
            ? "@" + profile.username
            : "";

    information.appendChild(name);
    information.appendChild(username);

    if (profile.is_verified) {

        const badge =
            document.createElement("span");

        badge.className =
            "verified-badge";

        badge.textContent =
            "✓ Verified";

        information.appendChild(
            badge
        );
    }

    const viewButton =
        document.createElement("a");

    viewButton.className =
        "button-link";

    viewButton.href =
        "/user/?id=" +
        encodeURIComponent(profile.id);

    viewButton.textContent =
        "View Profile";

    card.appendChild(avatar);
    card.appendChild(information);
    card.appendChild(viewButton);

    return card;
}

searchForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if (!searchSession) {
            return;
        }

        const query =
            searchInput.value.trim();

        if (!query) {
            return;
        }

        clearResults();

        setMessage(
            searchMessage,
            "Searching...",
            ""
        );

        /*
         * Search username and display name.
         *
         * The profiles SELECT policy allows
         * authenticated users to view profiles.
         */
        const escapedQuery =
            query
                .replace(/\\/g, "\\\\")
                .replace(/%/g, "\\%")
                .replace(/_/g, "\\_");

        const {
            data,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, username, display_name, avatar_url, bio, is_verified"
                )
                .or(
                    `username.ilike.%${escapedQuery}%,display_name.ilike.%${escapedQuery}%`
                )
                .neq(
                    "id",
                    searchSession.user.id
                )
                .limit(25);

        if (error) {

            console.error(
                "Search error:",
                error
            );

            setMessage(
                searchMessage,
                "Search failed: " +
                error.message,
                "error"
            );

            return;
        }

        if (!data || data.length === 0) {

            setMessage(
                searchMessage,
                "No users found.",
                ""
            );

            return;
        }

        setMessage(
            searchMessage,
            `${data.length} user${data.length === 1 ? "" : "s"} found.`,
            "success"
        );

        data.forEach(profile => {

            searchResults.appendChild(
                createSearchResult(profile)
            );

        });
    }
);

initializeSearch();
</script>

</body>
</html>
