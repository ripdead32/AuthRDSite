<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | Rip_Dead</title>
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-logo">
                <div class="logo-mark">RD</div>
                <h1>Rip_Dead</h1>
            </div>

            <div class="auth-header">
                <h2>Search Users</h2>
                <p>Find Rip_Dead accounts.</p>
            </div>

            <div class="search-row">
                <input
                    type="search"
                    id="search-input"
                    placeholder="Search username or display name..."
                    maxlength="32"
                >

                <button id="search-button">
                    Search
                </button>
            </div>

            <div id="results"></div>

            <div class="account-links">
                <a href="../account/">My Account</a>
                <a href="../friends/">Friends</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/auth.js"></script>

    <script>
        async function init() {
            await requireAuth();
        }

        async function searchUsers() {
            const input =
                document.getElementById("search-input");

            const results =
                document.getElementById("results");

            const query =
                input.value.trim();

            if (!query) {
                results.innerHTML =
                    "<p class='search-empty'>Enter something to search for.</p>";
                return;
            }

            results.innerHTML =
                "<p class='search-empty'>Searching...</p>";

            const { data, error } =
                await window.supabaseClient
                    .from("profiles")
                    .select(
                        "id, username, display_name, avatar_url, bio, is_verified"
                    )
                    .or(
                        `username.ilike.%${query}%,display_name.ilike.%${query}%`
                    )
                    .limit(25);

            if (error) {
                console.error(error);

                results.innerHTML =
                    "<p class='search-empty'>Search failed.</p>";

                return;
            }

            if (!data.length) {
                results.innerHTML =
                    "<p class='search-empty'>No users found.</p>";

                return;
            }

            results.innerHTML = "";

            data.forEach(profile => {
                const card =
                    document.createElement("a");

                card.className = "user-result";

                card.href =
                    "../profile/?username=" +
                    encodeURIComponent(
                        profile.username || ""
                    );

                const avatar =
                    document.createElement("div");

                avatar.className =
                    "result-avatar";

                if (profile.avatar_url) {
                    avatar.innerHTML =
                        `<img src="${profile.avatar_url}" alt="">`;
                } else {
                    avatar.textContent =
                        getAvatarLetter(profile);
                }

                const info =
                    document.createElement("div");

                info.className =
                    "result-info";

                const name =
                    document.createElement("strong");

                name.textContent =
                    profile.display_name ||
                    profile.username ||
                    "Unnamed User";

                const username =
                    document.createElement("span");

                username.textContent =
                    profile.username
                        ? "@" + profile.username
                        : "";

                info.appendChild(name);
                info.appendChild(username);

                if (profile.is_verified) {
                    const badge =
                        document.createElement("span");

                    badge.className =
                        "verified-badge small";

                    badge.textContent = "✓ Verified";

                    info.appendChild(badge);
                }

                card.appendChild(avatar);
                card.appendChild(info);

                results.appendChild(card);
            });
        }

        document
            .getElementById("search-button")
            .addEventListener("click", searchUsers);

        document
            .getElementById("search-input")
            .addEventListener("keydown", event => {
                if (event.key === "Enter") {
                    searchUsers();
                }
            });

        init();
    </script>
</body>
</html>
