<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search — Rip_Dead ID</title>

    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead ID
        </a>

        <div class="navbar-links">

            <a href="/">
                Home
            </a>

            <a
                href="/search/"
                class="auth-only"
                hidden
            >
                Search
            </a>

            <a
                href="/friends/"
                class="auth-only"
                hidden
            >
                Friends
            </a>

            <a
                href="/settings/"
                class="auth-only"
                hidden
            >
                Settings
            </a>

            <a
                href="/account/"
                class="auth-only"
                hidden
            >
                Account
            </a>

            <a
                href="/login/"
                class="guest-only"
            >
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link"
            >
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden
            >
                Log Out
            </button>

        </div>

    </div>

</nav>


<main class="page page-small">

    <section class="card">

        <div class="page-header">

            <div>

                <h1>Find Users</h1>

                <p>
                    Search for Rip_Dead ID users.
                </p>

            </div>

        </div>


        <div class="search-row">

            <input
                id="user-search"
                type="search"
                placeholder="Search username or display name..."
                autocomplete="off"
            >

            <button
                id="search-button"
                class="button"
                type="button"
            >
                Search
            </button>

        </div>


        <div
            id="search-message"
            class="message"
            hidden
        ></div>


        <div
            id="search-results"
            class="user-list"
        ></div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

    const input =
        document.getElementById("user-search");

    const button =
        document.getElementById("search-button");

    const results =
        document.getElementById("search-results");

    const message =
        document.getElementById("search-message");


    const session =
        await initNavbar();


    if (!session) {
        window.location.href = "/login/";
        return;
    }


    async function performSearch() {

        const query =
            input.value.trim();


        results.innerHTML = "";
        message.hidden = true;


        if (!query) {

            message.textContent =
                "Enter a username or display name to search.";

            message.hidden = false;

            return;
        }


        button.disabled = true;
        button.textContent = "Searching...";


        try {

            const escapedQuery =
                query
                    .replace(/\\/g, "\\\\")
                    .replace(/%/g, "\\%")
                    .replace(/_/g, "\\_");


            const {
                data,
                error
            } = await supabaseClient
                .from("profiles")
                .select(
                    "id, username, display_name, avatar_url, bio, is_verified"
                )
                .or(
                    `username.ilike.%${escapedQuery}%,display_name.ilike.%${escapedQuery}%`
                )
                .neq(
                    "id",
                    session.user.id
                )
                .limit(25);


            if (error) {
                throw error;
            }


            if (!data || data.length === 0) {

                message.textContent =
                    "No users found.";

                message.hidden = false;

                return;
            }


            data.forEach(profile => {

                const userCard =
                    document.createElement("div");

                userCard.className =
                    "user-card";


                const avatar =
                    createAvatar(
                        profile,
                        "user-avatar"
                    );


                const userInfo =
                    document.createElement("div");

                userInfo.className =
                    "user-info";


                const name =
                    document.createElement("div");

                name.className =
                    "user-name";

                name.textContent =
                    profile.display_name ||
                    profile.username ||
                    "Rip_Dead User";


                if (profile.is_verified) {

                    const verified =
                        document.createElement("span");

                    verified.className =
                        "verified-text";

                    verified.textContent =
                        "✓ Verified";

                    name.appendChild(verified);
                }


                const username =
                    document.createElement("div");

                username.className =
                    "user-username";

                username.textContent =
                    "@" +
                    (
                        profile.username ||
                        "unknown"
                    );


                const actions =
                    document.createElement("div");

                actions.className =
                    "user-actions";


                const viewButton =
                    document.createElement("a");

                viewButton.className =
                    "button secondary";

                viewButton.textContent =
                    "View Profile";

                viewButton.href =
                    `/user/?id=${encodeURIComponent(profile.id)}`;


                actions.appendChild(viewButton);


                userInfo.appendChild(name);
                userInfo.appendChild(username);


                userCard.appendChild(avatar);
                userCard.appendChild(userInfo);
                userCard.appendChild(actions);


                results.appendChild(userCard);

            });

        } catch (error) {

            console.error(error);

            message.textContent =
                "Something went wrong while searching.";

            message.hidden = false;

        } finally {

            button.disabled = false;
            button.textContent = "Search";

        }

    }


    button.addEventListener(
        "click",
        performSearch
    );


    input.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                performSearch();
            }

        }
    );

});

</script>

</body>
</html>
