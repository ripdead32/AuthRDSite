<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search - Rip_Dead Authentication</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a
            href="../"
            class="navbar-brand"
        >
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="../">
                Home
            </a>

            <a href="../search/">
                Search
            </a>

            <a href="../friends/">
                Friends
            </a>

            <a href="../settings/">
                Settings
            </a>

            <a href="../account/">
                Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="navbar-logout"
            >
                Log Out
            </button>

        </div>

    </div>

</nav>

<main class="auth-container">

    <div class="auth-card wide">

        <div class="auth-header">

            <h1>Search Users</h1>

            <p>
                Find Rip_Dead users by username or display name.
            </p>

        </div>

        <form
            id="search-form"
            class="search-row"
        >

            <input
                type="search"
                id="search-input"
                placeholder="Search users..."
                maxlength="64"
                required
            >

            <button type="submit">
                Search
            </button>

        </form>

        <div
            id="search-message"
            class="auth-message"
        ></div>

        <div id="results"></div>

    </div>

</main>

<script>
let currentUserId = null;

async function initializeSearch() {

    const session =
        await requireAuth();

    if (!session) {
        return;
    }

    currentUserId =
        session.user.id;

    await initNavbar();
}

document
    .getElementById("search-form")
    .addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const query =
                document
                    .getElementById(
                        "search-input"
                    )
                    .value
                    .trim();

            const results =
                document.getElementById(
                    "results"
                );

            const message =
                document.getElementById(
                    "search-message"
                );

            results.innerHTML = "";

            if (!query) {
                return;
            }

            setMessage(
                message,
                "Searching..."
            );

            const { data, error } =
                await window.supabaseClient
                    .from("profiles")
                    .select("*")
                    .or(
                        "username.ilike.%" +
                        query +
                        "%,display_name.ilike.%" +
                        query +
                        "%"
                    )
                    .neq(
                        "id",
                        currentUserId
                    )
                    .limit(30);

            if (error) {

                console.error(
                    "Search error:",
                    error
                );

                setMessage(
                    message,
                    error.message,
                    "error"
                );

                return;
            }

            setMessage(message, "");

            if (!data || data.length === 0) {

                results.innerHTML =
                    "<div class=\"search-empty\">" +
                    "No users found." +
                    "</div>";

                return;
            }

            data.forEach((profile) => {

                const item =
                    document.createElement(
                        "a"
                    );

                item.className =
                    "user-result";

                item.href =
                    "../profile/?id=" +
                    encodeURIComponent(
                        profile.id
                    );

                const avatar =
                    createAvatar(
                        profile,
                        "result-avatar"
                    );

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "result-info";

                const name =
                    document.createElement(
                        "strong"
                    );

                name.textContent =
                    profile.display_name ||
                    profile.username ||
                    "User";

                const username =
                    document.createElement(
                        "span"
                    );

                username.textContent =
                    profile.username
                        ? "@" +
                          profile.username
                        : "";

                info.appendChild(name);
                info.appendChild(username);

                if (profile.is_verified) {

                    const verified =
                        document.createElement(
                            "span"
                        );

                    verified.textContent =
                        "Verified";

                    verified.className =
                        "verified-badge small";

                    info.appendChild(
                        verified
                    );
                }

                item.appendChild(avatar);
                item.appendChild(info);

                results.appendChild(item);
            });
        }
    );

initializeSearch();
</script>

</body>
</html>
