<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search - Rip_Dead Account</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .search-page {
            width: min(900px, calc(100% - 32px));
            margin: 32px auto;
        }

        .search-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
        }

        .search-card h1 {
            margin: 0 0 8px;
        }

        .search-card > p {
            margin-top: 0;
            color: var(--muted);
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .search-form input {
            flex: 1;
        }

        .search-form button {
            flex: 0 0 auto;
        }

        .search-results {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-user {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 13px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background: var(--panel-2);
        }

        .search-user:hover {
            background: var(--panel-3);
        }

        .search-user-info {
            min-width: 0;
            flex: 1;
        }

        .search-user-name-row {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .search-user-name {
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-user-username {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .search-user-bio {
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .search-avatar {
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 50%;
            overflow: hidden;
        }

        .search-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 18px;
            height: 18px;
            min-width: 18px;

            margin-left: 6px;

            border-radius: 50%;

            background: var(--purple);
            color: white;

            font-size: 11px;
            font-weight: 900;
        }

        .search-empty {
            padding: 35px 20px;

            text-align: center;
            color: var(--muted);

            border: 1px dashed var(--border);
            border-radius: 11px;
        }

        .search-error {
            padding: 12px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--panel-3);

            color: inherit;
        }

        @media (max-width: 600px) {
            .search-form {
                flex-direction: column;
            }

            .search-form button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="navbar-brand"
        >
            Rip_Dead Account
        </a>

        <div class="navbar-links">

            <a href="/">
                Home
            </a>

            <a
                href="/search/"
                class="auth-only"
                hidden
            >
                Search
            </a>

            <a
                href="/friends/"
                class="auth-only"
                hidden
            >
                Friends
            </a>

            <a
                href="/chat/"
                class="auth-only"
                hidden
            >
                Chat
            </a>

            <a
                href="/apps/"
                class="auth-only"
                hidden
            >
                Authorized Apps
            </a>

            <a
                href="/settings/"
                class="auth-only"
                hidden
            >
                Settings
            </a>

            <a
                href="/account/"
                class="auth-only"
                hidden
            >
                Account
            </a>

            <a
                href="/login/"
                class="guest-only"
            >
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link"
            >
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden
            >
                Log Out
            </button>

        </div>

    </div>

</nav>


<main class="search-page">

    <section class="search-card">

        <h1>
            Search
        </h1>

        <p>
            Find Rip_Dead Account users by username or display name.
        </p>

        <form
            id="search-form"
            class="search-form"
        >

            <input
                type="search"
                id="search-input"
                placeholder="Search username or display name..."
                autocomplete="off"
                maxlength="100"
            >

            <button
                type="submit"
            >
                Search
            </button>

        </form>


        <div
            id="search-results"
            class="search-results"
        >
            <div class="search-empty">
                Enter a name or username to search.
            </div>
        </div>

    </section>

</main>


<script src="/js/auth.js"></script>
<script src="/js/global.js"></script>

<script>

    let searchSession = null;


    /* =========================================================
       ESCAPE POSTGREST SEARCH CHARACTERS
    ========================================================= */

    function escapeSearchQuery(value) {

        return value
            .replace(/\\/g, "\\\\")
            .replace(/\*/g, "\\*")
            .replace(/,/g, "\\,")
            .replace(/\(/g, "\\(")
            .replace(/\)/g, "\\)")
            .replace(/%/g, "\\%")
            .replace(/_/g, "\\_")
            .trim();

    }


    /* =========================================================
       SHOW RESULTS MESSAGE
    ========================================================= */

    function showSearchMessage(
        message,
        type = "empty"
    ) {

        const results =
            document.getElementById(
                "search-results"
            );

        if (!results) {
            return;
        }

        if (type === "error") {

            results.innerHTML = `
                <div class="search-error">
                    ${message}
                </div>
            `;

            return;
        }

        results.innerHTML = `
            <div class="search-empty">
                ${message}
            </div>
        `;

    }


    /* =========================================================
       CREATE USER RESULT
    ========================================================= */

    function createSearchUserCard(profile) {

        const card =
            document.createElement("div");

        card.className =
            "search-user";


        const avatar =
            window.createAvatar(
                profile,
                "search-avatar"
            );

        if (avatar) {

            avatar.classList.add(
                "search-avatar"
            );

        }


        const info =
            document.createElement("div");

        info.className =
            "search-user-info";


        const nameRow =
            document.createElement("div");

        nameRow.className =
            "search-user-name-row";


        const name =
            document.createElement("span");

        name.className =
            "search-user-name";

        name.textContent =
            profile.display_name ||
            profile.username ||
            "User";


        nameRow.appendChild(name);


        if (profile.is_verified) {

            const verified =
                document.createElement("span");

            verified.className =
                "verified-badge";

            verified.textContent =
                "✓";

            verified.title =
                "Verified";

            nameRow.appendChild(
                verified
            );

        }


        const username =
            document.createElement("div");

        username.className =
            "search-user-username";

        username.textContent =
            profile.username
                ? `@${profile.username}`
                : "";


        info.appendChild(
            nameRow
        );

        info.appendChild(
            username
        );


        if (profile.bio) {

            const bio =
                document.createElement("div");

            bio.className =
                "search-user-bio";

            bio.textContent =
                profile.bio;

            info.appendChild(
                bio
            );

        }


        card.appendChild(
            avatar
        );

        card.appendChild(
            info
        );


        return card;

    }


    /* =========================================================
       SEARCH USERS
    ========================================================= */

    async function searchUsers() {

        const input =
            document.getElementById(
                "search-input"
            );

        const results =
            document.getElementById(
                "search-results"
            );


        const rawQuery =
            input.value.trim();


        if (!rawQuery) {

            showSearchMessage(
                "Enter a name or username to search."
            );

            return;

        }


        if (!searchSession) {

            showSearchMessage(
                "Your session is not ready yet.",
                "error"
            );

            return;

        }


        results.innerHTML = `
            <div class="search-empty">
                Searching...
            </div>
        `;


        const query =
            escapeSearchQuery(
                rawQuery
            );


        console.log(
            "[Search] Searching for:",
            rawQuery
        );


        try {

            /*
             * IMPORTANT:
             *
             * Supabase/PostgREST uses * as the
             * wildcard in filter expressions.
             *
             * Do NOT use:
             *
             *     ilike.%query%
             *
             * Use:
             *
             *     ilike.*query*
             */

            const filter =
                `username.ilike.*${query}*,display_name.ilike.*${query}*`;


            console.log(
                "[Search] Filter:",
                filter
            );


            const {
                data,
                error
            } =
                await window.supabaseClient
                    .from("profiles")
                    .select(`
                        id,
                        username,
                        display_name,
                        avatar_url,
                        bio,
                        is_verified
                    `)
                    .or(filter)
                    .limit(20);


            if (error) {

                console.error(
                    "[Search] Supabase error:",
                    error
                );

                showSearchMessage(
                    "Search failed. Check the browser console for the Supabase error.",
                    "error"
                );

                return;

            }


            console.log(
                "[Search] Results:",
                data
            );


            if (
                !data ||
                data.length === 0
            ) {

                showSearchMessage(
                    "No users found."
                );

                return;

            }


            results.innerHTML = "";


            for (
                const profile
                of data
            ) {

                const card =
                    createSearchUserCard(
                        profile
                    );

                results.appendChild(
                    card
                );

            }

        } catch (error) {

            console.error(
                "[Search] Unexpected error:",
                error
            );

            showSearchMessage(
                "Search failed. Check the browser console.",
                "error"
            );

        }

    }


    /* =========================================================
       INITIALIZATION
    ========================================================= */

    async function initializeSearch() {

        try {

            console.log(
                "[Search] Initializing..."
            );


            searchSession =
                await window.getSession();


            if (!searchSession) {

                console.log(
                    "[Search] No session. Redirecting to login."
                );

                window.location.href =
                    "/login/";

                return;

            }


            console.log(
                "[Search] Logged in as:",
                searchSession.user.email
            );


            await window.initNavbar();


            const form =
                document.getElementById(
                    "search-form"
                );


            form.addEventListener(
                "submit",
                event => {

                    event.preventDefault();

                    searchUsers();

                }
            );


            const input =
                document.getElementById(
                    "search-input"
                );


            input.addEventListener(
                "input",
                () => {

                    clearTimeout(
                        window.searchInputTimeout
                    );

                    window.searchInputTimeout =
                        setTimeout(
                            () => {

                                if (
                                    input.value.trim()
                                ) {

                                    searchUsers();

                                } else {

                                    showSearchMessage(
                                        "Enter a name or username to search."
                                    );

                                }

                            },
                            300
                        );

                }
            );


        } catch (error) {

            console.error(
                "[Search] Initialization error:",
                error
            );

            showSearchMessage(
                "Could not initialize search.",
                "error"
            );

        }

    }


    document.addEventListener(
        "DOMContentLoaded",
        initializeSearch
    );

</script>

</body>
</html>
