<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Access Restricted — Rip_Dead Account</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="navbar-brand"
        >
            Rip_Dead Account
        </a>

        <div class="navbar-links">

            <a href="/">
                Home
            </a>

            <a
                href="/search/"
                class="auth-only"
                hidden
            >
                Search
            </a>

            <a
                href="/friends/"
                class="auth-only"
                hidden
            >
                Friends
            </a>

            <a
                href="/chat/"
                class="auth-only"
                hidden
            >
                Chat
            </a>

            <a
                href="/apps/"
                class="auth-only"
                hidden
            >
                Apps
            </a>

            <a
                href="/settings/"
                class="auth-only"
                hidden
            >
                Settings
            </a>

            <a
                href="/account/"
                class="auth-only"
                hidden
            >
                Account
            </a>

            <a
                href="/login/"
                class="guest-only"
            >
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link"
            >
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden
            >
                Log Out
            </button>

        </div>

    </div>

</nav>


<main class="center-page">

    <section class="auth-card">

        <h1 id="declined-title">
            Access Restricted
        </h1>

        <p id="declined-message">
            Your account has been restricted.
        </p>


        <div
            id="ban-details"
            class="message error"
            style="margin-top:20px;"
        >

            <strong>
                Ban Type:
            </strong>

            <span id="ban-type">
                Unknown
            </span>


            <br>


            <strong>
                Reason:
            </strong>

            <span id="ban-reason">
                No reason provided.
            </span>

        </div>


        <div
            style="
                margin-top:20px;
                display:flex;
                justify-content:center;
                gap:10px;
                flex-wrap:wrap;
            "
        >

            <a
                href="/"
                class="button-full"
                style="
                    text-decoration:none;
                    text-align:center;
                "
            >
                Return Home
            </a>

            <button
                type="button"
                id="declined-logout"
                class="button-full"
            >
                Log Out
            </button>

        </div>

    </section>

</main>


<!-- Authentication -->
<script src="/js/auth.js"></script>

<!-- Global site availability -->
<script src="/js/global.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const title =
            document.getElementById(
                "declined-title"
            );

        const message =
            document.getElementById(
                "declined-message"
            );

        const banType =
            document.getElementById(
                "ban-type"
            );

        const banReason =
            document.getElementById(
                "ban-reason"
            );

        const logoutButton =
            document.getElementById(
                "declined-logout"
            );


        /*
         * Initialize navbar.
         */

        try {

            await window.initNavbar();

        } catch (error) {

            console.error(
                "[Declined] Navbar error:",
                error
            );

        }


        /*
         * Get current session.
         */

        let session = null;

        try {

            session =
                await window.getSession();

        } catch (error) {

            console.error(
                "[Declined] Session error:",
                error
            );

        }


        /*
         * No session.
         */

        if (!session) {

            title.textContent =
                "Access Restricted";

            message.textContent =
                "Please log in to view your account status.";

            banType.textContent =
                "Unknown";

            banReason.textContent =
                "No reason provided.";

            return;

        }


        /*
         * Get profile.
         */

        try {

            const {
                data: profile,
                error
            } =
                await window.supabaseClient
                    .from("profiles")
                    .select(
                        "id,isBanned,ban_type,ban_reason"
                    )
                    .eq(
                        "id",
                        session.user.id
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "[Declined] Failed to load profile:",
                    error
                );

                message.textContent =
                    "Unable to load your account restriction.";

                return;

            }


            /*
             * Account is not banned.
             */

            if (
                !profile ||
                !profile.isBanned
            ) {

                window.location.href =
                    "/account/";

                return;

            }


            /*
             * Display ban type.
             */

            const type =
                profile.ban_type ||
                "Banned";

            banType.textContent =
                type;


            /*
             * Display ban reason.
             */

            banReason.textContent =
                profile.ban_reason ||
                "No reason provided.";


            /*
             * Customize the message.
             */

            if (
                type === "Terminated"
            ) {

                title.textContent =
                    "Account Terminated";

                message.textContent =
                    "This account has been terminated.";

            } else if (
                type === "IP Banned"
            ) {

                title.textContent =
                    "IP Banned";

                message.textContent =
                    "Access from your IP address has been restricted.";

            } else if (
                type === "HW Banned"
            ) {

                title.textContent =
                    "Device Banned";

                message.textContent =
                    "Access from this device has been restricted.";

            } else {

                title.textContent =
                    "Account Banned";

                message.textContent =
                    "This account has been banned.";

            }

        } catch (error) {

            console.error(
                "[Declined] Unexpected error:",
                error
            );

            message.textContent =
                "An unexpected error occurred.";

        }


        /*
         * Log out button.
         */

        if (logoutButton) {

            logoutButton.addEventListener(
                "click",
                async () => {

                    logoutButton.disabled =
                        true;

                    logoutButton.textContent =
                        "Logging Out...";


                    try {

                        await window
                            .supabaseClient
                            .auth
                            .signOut();

                    } catch (error) {

                        console.error(
                            "[Declined] Logout error:",
                            error
                        );

                    }


                    window.location.href =
                        "/login/";

                }
            );

        }

    }
);

</script>

</body>

</html>
