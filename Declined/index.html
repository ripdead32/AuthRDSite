<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Account Restricted - Rip_Dead Account</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/global.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at top,
                    #24152d 0%,
                    #0d0d12 42%,
                    #08080c 100%
                );

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .declined-page {
            width: 100%;
            max-width: 560px;
        }

        .declined-card {
            background: #111118;

            border: 1px solid #2d2d39;

            border-radius: 16px;

            padding: 36px;

            box-shadow:
                0 30px 90px rgba(
                    0,
                    0,
                    0,
                    0.55
                );

            text-align: center;
        }

        .logo {
            font-size: 21px;

            font-weight: 800;

            letter-spacing: -0.4px;

            margin-bottom: 30px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #29151b;

            border: 1px solid #55232e;

            color: #ff7185;

            font-size: 31px;

            font-weight: 700;
        }

        h1 {
            margin: 0;

            font-size: 28px;

            font-weight: 750;

            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 12px auto 0;

            max-width: 430px;

            color: #92929e;

            line-height: 1.55;

            font-size: 14px;
        }

        .status-box {
            margin-top: 25px;

            padding: 15px 17px;

            border-radius: 10px;

            background: #191920;

            border: 1px solid #30303b;

            text-align: left;
        }

        .status-label {
            color: #777783;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            margin-bottom: 6px;
        }

        .status {
            color: #ff7185;

            font-size: 16px;

            font-weight: 700;
        }

        .ban-reason {
            margin-top: 18px;

            padding: 14px 16px;

            border-radius: 10px;

            background: #15151c;

            border: 1px solid #292934;

            text-align: left;
        }

        .reason-label {
            color: #777783;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            margin-bottom: 6px;
        }

        .reason-text {
            color: #b7b7c2;

            font-size: 13px;

            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        .actions {
            margin-top: 27px;

            display: flex;

            justify-content: center;

            gap: 9px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 40px;

            padding: 0 17px;

            border-radius: 8px;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            font-family: inherit;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                border-color 0.15s ease,
                opacity 0.15s ease;
        }

        .button:disabled {
            opacity: 0.6;

            cursor: default;
        }

        .primary-button {
            background: #7c3aed;

            border: 1px solid #7c3aed;

            color: #ffffff;
        }

        .primary-button:hover:not(:disabled) {
            background: #8b5cf6;

            border-color: #8b5cf6;
        }

        .secondary-button {
            background: #191920;

            border: 1px solid #30303b;

            color: #b7b7c2;
        }

        .secondary-button:hover {
            background: #22222b;

            border-color: #3a3a47;

            color: #ffffff;
        }

        .loading {
            color: #8f8f9b;

            font-size: 14px;
        }

        .error {
            color: #ff7185;

            font-size: 14px;

            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .declined-card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="declined-page">

        <section class="declined-card">

            <div class="logo">
                Rip_<span>Dead</span>
            </div>

            <div
                class="icon"
                id="status-icon"
            >
                !
            </div>

            <div id="content">

                <div class="loading">
                    Checking account status...
                </div>

            </div>

        </section>

    </main>

    <script>
        (() => {
            "use strict";

            const db =
                window.supabaseClient;

            const content =
                document.getElementById(
                    "content"
                );

            const icon =
                document.getElementById(
                    "status-icon"
                );


            function escapeHTML(value) {
                const div =
                    document.createElement(
                        "div"
                    );

                div.textContent =
                    value ?? "";

                return div.innerHTML;
            }


            function getBanInfo(banType) {

                switch (banType) {

                    case "Banned":
                        return {
                            title:
                                "Account Banned",

                            description:
                                "This account has been banned from Rip_Dead Account."
                        };


                    case "Terminated":
                        return {
                            title:
                                "Account Terminated",

                            description:
                                "This account has been permanently terminated."
                        };


                    case "IP Banned":
                        return {
                            title:
                                "IP Banned",

                            description:
                                "Access to Rip_Dead Account has been blocked for this network."
                        };


                    case "HW Banned":
                        return {
                            title:
                                "Hardware Banned",

                            description:
                                "This account has been blocked due to a device restriction."
                        };


                    default:
                        return {
                            title:
                                "Account Restricted",

                            description:
                                "This account is currently restricted from accessing Rip_Dead Account."
                        };
                }
            }


            function showRestricted(
                banType,
                banReason
            ) {

                const info =
                    getBanInfo(
                        banType
                    );


                icon.textContent =
                    banType ===
                    "Terminated"
                        ? "×"
                        : "!";


                content.innerHTML = `
                    <h1>
                        ${escapeHTML(
                            info.title
                        )}
                    </h1>

                    <p class="subtitle">
                        ${escapeHTML(
                            info.description
                        )}
                    </p>

                    <div class="status-box">

                        <div class="status-label">
                            Restriction
                        </div>

                        <div class="status">
                            ${escapeHTML(
                                banType ||
                                "Restricted"
                            )}
                        </div>

                    </div>

                    <div class="ban-reason">

                        <div class="reason-label">
                            Reason
                        </div>

                        <div class="reason-text">
                            ${escapeHTML(
                                banReason ||
                                "No reason provided."
                            )}
                        </div>

                    </div>

                    <div class="actions">

                        <a
                            href="/"
                            class="button secondary-button"
                        >
                            Return Home
                        </a>

                        <button
                            type="button"
                            class="button primary-button"
                            id="logout-button"
                        >
                            Log Out
                        </button>

                    </div>
                `;


                document
                    .getElementById(
                        "logout-button"
                    )
                    ?.addEventListener(
                        "click",
                        async () => {

                            const button =
                                document.getElementById(
                                    "logout-button"
                                );

                            button.disabled =
                                true;

                            button.textContent =
                                "Logging Out...";


                            try {

                                await db.auth.signOut();

                            } catch (error) {

                                console.error(
                                    "[Declined] Logout error:",
                                    error
                                );

                            } finally {

                                window.location.href =
                                    "/login/";
                            }
                        }
                    );
            }


            function showNormalAccountRedirect() {

                window.location.href =
                    "/account/";
            }


            async function checkAccount() {

                if (!db) {

                    content.innerHTML = `
                        <h1>
                            Unable to Check Account
                        </h1>

                        <p class="error">
                            The Rip_Dead Account service
                            could not be loaded.
                        </p>
                    `;

                    return;
                }


                try {

                    const {
                        data,
                        error
                    } =
                        await db.auth.getSession();


                    if (error) {

                        console.error(
                            "[Declined] Session error:",
                            error
                        );

                        content.innerHTML = `
                            <h1>
                                Unable to Check Account
                            </h1>

                            <p class="error">
                                ${escapeHTML(
                                    error.message
                                )}
                            </p>
                        `;

                        return;
                    }


                    const session =
                        data?.session;


                    if (!session) {

                        window.location.href =
                            "/login/";

                        return;
                    }


                    const {
                        data: profile,
                        error:
                            profileError
                    } =
                        await db
                            .from("profiles")
                            .select(
                                "id,isBanned,ban_type,ban_reason"
                            )
                            .eq(
                                "id",
                                session.user.id
                            )
                            .maybeSingle();


                    if (profileError) {

                        console.error(
                            "[Declined] Profile error:",
                            profileError
                        );

                        content.innerHTML = `
                            <h1>
                                Unable to Check Account
                            </h1>

                            <p class="error">
                                ${escapeHTML(
                                    profileError.message
                                )}
                            </p>
                        `;

                        return;
                    }


                    if (
                        !profile ||
                        profile.isBanned !== true
                    ) {

                        showNormalAccountRedirect();

                        return;
                    }


                    showRestricted(
                        profile.ban_type,
                        profile.ban_reason
                    );

                } catch (error) {

                    console.error(
                        "[Declined] Unexpected error:",
                        error
                    );

                    content.innerHTML = `
                        <h1>
                            Unable to Check Account
                        </h1>

                        <p class="error">
                            ${escapeHTML(
                                error.message ||
                                "An unexpected error occurred."
                            )}
                        </p>
                    `;
                }
            }


            checkAccount();

        })();
    </script>

</body>
</html>
