<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authentication - Rip_Dead</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead ID
        </a>

        <div class="navbar-links">

            <a href="/">Home</a>
            <a href="/search/" class="auth-only" hidden>Search</a>
            <a href="/friends/" class="auth-only" hidden>Friends</a>
            <a href="/settings/" class="auth-only" hidden>Settings</a>
            <a href="/account/" class="auth-only" hidden>Account</a>

            <a href="/login/" class="guest-only">Log In</a>

            <a href="/signup/" class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>

        </div>

    </div>
</nav>

<main class="auth-container">

    <section class="auth-card">

        <span class="auth-eyebrow">
            AUTHENTICATION
        </span>

        <h1 id="callback-title">
            Completing authentication...
        </h1>

        <p
            id="callback-message"
            class="auth-message"
            aria-live="polite">
            Please wait.
        </p>

    </section>

</main>

<script>
async function handleCallback() {

    const title =
        document.getElementById(
            "callback-title"
        );

    const message =
        document.getElementById(
            "callback-message"
        );

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .getSession();

        if (error) {
            throw error;
        }

        if (data.session) {

            title.textContent =
                "Authentication successful!";

            setMessage(
                message,
                "Redirecting to your account...",
                "success"
            );

            setTimeout(() => {
                window.location.href =
                    "/account/";
            }, 700);

            return;
        }

        const hash =
            window.location.hash;

        const params =
            new URLSearchParams(
                hash.startsWith("#")
                    ? hash.substring(1)
                    : hash
            );

        const errorDescription =
            params.get(
                "error_description"
            );

        if (errorDescription) {
            throw new Error(
                errorDescription
            );
        }

        title.textContent =
            "Authentication complete";

        setMessage(
            message,
            "Please log in to continue.",
            ""
        );

        setTimeout(() => {
            window.location.href =
                "/login/";
        }, 1200);

    } catch (error) {

        console.error(
            "Callback error:",
            error
        );

        title.textContent =
            "Authentication failed";

        setMessage(
            message,
            error.message ||
            "Something went wrong.",
            "error"
        );
    }
}

initNavbar();

handleCallback();
</script>

</body>
</html>
