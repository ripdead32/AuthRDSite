<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log In — Rip_Dead Account</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="navbar-brand"
        >
            Rip_Dead Account
        </a>

        <div class="navbar-links">

            <a href="/">
                Home
            </a>

            <a
                href="/search/"
                class="auth-only"
                hidden
            >
                Search
            </a>

            <a
                href="/friends/"
                class="auth-only"
                hidden
            >
                Friends
            </a>

            <a
                href="/chat/"
                class="auth-only"
                hidden
            >
                Chat
            </a>

            <a
                href="/apps/"
                class="auth-only"
                hidden
            >
                Apps
            </a>

            <a
                href="/settings/"
                class="auth-only"
                hidden
            >
                Settings
            </a>

            <a
                href="/account/"
                class="auth-only"
                hidden
            >
                Account
            </a>

            <a
                href="/login/"
                class="guest-only"
            >
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link"
            >
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden
            >
                Log Out
            </button>

        </div>

    </div>

</nav>


<main class="center-page">

    <section class="auth-card">

        <h1>
            Welcome back
        </h1>

        <p>
            Log in to your Rip_Dead account.
        </p>


        <form id="login-form">

            <div class="form-group">

                <label
                    for="email"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Your password"
                    required
                >

            </div>


            <div
                id="login-message"
                class="message"
                hidden
            ></div>


            <button
                type="submit"
                class="button-full"
                id="login-button"
            >
                Log In
            </button>

        </form>


        <p
            style="
                margin-top:20px;
                margin-bottom:0;
                text-align:center;
            "
        >
            Don't have an account?

            <a href="/signup/">
                Create one
            </a>
        </p>

    </section>

</main>


<!-- Authentication must load BEFORE the page script -->
<script src="/js/auth.js"></script>

<!-- Global site availability -->
<script src="/js/global.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const form =
            document.getElementById(
                "login-form"
            );

        const button =
            document.getElementById(
                "login-button"
            );

        const message =
            document.getElementById(
                "login-message"
            );


        /*
         * Show a login-page message.
         */

        function showMessage(
            text,
            type = "info"
        ) {

            message.textContent =
                text;

            message.classList.remove(
                "success",
                "error",
                "info",
                "warning"
            );

            message.classList.add(
                type
            );

            message.hidden = false;

        }


        /*
         * Initialize the navbar.
         */

        await window.initNavbar();


        /*
         * Check whether an existing session
         * belongs to a restricted account.
         */

        const existingSession =
            await window.getSession();


        if (existingSession) {

            /*
             * Check IP/device bans.
             */

            const enforceResult =
                await window.enforceBans(
                    existingSession
                );


            if (
                enforceResult &&
                enforceResult.banned
            ) {
                return;
            }


            /*
             * Check normal account bans.
             */

            const banStatus =
                await window.checkAccountBan(
                    existingSession
                );


            if (banStatus.banned) {
                return;
            }


            /*
             * Already authenticated normally.
             */

            window.location.href =
                "/account/";

            return;
        }


        /*
         * Login form.
         */

        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                button.disabled = true;

                button.textContent =
                    "Logging in...";


                message.hidden = true;


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                if (
                    !email ||
                    !password
                ) {

                    showMessage(
                        "Please enter your email and password.",
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Log In";

                    return;
                }


                try {

                    const {
                        data,
                        error
                    } =
                        await window
                            .supabaseClient
                            .auth
                            .signInWithPassword({
                                email,
                                password
                            });


                    /*
                     * Normal Supabase login failure.
                     */

                    if (error) {

                        console.error(
                            "[Login] Login failed:",
                            error
                        );


                        showMessage(
                            error.message ||
                            "Unable to log in.",
                            "error"
                        );


                        button.disabled =
                            false;

                        button.textContent =
                            "Log In";

                        return;
                    }


                    if (
                        !data ||
                        !data.session
                    ) {

                        showMessage(
                            "Login succeeded, but no session was returned.",
                            "error"
                        );


                        button.disabled =
                            false;

                        button.textContent =
                            "Log In";

                        return;
                    }


                    console.log(
                        "[Login] Login successful."
                    );


                    /*
                     * Check IP/device bans.
                     */

                    const enforceResult =
                        await window.enforceBans(
                            data.session
                        );


                    /*
                     * enforceBans() redirects
                     * banned accounts to /Declined/.
                     */

                    if (
                        enforceResult &&
                        enforceResult.banned
                    ) {

                        console.warn(
                            "[Login] IP/device ban detected."
                        );

                        await window
                            .supabaseClient
                            .auth
                            .signOut();

                        return;
                    }


                    /*
                     * Check regular account bans.
                     */

                    const banStatus =
                        await window
                            .checkAccountBan(
                                data.session
                            );


                    /*
                     * Restricted account.
                     */

                    if (
                        banStatus.banned
                    ) {

                        console.warn(
                            "[Login] Restricted account detected."
                        );


                        await window
                            .supabaseClient
                            .auth
                            .signOut();


                        return;
                    }


                    /*
                     * Small delay to let Supabase
                     * persist the session.
                     */

                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                100
                            )
                    );


                    window.location.href =
                        "/account/";

                } catch (error) {

                    console.error(
                        "[Login] Unexpected error:",
                        error
                    );


                    if (
                        typeof window
                            .isSupabaseUnavailableError ===
                        "function" &&
                        window
                            .isSupabaseUnavailableError(
                                error
                            )
                    ) {
                        return;
                    }


                    showMessage(
                        error.message ||
                        "An unexpected error occurred.",
                        "error"
                    );


                    button.disabled =
                        false;

                    button.textContent =
                        "Log In";

                }

            }
        );

    }
);

</script>

</body>

</html>
