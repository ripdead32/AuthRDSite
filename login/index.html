<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In - Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="/">Home</a>

            <a href="/search/" class="auth-only" hidden>
                Search
            </a>

            <a href="/friends/" class="auth-only" hidden>
                Friends
            </a>

            <a href="/settings/" class="auth-only" hidden>
                Settings
            </a>

            <a href="/account/" class="auth-only" hidden>
                Account
            </a>

            <a href="/login/" class="guest-only">
                Log In
            </a>

            <a href="/signup/" class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>

        </div>

    </div>
</nav>

<main class="auth-container">

    <section class="auth-card auth-form-card">

        <div class="auth-card-header">
            <span class="auth-eyebrow">
                WELCOME BACK
            </span>

            <h1>Log In</h1>

            <p class="auth-subtitle">
                Sign in to your Rip_Dead account.
            </p>
        </div>

        <form id="login-form">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
                required>

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Your password"
                required>

            <button
                type="submit"
                id="login-button">
                Log In
            </button>

            <div
                id="message"
                class="auth-message"
                aria-live="polite">
            </div>

        </form>

        <p class="auth-footer-text">
            Don't have an account?
            <a href="/signup/">Create one</a>.
        </p>

    </section>

</main>

<script>
const loginForm =
    document.getElementById("login-form");

const message =
    document.getElementById("message");

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;

        const button =
            document.getElementById("login-button");

        button.disabled = true;
        button.textContent = "Logging in...";

        setMessage(
            message,
            "Logging in...",
            ""
        );

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({
                    email,
                    password
                });

        if (error) {

            console.error(
                "Login error:",
                error
            );

            setMessage(
                message,
                error.message,
                "error"
            );

            button.disabled = false;
            button.textContent = "Log In";

            return;
        }

        setMessage(
            message,
            "Login successful!",
            "success"
        );

        const params =
            new URLSearchParams(
                window.location.search
            );

        const redirect =
            params.get("redirect");

        window.location.href =
            redirect || "/account/";
    }
);

initNavbar();
</script>

</body>
</html>
