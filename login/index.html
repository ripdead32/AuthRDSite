<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log In - Rip_Dead Authentication</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a
            href="../"
            class="navbar-brand"
        >
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="../">
                Home
            </a>

            <a href="../signup/">
                Create Account
            </a>

        </div>

    </div>
</nav>

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Log In</h1>

            <p>
                Sign in to your Rip_Dead account.
            </p>

        </div>

        <form id="login-form">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="login-button"
            >
                Log In
            </button>

            <div
                id="login-message"
                class="auth-message"
                aria-live="polite"
            ></div>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="../signup/">
                Create one
            </a>

        </div>

    </div>

</main>

<script>
const form =
    document.getElementById("login-form");

const button =
    document.getElementById("login-button");

const message =
    document.getElementById("login-message");

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        button.disabled = true;
        button.textContent = "Logging in...";

        setMessage(
            message,
            ""
        );

        try {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const { data, error } =
                await window.supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) {
                setMessage(
                    message,
                    error.message,
                    "error"
                );

                return;
            }

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const redirect =
                params.get("redirect");

            if (
                redirect &&
                redirect.startsWith("/")
            ) {
                window.location.href =
                    redirect;
            } else {
                window.location.href =
                    "../account/";
            }

        } catch (error) {

            console.error(
                "Login error:",
                error
            );

            setMessage(
                message,
                error.message ||
                "Unable to log in.",
                "error"
            );

        } finally {

            button.disabled = false;
            button.textContent = "Log In";
        }
    }
);
</script>

</body>
</html>
