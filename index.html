<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">
            <a href="/">Home</a>

            <a href="/search/" class="auth-only" hidden>
                Search
            </a>

            <a href="/friends/" class="auth-only" hidden>
                Friends
            </a>

            <a href="/settings/" class="auth-only" hidden>
                Settings
            </a>

            <a href="/account/" class="auth-only" hidden>
                Account
            </a>

            <a href="/login/" class="guest-only">
                Log In
            </a>

            <a href="/signup/" class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>
        </div>

    </div>
</nav>

<main class="auth-container">

    <section class="auth-card">

        <div class="auth-card-header">
            <span class="auth-eyebrow">
                RIP_DEAD ACCOUNT SYSTEM
            </span>

            <h1>
                One account.
                <br>
                Every Rip_Dead service.
            </h1>

            <p class="auth-subtitle">
                Your central identity for Rip_Dead applications,
                websites, mods and social features.
            </p>
        </div>

        <div class="auth-actions">

            <a
                href="/login/"
                class="button-link guest-only">
                Log In
            </a>

            <a
                href="/signup/"
                class="button-link guest-only">
                Create Account
            </a>

            <a
                href="/account/"
                class="button-link auth-only"
                hidden>
                Open Account
            </a>

            <a
                href="/search/"
                class="button-link auth-only"
                hidden>
                Find Users
            </a>

        </div>

    </section>

</main>

<script>
initNavbar();
</script>

</body>
</html>
