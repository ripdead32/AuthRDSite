<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile - Rip_Dead Authentication</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a
            href="../"
            class="navbar-brand"
        >
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="../">
                Home
            </a>

            <a href="../search/">
                Search
            </a>

            <a href="../friends/">
                Friends
            </a>

            <a href="../settings/">
                Settings
            </a>

            <a href="../account/">
                Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="navbar-logout"
            >
                Log Out
            </button>

        </div>

    </div>

</nav>

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Edit Profile</h1>

            <p>
                Update your public profile.
            </p>

        </div>

        <div class="profile-avatar-container">

            <div
                id="profile-avatar"
                class="account-avatar"
            >
                ?
            </div>

            <label
                for="avatar-input"
                class="upload-button"
            >
                Choose Profile Picture
            </label>

            <input
                type="file"
                id="avatar-input"
                accept="image/png,image/jpeg,image/webp"
                hidden
            >

        </div>

        <form id="profile-form">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    maxlength="32"
                    required
                >

            </div>

            <div class="form-group">

                <label for="display-name">
                    Display Name
                </label>

                <input
                    type="text"
                    id="display-name"
                    maxlength="64"
                >

            </div>

            <div class="form-group">

                <label for="bio">
                    Bio
                </label>

                <textarea
                    id="bio"
                    maxlength="500"
                ></textarea>

            </div>

            <button
                type="submit"
                id="save-button"
            >
                Save Changes
            </button>

            <div
                id="profile-message"
                class="auth-message"
            ></div>

        </form>

    </div>

</main>

<script>
let currentSession = null;

async function initializeProfile() {

    currentSession =
        await requireAuth();

    if (!currentSession) {
        return;
    }

    const profile =
        await getProfile(
            currentSession.user.id
        );

    if (!profile) {
        return;
    }

    document.getElementById(
        "username"
    ).value =
        profile.username || "";

    document.getElementById(
        "display-name"
    ).value =
        profile.display_name || "";

    document.getElementById(
        "bio"
    ).value =
        profile.bio || "";

    renderProfileAvatar(profile);

    await initNavbar();
}

function renderProfileAvatar(profile) {

    const avatar =
        document.getElementById(
            "profile-avatar"
        );

    if (profile.avatar_url) {

        avatar.innerHTML =
            "<img src=\"" +
            profile.avatar_url +
            "\" alt=\"\">";

    } else {

        avatar.textContent =
            getAvatarLetter(profile);
    }
}

document
    .getElementById("avatar-input")
    .addEventListener(
        "change",
        async (event) => {

            const file =
                event.target.files[0];

            if (!file || !currentSession) {
                return;
            }

            if (file.size > 5 * 1024 * 1024) {

                setMessage(
                    document.getElementById(
                        "profile-message"
                    ),
                    "Profile pictures must be 5 MB or smaller.",
                    "error"
                );

                return;
            }

            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            const allowed =
                [
                    "png",
                    "jpg",
                    "jpeg",
                    "webp"
                ];

            if (!allowed.includes(extension)) {

                setMessage(
                    document.getElementById(
                        "profile-message"
                    ),
                    "Unsupported image format.",
                    "error"
                );

                return;
            }

            const path =
                currentSession.user.id +
                "/profile." +
                extension;

            const { error } =
                await window.supabaseClient.storage
                    .from("avatars")
                    .upload(
                        path,
                        file,
                        {
                            upsert: true,
                            contentType:
                                file.type
                        }
                    );

            if (error) {

                console.error(
                    "Avatar upload error:",
                    error
                );

                setMessage(
                    document.getElementById(
                        "profile-message"
                    ),
                    error.message,
                    "error"
                );

                return;
            }

            const { data } =
                window.supabaseClient.storage
                    .from("avatars")
                    .getPublicUrl(path);

            const avatarUrl =
                data.publicUrl +
                "?t=" +
                Date.now();

            const { error: updateError } =
                await updateProfile({
                    avatar_url:
                        avatarUrl
                });

            if (updateError) {

                setMessage(
                    document.getElementById(
                        "profile-message"
                    ),
                    updateError.message,
                    "error"
                );

                return;
            }

            renderProfileAvatar({
                avatar_url:
                    avatarUrl,
                display_name:
                    document.getElementById(
                        "display-name"
                    ).value,
                username:
                    document.getElementById(
                        "username"
                    ).value
            });

            setMessage(
                document.getElementById(
                    "profile-message"
                ),
                "Profile picture updated.",
                "success"
            );
        }
    );

document
    .getElementById("profile-form")
    .addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const button =
                document.getElementById(
                    "save-button"
                );

            const message =
                document.getElementById(
                    "profile-message"
                );

            button.disabled = true;
            button.textContent =
                "Saving...";

            const username =
                document.getElementById(
                    "username"
                ).value.trim();

            const displayName =
                document.getElementById(
                    "display-name"
                ).value.trim();

            const bio =
                document.getElementById(
                    "bio"
                ).value.trim();

            if (username.length < 3) {

                setMessage(
                    message,
                    "Username must be at least 3 characters.",
                    "error"
                );

                button.disabled = false;
                button.textContent =
                    "Save Changes";

                return;
            }

            const { error } =
                await updateProfile({
                    username,
                    display_name:
                        displayName ||
                        username,
                    bio
                });

            if (error) {

                setMessage(
                    message,
                    error.message,
                    "error"
                );

            } else {

                setMessage(
                    message,
                    "Profile saved successfully.",
                    "success"
                );
            }

            button.disabled = false;
            button.textContent =
                "Save Changes";
        }
    );

initializeProfile();
</script>

</body>
</html>
