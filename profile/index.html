<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Edit Profile — Rip_Dead Account</title>

<link rel="stylesheet" href="/css/auth.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

</head>

<body>

<nav class="site-navbar">


<div class="navbar-inner">

    <a href="/" class="navbar-brand">
        Rip_Dead Account
    </a>

    <div class="navbar-links">

        <a href="/">
            Home
        </a>

        <a
            href="/search/"
            class="auth-only"
            hidden
        >
            Search
        </a>

        <a
            href="/friends/"
            class="auth-only"
            hidden
        >
            Friends
        </a>

        <a
            href="/chat/"
            class="auth-only"
            hidden
        >
            Chat
        </a>

        <a
            href="/apps/"
            class="auth-only"
            hidden
        >
            Authorized Apps
        </a>

        <a
            href="/settings/"
            class="auth-only"
            hidden
        >
            Settings
        </a>

        <a
            href="/account/"
            class="auth-only"
            hidden
        >
            Account
        </a>

        <a
            href="/login/"
            class="guest-only"
        >
            Log In
        </a>

        <a
            href="/signup/"
            class="guest-only button-link"
        >
            Create Account
        </a>

        <button
            type="button"
            id="navbar-logout"
            class="auth-only navbar-logout"
            hidden
        >
            Log Out
        </button>

    </div>

</div>

</nav>

<main class="page page-small">

<h1 class="page-title">
    Edit Profile
</h1>

<p class="page-description">
    Update the information shown on your Rip_Dead profile.
</p>


<section class="card">

    <!-- USERNAME -->

    <div class="form-group">

        <label
            for="username"
            class="form-label"
        >
            Username
        </label>

        <input
            id="username"
            type="text"
            autocomplete="username"
            maxlength="32"
            placeholder="Your username"
        >

    </div>


    <!-- DISPLAY NAME -->

    <div class="form-group">

        <label
            for="display-name"
            class="form-label"
        >
            Display Name
        </label>

        <input
            id="display-name"
            type="text"
            maxlength="64"
            placeholder="Your display name"
        >

    </div>


    <!-- BIO -->

    <div class="form-group">

        <label
            for="bio"
            class="form-label"
        >
            Bio
        </label>

        <textarea
            id="bio"
            maxlength="500"
            placeholder="Tell people a little about yourself..."
        ></textarea>

    </div>


    <!-- PROFILE PICTURE -->

    <div class="form-group">

        <label
            for="avatar"
            class="form-label"
        >
            Profile Picture
        </label>

        <input
            id="avatar"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >

        <span class="form-help">
            PNG, JPEG, or WebP. Maximum 5 MB.
        </span>


        <div
            id="avatar-preview"
            style="
                display: none;
                margin-top: 12px;
            "
        >

            <img
                id="avatar-preview-image"
                alt="Profile picture preview"
                style="
                    width: 80px;
                    height: 80px;
                    display: block;
                    object-fit: cover;
                    object-position: center;
                    border-radius: 50%;
                "
            >

        </div>

    </div>


    <!-- MESSAGE -->

    <div
        id="profile-message"
        class="message"
    ></div>


    <!-- BUTTONS -->

    <div class="button-row">

        <button
            type="button"
            id="save-profile"
        >
            Save Changes
        </button>

        <a
            href="/account/"
            class="button button-secondary"
        >
            Cancel
        </a>

    </div>

</section>

</main>

<script>

const MAX_AVATAR_SIZE =
    5 * 1024 * 1024;


const ALLOWED_AVATAR_TYPES = [
    "image/png",
    "image/jpeg",
    "image/webp"
];


document.addEventListener(
    "DOMContentLoaded",
    async () => {

        /*
         * REQUIRE LOGIN
         */

        const session =
            await requireAuth();

        if (!session) {
            return;
        }


        /*
         * INITIALIZE NAVBAR
         */

        await initNavbar();


        /*
         * LOAD PROFILE
         */

        const profile =
            await getProfile(
                session.user.id
            );


        if (!profile) {

            setMessage(
                "profile-message",
                "Could not load your profile.",
                "error"
            );

            return;
        }


        /*
         * FILL FORM
         */

        document.getElementById(
            "username"
        ).value =
            profile.username || "";


        document.getElementById(
            "display-name"
        ).value =
            profile.display_name || "";


        document.getElementById(
            "bio"
        ).value =
            profile.bio || "";


        /*
         * AVATAR ELEMENTS
         */

        const avatarInput =
            document.getElementById(
                "avatar"
            );


        const avatarPreview =
            document.getElementById(
                "avatar-preview"
            );


        const avatarPreviewImage =
            document.getElementById(
                "avatar-preview-image"
            );


        /*
         * AVATAR PREVIEW
         */

        avatarInput.addEventListener(
            "change",
            () => {

                const file =
                    avatarInput.files?.[0];


                if (!file) {

                    avatarPreview.style.display =
                        "none";

                    avatarPreviewImage.src =
                        "";

                    return;
                }


                /*
                 * Validate MIME type.
                 */

                if (
                    !ALLOWED_AVATAR_TYPES.includes(
                        file.type
                    )
                ) {

                    setMessage(
                        "profile-message",
                        "Avatar must be PNG, JPEG, or WebP.",
                        "error"
                    );

                    avatarInput.value =
                        "";

                    avatarPreview.style.display =
                        "none";

                    return;
                }


                /*
                 * Validate size.
                 */

                if (
                    file.size >
                    MAX_AVATAR_SIZE
                ) {

                    setMessage(
                        "profile-message",
                        "Avatar must be 5 MB or smaller.",
                        "error"
                    );

                    avatarInput.value =
                        "";

                    avatarPreview.style.display =
                        "none";

                    return;
                }


                /*
                 * Preview image.
                 */

                const reader =
                    new FileReader();


                reader.onload =
                    () => {

                        avatarPreviewImage.src =
                            reader.result;

                        avatarPreview.style.display =
                            "block";

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );


        /*
         * SAVE PROFILE
         */

        document.getElementById(
            "save-profile"
        ).onclick = async () => {

            const button =
                document.getElementById(
                    "save-profile"
                );


            button.disabled =
                true;

            button.textContent =
                "Saving...";


            setMessage(
                "profile-message",
                ""
            );


            /*
             * GET TEXT VALUES
             */

            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();


            const displayName =
                document
                    .getElementById(
                        "display-name"
                    )
                    .value
                    .trim();


            const bio =
                document
                    .getElementById(
                        "bio"
                    )
                    .value
                    .trim();


            /*
             * SAVE TEXT PROFILE DATA
             */

            const result =
                await updateProfile({

                    username,

                    display_name:
                        displayName,

                    bio

                });


            if (!result.success) {

                setMessage(
                    "profile-message",
                    result.error,
                    "error"
                );

                button.disabled =
                    false;

                button.textContent =
                    "Save Changes";

                return;
            }


            /*
             * GET SELECTED AVATAR
             */

            const file =
                avatarInput.files?.[0];


            if (file) {

                /*
                 * Validate MIME type again.
                 */

                if (
                    !ALLOWED_AVATAR_TYPES.includes(
                        file.type
                    )
                ) {

                    setMessage(
                        "profile-message",
                        "Avatar must be PNG, JPEG, or WebP.",
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Save Changes";

                    return;
                }


                /*
                 * Validate size again.
                 */

                if (
                    file.size >
                    MAX_AVATAR_SIZE
                ) {

                    setMessage(
                        "profile-message",
                        "Avatar must be 5 MB or smaller.",
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Save Changes";

                    return;
                }


                /*
                 * Determine extension.
                 */

                const extension =
                    file.type === "image/png"
                        ? "png"
                        : file.type === "image/webp"
                            ? "webp"
                            : "jpg";


                /*
                 * IMPORTANT:
                 *
                 * Generate a UNIQUE filename.
                 *
                 * This prevents the browser/CDN
                 * from returning the old cached
                 * profile.png.
                 */

                const filePath =
                    `${session.user.id}/profile-${Date.now()}.${extension}`;


                button.textContent =
                    "Uploading Picture...";


                /*
                 * UPLOAD
                 */

                const {
                    error: uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("avatars")
                        .upload(
                            filePath,
                            file,
                            {
                                upsert: false,
                                contentType:
                                    file.type,
                                cacheControl:
                                    "3600"
                            }
                        );


                if (uploadError) {

                    console.error(
                        "Avatar upload error:",
                        uploadError
                    );

                    setMessage(
                        "profile-message",
                        uploadError.message,
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Save Changes";

                    return;
                }


                /*
                 * GET PUBLIC URL
                 */

                const {
                    data: publicData
                } =
                    supabaseClient
                        .storage
                        .from("avatars")
                        .getPublicUrl(
                            filePath
                        );


                const avatarUrl =
                    publicData?.publicUrl;


                if (!avatarUrl) {

                    setMessage(
                        "profile-message",
                        "Avatar uploaded, but its public URL could not be generated.",
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Save Changes";

                    return;
                }


                /*
                 * SAVE NEW AVATAR URL
                 * TO PROFILE
                 */

                const {
                    error:
                        avatarUpdateError
                } =
                    await supabaseClient
                        .from("profiles")
                        .update({
                            avatar_url:
                                avatarUrl
                        })
                        .eq(
                            "id",
                            session.user.id
                        );


                if (
                    avatarUpdateError
                ) {

                    console.error(
                        "Avatar profile update error:",
                        avatarUpdateError
                    );

                    setMessage(
                        "profile-message",
                        avatarUpdateError.message,
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Save Changes";

                    return;
                }


                /*
                 * Successfully saved.
                 */

                avatarInput.value =
                    "";

                avatarPreview.style.display =
                    "none";

                avatarPreviewImage.src =
                    "";

            }


            /*
             * SUCCESS
             */

            setMessage(
                "profile-message",
                "Profile saved successfully.",
                "success"
            );


            button.disabled =
                false;

            button.textContent =
                "Save Changes";

        };

    }
);

</script>

</body>

</html>
