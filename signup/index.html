</main>

<script>

const MAX_AVATAR_SIZE = 5 * 1024 * 1024;

const ALLOWED_AVATAR_TYPES = [
    "image/png",
    "image/jpeg",
    "image/webp"
];


function getPendingAvatarDatabase() {

    return new Promise((resolve, reject) => {

        const request = indexedDB.open(
            "ripdead_pending_signup",
            1
        );

        request.onupgradeneeded = () => {

            const database = request.result;

            if (!database.objectStoreNames.contains("files")) {

                database.createObjectStore(
                    "files"
                );

            }

        };

        request.onsuccess = () => {
            resolve(request.result);
        };

        request.onerror = () => {
            reject(request.error);
        };

    });

}


async function savePendingAvatar(file) {

    const database =
        await getPendingAvatarDatabase();

    return new Promise((resolve, reject) => {

        const transaction =
            database.transaction(
                "files",
                "readwrite"
            );

        const store =
            transaction.objectStore("files");

        store.put(
            file,
            "profile-picture"
        );

        transaction.oncomplete = () => {
            database.close();
            resolve();
        };

        transaction.onerror = () => {
            database.close();
            reject(transaction.error);
        };

    });

}


async function clearPendingAvatar() {

    try {

        const database =
            await getPendingAvatarDatabase();

        return new Promise((resolve, reject) => {

            const transaction =
                database.transaction(
                    "files",
                    "readwrite"
                );

            transaction
                .objectStore("files")
                .delete("profile-picture");

            transaction.oncomplete = () => {
                database.close();
                resolve();
            };

            transaction.onerror = () => {
                database.close();
                reject(transaction.error);
            };

        });

    } catch (error) {

        console.error(
            "[Signup] Could not clear pending avatar:",
            error
        );

    }

}


async function uploadAvatar(file, userId) {

    if (!file || !userId) {
        return {
            success: false,
            error: "Missing profile picture or user ID."
        };
    }


    const extension =
        file.type === "image/png"
            ? "png"
            : file.type === "image/webp"
                ? "webp"
                : "jpg";


    const path =
        `${userId}/profile.${extension}`;


    const {
        error: uploadError
    } =
        await supabaseClient
            .storage
            .from("avatars")
            .upload(
                path,
                file,
                {
                    upsert: true,
                    contentType: file.type
                }
            );


    if (uploadError) {

        console.error(
            "[Signup] Avatar upload error:",
            uploadError
        );

        return {
            success: false,
            error: uploadError.message
        };

    }


    const {
        data: publicUrlData
    } =
        supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(path);


    const avatarUrl =
        publicUrlData?.publicUrl;


    if (!avatarUrl) {

        return {
            success: false,
            error: "Could not get avatar URL."
        };

    }


    const {
        error: profileError
    } =
        await supabaseClient
            .from("profiles")
            .update({
                avatar_url: avatarUrl
            })
            .eq("id", userId);


    if (profileError) {

        console.error(
            "[Signup] Avatar profile update error:",
            profileError
        );

        return {
            success: false,
            error: profileError.message
        };

    }


    await clearPendingAvatar();


    return {
        success: true,
        avatarUrl
    };

}


document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const session =
            await getSession();

        await initNavbar();


        if (session) {

            window.location.href =
                "/account/";

            return;

        }


        const profilePictureInput =
            document.getElementById(
                "profile-picture"
            );


        const preview =
            document.getElementById(
                "profile-picture-preview"
            );


        const previewImage =
            document.getElementById(
                "profile-picture-image"
            );


        profilePictureInput.addEventListener(
            "change",
            () => {

                const file =
                    profilePictureInput.files?.[0];


                if (!file) {

                    preview.style.display =
                        "none";

                    previewImage.src =
                        "";

                    return;

                }


                if (
                    !ALLOWED_AVATAR_TYPES.includes(
                        file.type
                    )
                ) {

                    setMessage(
                        "signup-message",
                        "Profile picture must be PNG, JPEG, or WebP.",
                        "error"
                    );

                    profilePictureInput.value =
                        "";

                    preview.style.display =
                        "none";

                    return;

                }


                if (
                    file.size >
                    MAX_AVATAR_SIZE
                ) {

                    setMessage(
                        "signup-message",
                        "Profile picture must be 5 MB or smaller.",
                        "error"
                    );

                    profilePictureInput.value =
                        "";

                    preview.style.display =
                        "none";

                    return;

                }


                const reader =
                    new FileReader();


                reader.onload = () => {

                    previewImage.src =
                        reader.result;

                    preview.style.display =
                        "block";

                };


                reader.readAsDataURL(file);

            }
        );


        document
            .getElementById("signup-form")
            .addEventListener(
                "submit",
                async event => {

                    event.preventDefault();


                    const button =
                        document.getElementById(
                            "signup-button"
                        );


                    button.disabled =
                        true;

                    button.textContent =
                        "Creating...";


                    setMessage(
                        "signup-message",
                        ""
                    );


                    const username =
                        document
                            .getElementById(
                                "username"
                            )
                            .value
                            .trim();


                    const displayName =
                        document
                            .getElementById(
                                "display-name"
                            )
                            .value
                            .trim();


                    const bio =
                        document
                            .getElementById(
                                "bio"
                            )
                            .value
                            .trim();


                    const email =
                        document
                            .getElementById(
                                "email"
                            )
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById(
                                "password"
                            )
                            .value;


                    const profilePicture =
                        profilePictureInput
                            .files?.[0] || null;


                    if (
                        profilePicture &&
                        !ALLOWED_AVATAR_TYPES.includes(
                            profilePicture.type
                        )
                    ) {

                        setMessage(
                            "signup-message",
                            "Profile picture must be PNG, JPEG, or WebP.",
                            "error"
                        );

                        button.disabled =
                            false;

                        button.textContent =
                            "Create Account";

                        return;

                    }


                    if (
                        profilePicture &&
                        profilePicture.size >
                        MAX_AVATAR_SIZE
                    ) {

                        setMessage(
                            "signup-message",
                            "Profile picture must be 5 MB or smaller.",
                            "error"
                        );

                        button.disabled =
                            false;

                        button.textContent =
                            "Create Account";

                        return;

                    }


                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signUp({

                                email,

                                password,

                                options: {

                                    data: {

                                        username,

                                        display_name:
                                            displayName,

                                        bio

                                    }

                                }

                            });


                    if (error) {

                        setMessage(
                            "signup-message",
                            error.message,
                            "error"
                        );

                        button.disabled =
                            false;

                        button.textContent =
                            "Create Account";

                        return;

                    }


                    if (
                        profilePicture
                    ) {

                        try {

                            await savePendingAvatar(
                                profilePicture
                            );

                        } catch (error) {

                            console.error(
                                "[Signup] Could not save pending avatar:",
                                error
                            );

                        }

                    }


                    if (!data.session) {

                        setMessage(
                            "signup-message",
                            "Account created. Check your email to confirm your account.",
                            "success"
                        );

                        button.disabled =
                            false;

                        button.textContent =
                            "Create Account";

                        return;

                    }


                    if (
                        profilePicture &&
                        data.user
                    ) {

                        button.textContent =
                            "Uploading profile picture...";


                        const uploadResult =
                            await uploadAvatar(
                                profilePicture,
                                data.user.id
                            );


                        if (
                            !uploadResult.success
                        ) {

                            console.error(
                                "[Signup] Avatar upload failed:",
                                uploadResult.error
                            );

                        }

                    }


                    window.location.href =
                        "/account/";

                }
            );

    }
);

</script>
