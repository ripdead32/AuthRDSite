<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/search/" class="auth-only" hidden>Search</a>
            <a href="/friends/" class="auth-only" hidden>Friends</a>
            <a href="/settings/" class="auth-only" hidden>Settings</a>
            <a href="/account/" class="auth-only" hidden>Account</a>

            <a href="/login/" class="guest-only">Log In</a>

            <a href="/signup/" class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>
        </div>

    </div>
</nav>

<main class="auth-container">

    <section class="auth-card">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Create your Rip_Dead account.
        </p>

        <form id="signup-form">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                minlength="3"
                maxlength="32"
                autocomplete="username"
                required>

            <label for="display-name">
                Display Name
            </label>

            <input
                type="text"
                id="display-name"
                name="display-name"
                maxlength="64"
                required>

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required>

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="6"
                required>

            <button type="submit">
                Create Account
            </button>

            <div
                id="message"
                class="auth-message"
                aria-live="polite">
            </div>

        </form>

        <p>
            Already have an account?
            <a href="/login/">Log in</a>.
        </p>

    </section>

</main>

<script>
const signupForm =
    document.getElementById("signup-form");

const message =
    document.getElementById("message");

signupForm.addEventListener("submit", async event => {

    event.preventDefault();

    const username =
        document.getElementById("username")
            .value
            .trim();

    const displayName =
        document.getElementById("display-name")
            .value
            .trim();

    const email =
        document.getElementById("email")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    const button =
        signupForm.querySelector("button");

    button.disabled = true;
    button.textContent = "Creating account...";

    setMessage(
        message,
        "Creating account...",
        ""
    );

    const { data, error } =
        await supabaseClient.auth.signUp({

            email,
            password,

            options: {
                data: {
                    username,
                    display_name: displayName
                }
            }
        });

    if (error) {

        console.error(
            "Signup error:",
            error
        );

        setMessage(
            message,
            error.message,
            "error"
        );

        button.disabled = false;
        button.textContent = "Create Account";

        return;
    }

    console.log(
        "Signup result:",
        data
    );

    setMessage(
        message,
        "Account created successfully!",
        "success"
    );

    setTimeout(() => {
        window.location.href = "/account/";
    }, 1000);
});

initNavbar();
</script>

</body>
</html>
