<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Rip_Dead Authentication</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a
            href="../"
            class="navbar-brand"
        >
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="../">
                Home
            </a>

            <a href="../login/">
                Log In
            </a>

        </div>

    </div>
</nav>

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Create Account</h1>

            <p>
                Create your Rip_Dead account.
            </p>

        </div>

        <form id="signup-form">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    autocomplete="username"
                    maxlength="32"
                    required
                >

            </div>

            <div class="form-group">

                <label for="display-name">
                    Display Name
                </label>

                <input
                    type="text"
                    id="display-name"
                    autocomplete="name"
                    maxlength="64"
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>

            <button
                type="submit"
                id="signup-button"
            >
                Create Account
            </button>

            <div
                id="signup-message"
                class="auth-message"
                aria-live="polite"
            ></div>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="../login/">
                Log in
            </a>

        </div>

    </div>

</main>

<script>
const form =
    document.getElementById(
        "signup-form"
    );

const button =
    document.getElementById(
        "signup-button"
    );

const message =
    document.getElementById(
        "signup-message"
    );

let signingUp = false;

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        if (signingUp) {
            return;
        }

        signingUp = true;

        button.disabled = true;
        button.textContent =
            "Creating account...";

        setMessage(message, "");

        try {

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const displayName =
                document
                    .getElementById("display-name")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            if (!username) {
                throw new Error(
                    "Please enter a username."
                );
            }

            if (username.length < 3) {
                throw new Error(
                    "Username must be at least 3 characters."
                );
            }

            if (!email) {
                throw new Error(
                    "Please enter your email address."
                );
            }

            if (password.length < 6) {
                throw new Error(
                    "Password must be at least 6 characters."
                );
            }

            const { data, error } =
                await window.supabaseClient.auth.signUp({
                    email,
                    password,

                    options: {
                        emailRedirectTo:
                            "https://auth.ripdead.de5.net/callback/",

                        data: {
                            username,
                            display_name:
                                displayName ||
                                username
                        }
                    }
                });

            if (error) {

                console.error(
                    "Signup error:",
                    error
                );

                setMessage(
                    message,
                    error.message,
                    "error"
                );

                return;
            }

            console.log(
                "Signup successful:",
                data
            );

            setMessage(
                message,
                "Account created. Check your email to confirm your address.",
                "success"
            );

            form.reset();

        } catch (error) {

            console.error(
                "Unexpected signup error:",
                error
            );

            setMessage(
                message,
                error.message ||
                "Something went wrong.",
                "error"
            );

        } finally {

            signingUp = false;

            button.disabled = false;
            button.textContent =
                "Create Account";
        }
    }
);
</script>

</body>
</html>
