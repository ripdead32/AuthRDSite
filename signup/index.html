<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — Rip_Dead ID</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead ID
        </a>

        <div class="navbar-links">

            <a href="/">
                Home
            </a>

            <a href="/search/" class="auth-only" hidden>
                Search
            </a>

            <a href="/friends/" class="auth-only" hidden>
                Friends
            </a>

            <a href="/settings/" class="auth-only" hidden>
                Settings
            </a>

            <a href="/account/" class="auth-only" hidden>
                Account
            </a>

            <a href="/login/" class="guest-only">
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link"
            >
                Create Account
            </a>

            <button
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden
            >
                Log Out
            </button>

        </div>

    </div>
</nav>


<main class="center-page">

    <section class="auth-card">

        <h1>
            Create your account
        </h1>

        <p>
            Join the Rip_Dead account system.
        </p>


        <form id="signup-form">

            <div class="form-group">

                <label
                    for="username"
                    class="form-label"
                >
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    maxlength="32"
                    autocomplete="username"
                    placeholder="your_username"
                    required
                >

            </div>


            <div class="form-group">

                <label
                    for="display-name"
                    class="form-label"
                >
                    Display Name
                </label>

                <input
                    id="display-name"
                    type="text"
                    maxlength="64"
                    placeholder="Your Name"
                    required
                >

            </div>


            <div class="form-group">

                <label
                    for="email"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div
                id="signup-message"
                class="message"
            ></div>


            <button
                id="signup-button"
                type="submit"
                class="button-full"
            >
                Create Account
            </button>

        </form>


        <p
            style="
                margin-top:20px;
                margin-bottom:0;
                text-align:center;
            "
        >
            Already have an account?
            <a href="/login/">
                Log in
            </a>
        </p>

    </section>

</main>


<script>
document.addEventListener("DOMContentLoaded", async () => {

    const session = await getSession();

    await initNavbar();

    if (session) {
        window.location.href = "/account/";
        return;
    }


    document.getElementById("signup-form").addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const button =
                document.getElementById("signup-button");

            button.disabled = true;
            button.textContent = "Creating...";

            setMessage("signup-message", "");


            const username =
                document.getElementById("username").value.trim();

            const displayName =
                document
                    .getElementById("display-name")
                    .value
                    .trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            const {
                data,
                error
            } = await supabaseClient.auth.signUp({
                email,
                password,

                options: {
                    data: {
                        username,
                        display_name: displayName
                    }
                }
            });


            if (error) {

                setMessage(
                    "signup-message",
                    error.message,
                    "error"
                );

                button.disabled = false;
                button.textContent = "Create Account";

                return;
            }


            if (!data.session) {

                setMessage(
                    "signup-message",
                    "Account created. Check your email to confirm your account.",
                    "success"
                );

                button.disabled = false;
                button.textContent = "Create Account";

                return;
            }


            window.location.href = "/account/";
        }
    );
});
</script>

</body>
</html>
