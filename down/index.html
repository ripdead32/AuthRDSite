<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Site Down — Rip_Dead Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #09070f;
            color: #ffffff;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(168, 85, 247, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(20, 184, 166, 0.08),
                    transparent 30%
                );
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 620px;
            text-align: center;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    #7e22ce,
                    #a855f7
                );

            box-shadow:
                0 0 35px rgba(168, 85, 247, 0.28);
        }

        .logo span {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 18px;
            padding: 7px 12px;

            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 999px;

            background: rgba(168, 85, 247, 0.08);

            color: #c084fc;
            font-size: 13px;
            font-weight: 700;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c084fc;
            box-shadow: 0 0 10px #c084fc;
        }

        h1 {
            margin: 0;

            font-size: clamp(34px, 7vw, 56px);
            line-height: 1.05;
            letter-spacing: -2px;
        }

        .subtitle {
            max-width: 520px;
            margin: 20px auto 0;

            color: #aaa4b8;
            font-size: 17px;
            line-height: 1.6;
        }

        .notice {
            margin: 30px auto 0;
            padding: 18px 20px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;

            background: rgba(255, 255, 255, 0.035);

            color: #d7d2df;
            font-size: 14px;
            line-height: 1.6;
        }

        .notice strong {
            color: #ffffff;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;

            margin-top: 28px;
        }

        button,
        a {
            min-width: 130px;
            padding: 12px 18px;

            border-radius: 10px;

            font: inherit;
            font-size: 14px;
            font-weight: 700;

            text-decoration: none;
            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        button {
            border: 0;

            background: #a855f7;
            color: #ffffff;

            box-shadow:
                0 6px 20px rgba(168, 85, 247, 0.2);
        }

        button:hover {
            background: #9333ea;
            transform: translateY(-1px);
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255, 255, 255, 0.1);

            background: rgba(255, 255, 255, 0.04);
            color: #ddd7e5;
        }

        a:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 38px;

            color: #686171;
            font-size: 12px;
        }

        @media (max-width: 520px) {
            body {
                padding: 18px;
            }

            .logo {
                width: 66px;
                height: 66px;
                margin-bottom: 22px;
            }

            .logo span {
                font-size: 26px;
            }

            h1 {
                letter-spacing: -1.5px;
            }

            .subtitle {
                font-size: 15px;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            a {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            <span>RD</span>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Temporarily unavailable
        </div>

        <h1>
            Rip_Dead Account is down.
        </h1>

        <p class="subtitle">
            We're having trouble connecting to the
            Rip_Dead Account services right now.
        </p>

        <div class="notice">
            This may be caused by the backend being
            temporarily unavailable, paused, or undergoing
            maintenance.
            <br><br>
            <strong>
                Your account data has not been deleted.
            </strong>
        </div>

        <div class="buttons">
            <button onclick="location.reload()">
                Try Again
            </button>

        <div class="footer">
            Rip_Dead Account
        </div>

    </main>

</body>
</html>
