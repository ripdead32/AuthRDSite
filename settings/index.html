<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="/">Home</a>
            <a href="/search/" class="auth-only" hidden>Search</a>
            <a href="/friends/" class="auth-only" hidden>Friends</a>
            <a href="/settings/" class="auth-only" hidden>Settings</a>
            <a href="/account/" class="auth-only" hidden>Account</a>

            <a href="/login/" class="guest-only">Log In</a>

            <a href="/signup/" class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>

        </div>

    </div>
</nav>

<main class="auth-container">

    <section class="auth-card">

        <div class="auth-card-header">

            <span class="auth-eyebrow">
                RIP_DEAD ACCOUNT
            </span>

            <h1>Settings</h1>

            <p class="auth-subtitle">
                Manage your account and profile.
            </p>

        </div>

        <div
            id="settings-message"
            class="auth-message"
            aria-live="polite">
        </div>

        <section>

            <h2>Profile</h2>

            <p>
                Change your username, display name,
                biography and profile picture.
            </p>

            <a
                href="/profile/"
                class="button-link">
                Edit Profile
            </a>

        </section>

        <section>

            <h2>Account</h2>

            <p id="account-email">
                Loading...
            </p>

        </section>

        <section>

            <h2>Session</h2>

            <button
                type="button"
                id="settings-logout">
                Log Out
            </button>

        </section>

    </section>

</main>

<script>
let settingsSession = null;

const settingsMessage =
    document.getElementById(
        "settings-message"
    );

async function initializeSettings() {

    settingsSession =
        await requireAuth();

    if (!settingsSession) {
        return;
    }

    await initNavbar();

    document.getElementById(
        "account-email"
    ).textContent =
        settingsSession.user.email ||
        "No email available";
}

document.getElementById(
    "settings-logout"
).addEventListener(
    "click",
    async () => {

        const button =
            document.getElementById(
                "settings-logout"
            );

        button.disabled = true;
        button.textContent =
            "Logging out...";

        await signOut();
    }
);

initializeSettings();
</script>

</body>
</html>
