                    .from("conversations")
                    .insert({
                        id:
                            conversationId,
                        name,
                        is_group: true
                    })
                    .select(
                        "id,created_at,name,is_group"
                    )
                    .single();

            if (error) {
                console.error(
                    "[Chat] Group creation error:",
                    error
                );

                button.disabled =
                    false;

                showStatus(
                    status,
                    error.message,
                    true
                );

                return;
            }

            const members = [
                {
                    conversation_id:
                        conversation.id,
                    user_id:
                        currentSession
                            .user
                            .id
                },

                ...selectedGroupUsers.map(
                    profile => ({
                        conversation_id:
                            conversation.id,
                        user_id:
                            profile.id
                    })
                )
            ];

            const {
                error:
                    memberError
            } =
                await db
                    .from(
                        "conversation_members"
                    )
                    .insert(
                        members
                    );

            if (memberError) {
                console.error(
                    "[Chat] Group member error:",
                    memberError
                );

                button.disabled =
                    false;

                showStatus(
                    status,
                    memberError.message,
                    true
                );

                return;
            }

            hideModal(
                "group-modal"
            );

            resetGroupModal();

            await loadConversations();

            await openConversation(
                conversation.id
            );

            button.disabled =
                false;
        }

        function resetGroupModal() {
            $("group-name").value =
                "";

            $("group-user-search").value =
                "";

            $("group-user-results").innerHTML = `
                <div class="empty-list">
                    Search for people to add.
                </div>
            `;

            $("group-status").style.display =
                "none";

            selectedGroupUsers =
                [];

            renderSelectedUsers();
        }

        /*
         * --------------------------------------------------
         * Leave conversation
         * --------------------------------------------------
         *
         * The database currently does not expose a DELETE
         * policy for conversation_members.
         *
         * Therefore we don't attempt an operation the RLS
         * policies will reject.
         *
         * The button is kept hidden until this is enabled.
         */

        async function leaveConversation() {
            /*
             * Intentionally disabled because the supplied RLS
             * does not permit DELETE on conversation_members.
             */
            alert(
                "Leaving conversations is not enabled in the current database policies."
            );
        }

        /*
         * --------------------------------------------------
         * Realtime
         * --------------------------------------------------
         */

        function setupRealtime() {
            cleanupRealtime();

            conversationRealtimeChannel =
                db
                    .channel(
                        "ripdead-chat-conversations"
                    )
                    .on(
                        "postgres_changes",
                        {
                            event: "*",
                            schema: "public",
                            table: "conversation_members"
                        },
                        async () => {
                            console.log(
                                "[Chat] Conversation membership changed."
                            );

                            await loadConversations();
                        }
                    )
                    .on(
                        "postgres_changes",
                        {
                            event: "*",
                            schema: "public",
                            table: "conversations"
                        },
                        async () => {
                            await loadConversations();
                        }
                    )
                    .subscribe(
                        status => {
                            console.log(
                                "[Chat] Conversation realtime:",
                                status
                            );
                        }
                    );

            messageRealtimeChannel =
                db
                    .channel(
                        "ripdead-chat-messages"
                    )
                    .on(
                        "postgres_changes",
                        {
                            event: "INSERT",
                            schema: "public",
                            table: "messages"
                        },
                        async payload => {
                            const message =
                                payload.new;

                            if (
                                !message ||
                                String(
                                    message.conversation_id
                                ) !==
                                    String(
                                        currentConversationId
                                    )
                            ) {
                                await refreshConversationPreview(
                                    message
                                        ?.conversation_id
                                );

                                return;
                            }

                            await loadProfiles([
                                message.sender_id
                            ]);

                            const alreadyRendered =
                                document.querySelector(
                                    `[data-message-id="${message.id}"]`
                                );

                            if (
                                alreadyRendered
                            ) {
                                return;
                            }

                            const welcome =
                                $("messages")
                                    .querySelector(
                                        ".welcome"
                                    );

                            if (welcome) {
                                $("messages").innerHTML =
                                    "";
                            }

                            const element =
                                createMessageElement(
                                    message
                                );

                            element.dataset.messageId =
                                message.id;

                            $("messages").appendChild(
                                element
                            );

                            scrollMessagesToBottom();

                            await refreshConversationPreview(
                                message.conversation_id
                            );
                        }
                    )
                    .on(
                        "postgres_changes",
                        {
                            event: "DELETE",
                            schema: "public",
                            table: "messages"
                        },
                        async payload => {
                            const deleted =
                                payload.old;

                            if (
                                String(
                                    deleted
                                        ?.conversation_id
                                ) ===
                                String(
                                    currentConversationId
                                )
                            ) {
                                await loadMessages(
                                    currentConversationId
                                );
                            }

                            await refreshConversationPreview(
                                deleted
                                    ?.conversation_id
                            );
                        }
                    )
                    .subscribe(
                        status => {
                            console.log(
                                "[Chat] Message realtime:",
                                status
                            );
                        }
                    );
        }

        function cleanupRealtime() {
            if (
                conversationRealtimeChannel
            ) {
                db.removeChannel(
                    conversationRealtimeChannel
                );

                conversationRealtimeChannel =
                    null;
            }

            if (
                messageRealtimeChannel
            ) {
                db.removeChannel(
                    messageRealtimeChannel
                );

                messageRealtimeChannel =
                    null;
            }
        }

        /*
         * --------------------------------------------------
         * Composer
         * --------------------------------------------------
         */

        function resizeComposer() {
            const input =
                $("message-input");

            input.style.height =
                "auto";

            input.style.height =
                Math.min(
                    input.scrollHeight,
                    150
                ) + "px";
        }

        /*
         * --------------------------------------------------
         * Modal events
         * --------------------------------------------------
         */

        $("new-chat-button")
            .addEventListener(
                "click",
                () => {
                    $("user-search")
                        .value = "";

                    $("user-results")
                        .innerHTML = `
                            <div class="empty-list">
                                Search for a user to start chatting.
                            </div>
                        `;

                    showModal(
                        "new-chat-modal"
                    );

                    $("user-search")
                        .focus();
                }
            );

        $("new-chat-close")
            .addEventListener(
                "click",
                () =>
                    hideModal(
                        "new-chat-modal"
                    )
            );

        $("new-chat-cancel")
            .addEventListener(
                "click",
                () =>
                    hideModal(
                        "new-chat-modal"
                    )
            );

        $("user-search")
            .addEventListener(
                "input",
                () => {
                    clearTimeout(
                        userSearchTimer
                    );

                    userSearchTimer =
                        setTimeout(
                            () =>
                                searchUsers(
                                    $("user-search"),
                                    $("user-results"),
                                    false
                                ),
                            250
                        );
                }
            );

        /*
         * Double-clicking the + button opens group creation.
         * This keeps the UI simple without adding another
         * permanent button.
         */
        let newChatClickTimer =
            null;

        $("new-chat-button")
            .addEventListener(
                "dblclick",
                event => {
                    event.preventDefault();

                    clearTimeout(
                        newChatClickTimer
                    );

                    hideModal(
                        "new-chat-modal"
                    );

                    resetGroupModal();

                    showModal(
                        "group-modal"
                    );
                }
            );

        $("group-close")
            .addEventListener(
                "click",
                () =>
                    hideModal(
                        "group-modal"
                    )
            );

        $("group-cancel")
            .addEventListener(
                "click",
                () => {
                    hideModal(
                        "group-modal"
                    );

                    resetGroupModal();
                }
            );

        $("group-user-search")
            .addEventListener(
                "input",
                () => {
                    clearTimeout(
                        groupSearchTimer
                    );

                    groupSearchTimer =
                        setTimeout(
                            () =>
                                searchUsers(
                                    $("group-user-search"),
                                    $("group-user-results"),
                                    true
                                ),
                            250
                        );
                }
            );

        $("group-create")
            .addEventListener(
                "click",
                createGroup
            );

        $("new-chat-modal")
            .addEventListener(
                "click",
                event => {
                    if (
                        event.target ===
                        $("new-chat-modal")
                    ) {
                        hideModal(
                            "new-chat-modal"
                        );
                    }
                }
            );

        $("group-modal")
            .addEventListener(
                "click",
                event => {
                    if (
                        event.target ===
                        $("group-modal")
                    ) {
                        hideModal(
                            "group-modal"
                        );
                    }
                }
            );

        /*
         * --------------------------------------------------
         * Conversation search
         * --------------------------------------------------
         */

        $("conversation-search")
            .addEventListener(
                "input",
                () =>
                    renderConversationList()
            );

        /*
         * --------------------------------------------------
         * Composer events
         * --------------------------------------------------
         */

        $("composer")
            .addEventListener(
                "submit",
                event => {
                    event.preventDefault();

                    sendMessage();
                }
            );

        $("message-input")
            .addEventListener(
                "input",
                resizeComposer
            );

        $("message-input")
            .addEventListener(
                "keydown",
                event => {
                    if (
                        event.key ===
                            "Enter" &&
                        !event.shiftKey
                    ) {
                        event.preventDefault();

                        sendMessage();
                    }
                }
            );

        $("mobile-back")
            .addEventListener(
                "click",
                () => {
                    $("chat-page")
                        .classList.remove(
                            "mobile-chat-open"
                        );
                }
            );

        /*
         * --------------------------------------------------
         * Auth state changes
         * --------------------------------------------------
         */

        db.auth.onAuthStateChange(
            (event, session) => {
                console.log(
                    "[Chat] Auth event:",
                    event
                );

                if (
                    event ===
                        "SIGNED_OUT" ||
                    !session
                ) {
                    window.location.href =
                        "/login/";
                }
            }
        );

        /*
         * --------------------------------------------------
         * Start
         * --------------------------------------------------
         */

        initializeChat();
    </script>

</body>
</html>
