            /* =====================================================
               HELPERS
            ===================================================== */

            function normalizeId(id) {
                return String(id);
            }


            function getInitials(value) {
                let text = "";

                if (typeof value === "string") {
                    text = value;
                } else {
                    text =
                        value?.display_name ||
                        value?.username ||
                        "";
                }

                const parts =
                    text
                        .trim()
                        .split(/\s+/)
                        .filter(Boolean);

                if (!parts.length) {
                    return "?";
                }

                if (parts.length === 1) {
                    return parts[0]
                        .substring(0, 2)
                        .toUpperCase();
                }

                return (
                    parts[0][0] +
                    parts[parts.length - 1][0]
                ).toUpperCase();
            }


            function validAvatarURL(url) {
                if (!url) {
                    return null;
                }

                try {
                    const parsed =
                        new URL(url);

                    if (
                        parsed.protocol !==
                            "https:" &&
                        parsed.protocol !==
                            "http:"
                    ) {
                        return null;
                    }

                    return parsed.href;

                } catch {
                    return null;
                }
            }


            function renderAvatar(
                element,
                profile,
                fallback
            ) {
                if (!element) {
                    return;
                }

                element.innerHTML = "";

                const url =
                    validAvatarURL(
                        profile?.avatar_url
                    );

                if (url) {
                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src = url;
                    img.alt = "";

                    img.onerror = () => {
                        element.textContent =
                            getInitials(
                                profile ||
                                fallback ||
                                "?"
                            );
                    };

                    element.appendChild(img);

                    return;
                }

                element.textContent =
                    getInitials(
                        profile ||
                        fallback ||
                        "?"
                    );
            }


            function formatTime(timestamp) {
                if (!timestamp) {
                    return "";
                }

                const date =
                    new Date(timestamp);

                if (
                    Number.isNaN(
                        date.getTime()
                    )
                ) {
                    return "";
                }

                const now =
                    new Date();

                if (
                    date.toDateString() ===
                    now.toDateString()
                ) {
                    return date.toLocaleTimeString(
                        [],
                        {
                            hour: "numeric",
                            minute: "2-digit"
                        }
                    );
                }

                return date.toLocaleDateString(
                    [],
                    {
                        month: "short",
                        day: "numeric"
                    }
                );
            }


            function generateNumericId() {
                return (
                    Date.now() * 1000 +
                    Math.floor(
                        Math.random() * 1000
                    )
                );
            }


            async function insertWithGeneratedId(
                table,
                payload
            ) {
                for (
                    let attempt = 0;
                    attempt < 5;
                    attempt++
                ) {
                    const id =
                        generateNumericId();

                    const {
                        data,
                        error
                    } = await db
                        .from(table)
                        .insert({
                            id,
                            ...payload
                        })
                        .select()
                        .single();

                    if (!error) {
                        return data;
                    }

                    if (
                        error.code !==
                        "23505"
                    ) {
                        throw error;
                    }
                }

                throw new Error(
                    "Could not generate a unique ID."
                );
            }


            function getConversationMembers(
                conversationId
            ) {
                return (
                    conversationMembers.get(
                        normalizeId(
                            conversationId
                        )
                    ) || []
                );
            }


            function getConversationProfile(
                conversation
            ) {
                if (
                    conversation.is_group
                ) {
                    return null;
                }

                const members =
                    getConversationMembers(
                        conversation.id
                    );

                const otherId =
                    members.find(
                        id =>
                            normalizeId(id) !==
                            normalizeId(
                                currentUser.id
                            )
                    );

                if (!otherId) {
                    return null;
                }

                return profiles.get(
                    normalizeId(otherId)
                );
            }


            function getConversationName(
                conversation
            ) {
                if (
                    conversation.is_group
                ) {
                    return (
                        conversation.name ||
                        "Group Chat"
                    );
                }

                const profile =
                    getConversationProfile(
                        conversation
                    );

                return (
                    profile?.display_name ||
                    profile?.username ||
                    "Unknown user"
                );
            }


            function setMessagesEmpty(
                text
            ) {
                messagesElement.innerHTML =
                    "";

                const element =
                    document.createElement(
                        "div"
                    );

                element.className =
                    "messages-empty";

                element.textContent = text;

                messagesElement.appendChild(
                    element
                );
            }


            /* =====================================================
               CONVERSATIONS
            ===================================================== */

            async function loadConversations() {
                if (!currentUser) {
                    return;
                }

                const {
                    data: memberships,
                    error:
                        membershipError
                } = await db
                    .from(
                        "conversation_members"
                    )
                    .select(
                        "conversation_id,user_id,joined_at"
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    );

                if (membershipError) {
                    console.error(
                        "[Chat] Membership error:",
                        membershipError
                    );

                    conversationList.innerHTML =
                        "";

                    const error =
                        document.createElement(
                            "div"
                        );

                    error.className =
                        "empty-conversations";

                    error.textContent =
                        membershipError.message;

                    conversationList.appendChild(
                        error
                    );

                    return;
                }


                const ids =
                    [
                        ...new Set(
                            (
                                memberships || []
                            ).map(
                                row =>
                                    normalizeId(
                                        row.conversation_id
                                    )
                            )
                        )
                    ];


                conversations = [];
                conversationMembers =
                    new Map();
                latestMessages =
                    new Map();


                if (!ids.length) {
                    renderConversationList();
                    resetChat();

                    return;
                }


                const {
                    data:
                        conversationRows,
                    error:
                        conversationError
                } = await db
                    .from(
                        "conversations"
                    )
                    .select(
                        "id,created_at,name,is_group"
                    )
                    .in("id", ids);


                if (conversationError) {
                    console.error(
                        "[Chat] Conversation error:",
                        conversationError
                    );

                    return;
                }


                conversations =
                    conversationRows || [];


                const {
                    data: memberRows,
                    error: memberError
                } = await db
                    .from(
                        "conversation_members"
                    )
                    .select(
                        "conversation_id,user_id,joined_at"
                    )
                    .in(
                        "conversation_id",
                        ids
                    );


                if (memberError) {
                    console.error(
                        "[Chat] Member error:",
                        memberError
                    );

                    return;
                }


                const profileIds =
                    new Set();


                for (
                    const row
                    of memberRows || []
                ) {
                    const conversationId =
                        normalizeId(
                            row.conversation_id
                        );

                    if (
                        !conversationMembers.has(
                            conversationId
                        )
                    ) {
                        conversationMembers.set(
                            conversationId,
                            []
                        );
                    }

                    conversationMembers
                        .get(conversationId)
                        .push(row.user_id);

                    profileIds.add(
                        normalizeId(
                            row.user_id
                        )
                    );
                }


                if (profileIds.size) {
                    const {
                        data: profileRows,
                        error: profileError
                    } = await db
                        .from("profiles")
                        .select(
                            "id,username,display_name,avatar_url,is_verified,bio"
                        )
                        .in(
                            "id",
                            [
                                ...profileIds
                            ]
                        );

                    if (!profileError) {
                        profiles =
                            new Map(
                                (
                                    profileRows ||
                                    []
                                ).map(
                                    profile => [
                                        normalizeId(
                                            profile.id
                                        ),
                                        profile
                                    ]
                                )
                            );
                    }
                }


                const {
                    data: recentMessages,
                    error:
                        recentMessageError
                } = await db
                    .from("messages")
                    .select(
                        "id,conversation_id,sender_id,content,created_at"
                    )
                    .in(
                        "conversation_id",
                        ids
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(300);


                if (!recentMessageError) {
                    for (
                        const message
                        of recentMessages || []
                    ) {
                        const id =
                            normalizeId(
                                message.conversation_id
                            );

                        if (
                            !latestMessages.has(
                                id
                            )
                        ) {
                            latestMessages.set(
                                id,
                                message
                            );
                        }
                    }
                }


                conversations.sort(
                    (a, b) => {
                        const aLatest =
                            latestMessages.get(
                                normalizeId(
                                    a.id
                                )
                            );

                        const bLatest =
                            latestMessages.get(
                                normalizeId(
                                    b.id
                                )
                            );

                        return (
                            new Date(
                                bLatest?.created_at ||
                                b.created_at
                            ).getTime() -
                            new Date(
                                aLatest?.created_at ||
                                a.created_at
                            ).getTime()
                        );
                    }
                );


                renderConversationList();


                if (
                    currentConversationId
                ) {
                    const exists =
                        conversations.some(
                            conversation =>
                                normalizeId(
                                    conversation.id
                                ) ===
                                normalizeId(
                                    currentConversationId
                                )
                        );

                    if (!exists) {
                        resetChat();
                    }
                }
            }


            function renderConversationList() {
                conversationList.innerHTML =
                    "";

                const query =
                    conversationSearch.value
                        .trim()
                        .toLowerCase();


                const filtered =
                    conversations.filter(
                        conversation => {
                            if (!query) {
                                return true;
                            }

                            const name =
                                getConversationName(
                                    conversation
                                ).toLowerCase();

                            const latest =
                                latestMessages.get(
                                    normalizeId(
                                        conversation.id
                                    )
                                );

                            const preview =
                                (
                                    latest?.content ||
                                    ""
                                ).toLowerCase();

                            return (
                                name.includes(
                                    query
                                ) ||
                                preview.includes(
                                    query
                                )
                            );
                        }
                    );


                if (!filtered.length) {
                    const empty =
                        document.createElement(
                            "div"
                        );

                    empty.className =
                        "empty-conversations";

                    empty.textContent =
                        conversations.length
                            ? "No conversations found."
                            : "No conversations yet. Click + to start one.";

                    conversationList.appendChild(
                        empty
                    );

                    return;
                }


                for (
                    const conversation
                    of filtered
                ) {
                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "conversation";


                    if (
                        currentConversationId &&
                        normalizeId(
                            currentConversationId
                        ) ===
                        normalizeId(
                            conversation.id
                        )
                    ) {
                        item.classList.add(
                            "active"
                        );
                    }


                    const avatar =
                        document.createElement(
                            "div"
                        );

                    avatar.className =
                        "avatar small";


                    const profile =
                        getConversationProfile(
                            conversation
                        );


                    if (
                        conversation.is_group
                    ) {
                        avatar.textContent =
                            "👥";
                    } else {
                        renderAvatar(
                            avatar,
                            profile,
                            getConversationName(
                                conversation
                            )
                        );
                    }


                    const info =
                        document.createElement(
                            "div"
                        );

                    info.className =
                        "conversation-info";


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "conversation-name";

                    name.textContent =
                        getConversationName(
                            conversation
                        );


                    if (
                        profile?.is_verified
                    ) {
                        const badge =
                            document.createElement(
                                "span"
                            );

                        badge.className =
                            "verified";

                        badge.textContent =
                            "✓";

                        name.appendChild(
                            badge
                        );
                    }


                    const latest =
                        latestMessages.get(
                            normalizeId(
                                conversation.id
                            )
                        );


                    const preview =
                        document.createElement(
                            "div"
                        );

                    preview.className =
                        "conversation-preview";

                    preview.textContent =
                        latest
                            ? latest.content
                            : conversation.is_group
                                ? "Group chat"
                                : "No messages yet";


                    info.appendChild(name);
                    info.appendChild(preview);


                    const time =
                        document.createElement(
                            "div"
                        );

                    time.className =
                        "conversation-time";

                    time.textContent =
                        formatTime(
                            latest?.created_at ||
                            conversation.created_at
                        );


                    item.appendChild(avatar);
                    item.appendChild(info);
                    item.appendChild(time);


                    item.addEventListener(
                        "click",
                        () =>
                            openConversation(
                                conversation.id
                            )
                    );


                    conversationList.appendChild(
                        item
                    );
                }
            }


            /* =====================================================
               OPEN CHAT
            ===================================================== */

            async function openConversation(
                conversationId
            ) {
                currentConversationId =
                    normalizeId(
                        conversationId
                    );


                const conversation =
                    conversations.find(
                        item =>
                            normalizeId(
                                item.id
                            ) ===
                            currentConversationId
                    );


                if (!conversation) {
                    resetChat();
                    return;
                }


                chatPage.classList.add(
                    "mobile-chat-open"
                );


                const profile =
                    getConversationProfile(
                        conversation
                    );


                headerName.textContent =
                    getConversationName(
                        conversation
                    );


                if (
                    conversation.is_group
                ) {
                    headerAvatar.textContent =
                        "👥";

                    headerSubtitle.textContent =
                        getConversationMembers(
                            conversation.id
                        ).length +
                        " members";
                } else {
                    renderAvatar(
                        headerAvatar,
                        profile,
                        getConversationName(
                            conversation
                        )
                    );

                    headerSubtitle.textContent =
                        profile?.username
                            ? "@" +
                              profile.username
                            : "Direct message";
                }


                leaveButton.hidden = false;
                messageForm.hidden = false;

                renderedMessageIds.clear();

                renderConversationList();

                await loadMessages(
                    conversation.id
                );

                messageInput.focus();
            }


            async function loadMessages(
                conversationId
            ) {
                setMessagesEmpty(
                    "Loading messages..."
                );


                const {
                    data,
                    error
                } = await db
                    .from("messages")
                    .select(
                        "id,conversation_id,sender_id,content,created_at"
                    )
                    .eq(
                        "conversation_id",
                        conversationId
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    )
                    .limit(500);


                if (error) {
                    console.error(
                        "[Chat] Message error:",
                        error
                    );

                    setMessagesEmpty(
                        error.message
                    );

                    return;
                }


                messagesElement.innerHTML =
                    "";


                if (!data?.length) {
                    setMessagesEmpty(
                        "No messages yet. Say hello!"
                    );

                    return;
                }


                for (
                    const message
                    of data
                ) {
                    appendMessage(
                        message,
                        false
                    );
                }


                scrollMessages();
            }


            /* =====================================================
               MESSAGE RENDERING
            ===================================================== */

            const renderedMessageIds =
                new Set();


            function appendMessage(
                message,
                shouldScroll = true
            ) {
                const messageId =
                    normalizeId(
                        message.id
                    );


                if (
                    renderedMessageIds.has(
                        messageId
                    )
                ) {
                    return;
                }


                renderedMessageIds.add(
                    messageId
                );


                const empty =
                    messagesElement.querySelector(
                        ".messages-empty"
                    );

                if (empty) {
                    empty.remove();
                }


                const mine =
                    normalizeId(
                        message.sender_id
                    ) ===
                    normalizeId(
                        currentUser.id
                    );


                const profile =
                    profiles.get(
                        normalizeId(
                            message.sender_id
                        )
                    );


                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "message-row";

                row.dataset.messageId =
                    messageId;


                if (mine) {
                    row.classList.add(
                        "mine"
                    );
                }


                const avatar =
                    document.createElement(
                        "div"
                    );

                avatar.className =
                    "avatar small";


                renderAvatar(
                    avatar,
                    profile,
                    mine
                        ? currentUser.email
                        : "User"
                );


                const area =
                    document.createElement(
                        "div"
                    );

                area.className =
                    "message-content-area";


                const meta =
                    document.createElement(
                        "div"
                    );

                meta.className =
                    "message-meta";


                const author =
                    document.createElement(
                        "span"
                    );

                author.className =
                    "message-author";

                author.textContent =
                    mine
                        ? "You"
                        : (
                            profile?.display_name ||
                            profile?.username ||
                            "Unknown user"
                        );


                if (
                    profile?.is_verified
                ) {
                    const badge =
                        document.createElement(
                            "span"
                        );

                    badge.className =
                        "verified";

                    badge.textContent =
                        " ✓";

                    author.appendChild(
                        badge
                    );
                }


                const time =
                    document.createElement(
                        "span"
                    );

                time.className =
                    "message-time";

                time.textContent =
                    formatTime(
                        message.created_at
                    );


                meta.appendChild(author);
                meta.appendChild(time);


                const bubble =
                    document.createElement(
                        "div"
                    );

                bubble.className =
                    "message-bubble";

                bubble.textContent =
                    message.content;


                area.appendChild(meta);
                area.appendChild(bubble);


                if (mine) {
                    const actions =
                        document.createElement(
                            "div"
                        );

                    actions.className =
                        "message-actions";


                    const deleteButton =
                        document.createElement(
                            "button"
                        );

                    deleteButton.type =
                        "button";

                    deleteButton.className =
                        "message-delete";

                    deleteButton.textContent =
                        "Delete";


                    deleteButton.addEventListener(
                        "click",
                        () =>
                            deleteMessage(
                                message.id,
                                row
                            )
                    );


                    actions.appendChild(
                        deleteButton
                    );

                    area.appendChild(
                        actions
                    );
                }


                row.appendChild(avatar);
                row.appendChild(area);

                messagesElement.appendChild(
                    row
                );


                if (shouldScroll) {
                    scrollMessages();
                }
            }


            function removeRenderedMessage(
                messageId
            ) {
                const id =
                    normalizeId(messageId);

                const row =
                    messagesElement.querySelector(
                        `[data-message-id="${CSS.escape(id)}"]`
                    );

                if (row) {
                    row.remove();
                }

                renderedMessageIds.delete(
                    id
                );
            }


            function scrollMessages() {
                messagesElement.scrollTop =
                    messagesElement.scrollHeight;
            }


            /* =====================================================
               SEND MESSAGE
            ===================================================== */

            async function sendMessage() {
                const content =
                    messageInput.value.trim();


                if (
                    !content ||
                    !currentConversationId ||
                    !currentUser
                ) {
                    return;
                }


                sendButton.disabled = true;


                const {
                    data,
                    error
                } = await insertMessage({
                    conversation_id:
                        currentConversationId,

                    sender_id:
                        currentUser.id,

                    content
                });


                if (error) {
                    console.error(
                        "[Chat] Send error:",
                        error
                    );

                    alert(
                        "Could not send message:\n" +
                        error.message
                    );

                    sendButton.disabled = false;

                    return;
                }


                messageInput.value = "";


                if (data) {
                    appendMessage(
                        data,
                        true
                    );
                }


                await refreshConversationPreviews();


                sendButton.disabled = false;

                messageInput.focus();
            }


            async function insertMessage(
                payload
            ) {
                for (
                    let attempt = 0;
                    attempt < 5;
                    attempt++
                ) {
                    const id =
                        generateNumericId();

                    const {
                        data,
                        error
                    } = await db
                        .from("messages")
                        .insert({
                            id,
                            ...payload
                        })
                        .select()
                        .single();


                    if (!error) {
                        return {
                            data,
                            error: null
                        };
                    }


                    if (
                        error.code !==
                        "23505"
                    ) {
                        return {
                            data: null,
                            error
                        };
                    }
                }


                return {
                    data: null,
                    error: new Error(
                        "Could not create message ID."
                    )
                };
            }


            /* =====================================================
               DELETE MESSAGE
            ===================================================== */

            async function deleteMessage(
                messageId,
                row
            ) {
                if (
                    !confirm(
                        "Delete this message?"
                    )
                ) {
                    return;
                }


                const {
                    error
                } = await db
                    .from("messages")
                    .delete()
                    .eq(
                        "id",
                        messageId
                    )
                    .eq(
                        "sender_id",
                        currentUser.id
                    );


                if (error) {
                    console.error(
                        "[Chat] Delete error:",
                        error
                    );

                    alert(
                        "Could not delete message:\n" +
                        error.message
                    );

                    return;
                }


                row.remove();

                renderedMessageIds.delete(
                    normalizeId(messageId)
                );

                await refreshConversationPreviews();
            }


            /* =====================================================
               LEAVE CONVERSATION
            ===================================================== */

            async function leaveConversation() {
                if (
                    !currentConversationId ||
                    !currentUser
                ) {
                    return;
                }


                const conversation =
                    conversations.find(
                        item =>
                            normalizeId(
                                item.id
                            ) ===
                            normalizeId(
                                currentConversationId
                            )
                    );


                if (!conversation) {
                    return;
                }


                const name =
                    getConversationName(
                        conversation
                    );


                if (
                    !confirm(
                        `Leave "${name}"?`
                    )
                ) {
                    return;
                }


                leaveButton.disabled = true;


                const {
                    error
                } = await db
                    .from(
                        "conversation_members"
                    )
                    .delete()
                    .eq(
                        "conversation_id",
                        currentConversationId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    );


                if (error) {
                    console.error(
                        "[Chat] Leave error:",
                        error
                    );

                    alert(
                        "Could not leave conversation:\n" +
                        error.message
                    );

                    leaveButton.disabled = false;

                    return;
                }


                currentConversationId =
                    null;

                resetChat();

                await loadConversations();

                leaveButton.disabled = false;
            }


            function resetChat() {
                currentConversationId =
                    null;

                headerAvatar.textContent =
                    "?";

                headerName.textContent =
                    "Select a conversation";

                headerSubtitle.textContent =
                    "Choose a conversation to start chatting";

                leaveButton.hidden = true;

                messageForm.hidden = true;

                renderedMessageIds.clear();

                setMessagesEmpty(
                    "Select a conversation to start chatting."
                );

                chatPage.classList.remove(
                    "mobile-chat-open"
                );

                renderConversationList();
            }


            /* =====================================================
               NEW CHAT MODAL
            ===================================================== */

            function openModal() {
                modalBackdrop.classList.add(
                    "visible"
                );

                modalStatus.textContent =
                    "";

                userSearch.value = "";

                groupName.value = "";

                selectedGroupUsers.clear();

                renderSelectedUsers();

                setModalMode("direct");

                searchResults.innerHTML =
                    "";

                userSearch.focus();
            }


            function closeModal() {
                modalBackdrop.classList.remove(
                    "visible"
                );
            }


            function setModalMode(
                mode
            ) {
                modalMode = mode;

                const group =
                    mode === "group";


                directModeButton.classList.toggle(
                    "active",
                    !group
                );

                groupModeButton.classList.toggle(
                    "active",
                    group
                );


                groupName.classList.toggle(
                    "visible",
                    group
                );


                selectedUsers.classList.toggle(
                    "visible",
                    group
                );


                createGroupButton.hidden =
                    !group;


                if (!group) {
                    selectedGroupUsers.clear();

                    renderSelectedUsers();
                }


                modalStatus.textContent =
                    "";
            }


            async function searchUsers() {
                const query =
                    userSearch.value.trim();


                searchResults.innerHTML =
                    "";


                if (!query || !currentUser) {
                    return;
                }


                const escaped =
                    query
                        .replace(
                            /\\/g,
                            "\\\\"
                        )
                        .replace(
                            /%/g,
                            "\\%"
                        )
                        .replace(
                            /_/g,
                            "\\_"
                        );


                const pattern =
                    "%" +
                    escaped +
                    "%";


                const [
                    usernameResult,
                    displayNameResult
                ] = await Promise.all([
                    db
                        .from("profiles")
                        .select(
                            "id,username,display_name,avatar_url,is_verified,bio"
                        )
                        .ilike(
                            "username",
                            pattern
                        )
                        .neq(
                            "id",
                            currentUser.id
                        )
                        .limit(20),

                    db
                        .from("profiles")
                        .select(
                            "id,username,display_name,avatar_url,is_verified,bio"
                        )
                        .ilike(
                            "display_name",
                            pattern
                        )
                        .neq(
                            "id",
                            currentUser.id
                        )
                        .limit(20)
                ]);


                if (
                    usernameResult.error ||
                    displayNameResult.error
                ) {
                    console.error(
                        "[Chat] Search error:",
                        usernameResult.error ||
                        displayNameResult.error
                    );

                    modalStatus.textContent =
                        "Could not search users.";

                    return;
                }


                const unique =
                    new Map();


                for (
                    const profile
                    of [
                        ...(
                            usernameResult.data ||
                            []
                        ),
                        ...(
                            displayNameResult.data ||
                            []
                        )
                    ]
                ) {
                    unique.set(
                        normalizeId(
                            profile.id
                        ),
                        profile
                    );
                }


                for (
                    const [
                        id,
                        profile
                    ] of unique
                ) {
                    profiles.set(
                        id,
                        profile
                    );
                }


                renderSearchResults(
                    [
                        ...unique.values()
                    ]
                );
            }


            function renderSearchResults(
                results
            ) {
                searchResults.innerHTML =
                    "";


                if (!results.length) {
                    const empty =
                        document.createElement(
                            "div"
                        );

                    empty.className =
                        "empty-conversations";

                    empty.textContent =
                        "No users found.";

                    searchResults.appendChild(
                        empty
                    );

                    return;
                }


                for (
                    const profile
                    of results
                ) {
                    const result =
                        document.createElement(
                            "div"
                        );

                    result.className =
                        "search-result";


                    const avatar =
                        document.createElement(
                            "div"
                        );

                    avatar.className =
                        "avatar small";


                    renderAvatar(
                        avatar,
                        profile,
                        profile.display_name ||
                        profile.username
                    );


                    const info =
                        document.createElement(
                            "div"
                        );

                    info.className =
                        "search-result-info";


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "search-result-name";

                    name.textContent =
                        profile.display_name ||
                        profile.username ||
                        "User";


                    if (
                        profile.is_verified
                    ) {
                        const badge =
                            document.createElement(
                                "span"
                            );

                        badge.className =
                            "verified";

                        badge.textContent =
                            " ✓";

                        name.appendChild(
                            badge
                        );
                    }


                    const username =
                        document.createElement(
                            "div"
                        );

                    username.className =
                        "search-result-username";

                    username.textContent =
                        profile.username
                            ? "@" +
                              profile.username
                            : "";


                    info.appendChild(name);
                    info.appendChild(username);

                    result.appendChild(avatar);
                    result.appendChild(info);


                    if (
                        modalMode ===
                        "group"
                    ) {
                        const indicator =
                            document.createElement(
                                "div"
                            );

                        indicator.className =
                            "select-indicator";


                        if (
                            selectedGroupUsers.has(
                                normalizeId(
                                    profile.id
                                )
                            )
                        ) {
                            indicator.classList.add(
                                "selected"
                            );
                        }


                        result.appendChild(
                            indicator
                        );


                        result.addEventListener(
                            "click",
                            () => {
                                toggleGroupUser(
                                    profile
                                );

                                renderSearchResults(
                                    results
                                );
                            }
                        );

                    } else {
                        result.addEventListener(
                            "click",
                            () =>
                                createDirectConversation(
                                    profile
                                )
                        );
                    }


                    searchResults.appendChild(
                        result
                    );
                }
            }


            function toggleGroupUser(
                profile
            ) {
                const id =
                    normalizeId(
                        profile.id
                    );


                if (
                    selectedGroupUsers.has(
                        id
                    )
                ) {
                    selectedGroupUsers.delete(
                        id
                    );
                } else {
                    selectedGroupUsers.set(
                        id,
                        profile
                    );
                }


                renderSelectedUsers();

                createGroupButton.disabled =
                    selectedGroupUsers.size <
                        1 ||
                    !groupName.value.trim();
            }


            function renderSelectedUsers() {
                selectedUsers.innerHTML =
                    "";


                for (
                    const profile
                    of selectedGroupUsers.values()
                ) {
                    const chip =
                        document.createElement(
                            "div"
                        );

                    chip.className =
                        "selected-user";

                    chip.textContent =
                        profile.display_name ||
                        profile.username ||
                        "User";

                    selectedUsers.appendChild(
                        chip
                    );
                }


                selectedUsers.classList.toggle(
                    "visible",
                    modalMode === "group" &&
                    selectedGroupUsers.size > 0
                );
            }


            /* =====================================================
               CREATE DM
            ===================================================== */

            async function createDirectConversation(
                targetProfile
            ) {
                modalStatus.textContent =
                    "Opening chat...";


                await loadConversations();


                const targetId =
                    normalizeId(
                        targetProfile.id
                    );


                const existing =
                    conversations.find(
                        conversation => {
                            if (
                                conversation.is_group
                            ) {
                                return false;
                            }

                            const members =
                                getConversationMembers(
                                    conversation.id
                                ).map(
                                    normalizeId
                                );

                            return (
                                members.length === 2 &&
                                members.includes(
                                    normalizeId(
                                        currentUser.id
                                    )
                                ) &&
                                members.includes(
                                    targetId
                                )
                            );
                        }
                    );


                if (existing) {
                    closeModal();

                    await openConversation(
                        existing.id
                    );

                    return;
                }


                try {
                    const conversation =
                        await insertWithGeneratedId(
                            "conversations",
                            {
                                name: null,
                                is_group: false
                            }
                        );


                    const {
                        error:
                            ownMemberError
                    } = await db
                        .from(
                            "conversation_members"
                        )
                        .insert({
                            conversation_id:
                                conversation.id,
                            user_id:
                                currentUser.id
                        });


                    if (ownMemberError) {
                        throw ownMemberError;
                    }


                    const {
                        error:
                            targetMemberError
                    } = await db
                        .from(
                            "conversation_members"
                        )
                        .insert({
                            conversation_id:
                                conversation.id,
                            user_id:
                                targetProfile.id
                        });


                    if (
                        targetMemberError
                    ) {
                        throw targetMemberError;
                    }


                    closeModal();

                    await loadConversations();

                    await openConversation(
                        conversation.id
                    );

                } catch (error) {
                    console.error(
                        "[Chat] Create DM error:",
                        error
                    );

                    modalStatus.textContent =
                        error.message ||
                        "Could not create chat.";
                }
            }


            /* =====================================================
               CREATE GROUP
            ===================================================== */

            async function createGroup() {
                const name =
                    groupName.value.trim();


                if (!name) {
                    modalStatus.textContent =
                        "Enter a group name.";

                    return;
                }


                if (
                    selectedGroupUsers.size <
                    1
                ) {
                    modalStatus.textContent =
                        "Select at least one user.";

                    return;
                }


                createGroupButton.disabled =
                    true;

                modalStatus.textContent =
                    "Creating group...";


                try {
                    const conversation =
                        await insertWithGeneratedId(
                            "conversations",
                            {
                                name,
                                is_group: true
                            }
                        );


                    const {
                        error: ownError
                    } = await db
                        .from(
                            "conversation_members"
                        )
                        .insert({
                            conversation_id:
                                conversation.id,
                            user_id:
                                currentUser.id
                        });


                    if (ownError) {
                        throw ownError;
                    }


                    for (
                        const profile
                        of selectedGroupUsers.values()
                    ) {
                        const {
                            error
                        } = await db
                            .from(
                                "conversation_members"
                            )
                            .insert({
                                conversation_id:
                                    conversation.id,
                                user_id:
                                    profile.id
                            });


                        if (error) {
                            throw error;
                        }
                    }


                    closeModal();

                    await loadConversations();

                    await openConversation(
                        conversation.id
                    );

                } catch (error) {
                    console.error(
                        "[Chat] Create group error:",
                        error
                    );

                    modalStatus.textContent =
                        error.message ||
                        "Could not create group.";

                    createGroupButton.disabled =
                        false;
                }
            }


            /* =====================================================
               REALTIME
            ===================================================== */

            function setupRealtime() {
                if (!db) {
                    return;
                }


                if (
                    realtimeMessagesChannel
                ) {
                    db.removeChannel(
                        realtimeMessagesChannel
                    );
                }


                if (
                    realtimeConversationsChannel
                ) {
                    db.removeChannel(
                        realtimeConversationsChannel
                    );
                }


                realtimeMessagesChannel =
                    db
                        .channel(
                            "ripdead-chat-messages"
                        )
                        .on(
                            "postgres_changes",
                            {
                                event: "INSERT",
                                schema: "public",
                                table: "messages"
                            },
                            async payload => {
                                const message =
                                    payload.new;


                                if (
                                    currentConversationId &&
                                    normalizeId(
                                        message.conversation_id
                                    ) ===
                                    normalizeId(
                                        currentConversationId
                                    )
                                ) {
                                    appendMessage(
                                        message,
                                        true
                                    );
                                }


                                await refreshConversationPreviews();
                            }
                        )
                        .on(
                            "postgres_changes",
                            {
                                event: "DELETE",
                                schema: "public",
                                table: "messages"
                            },
                            async payload => {
                                removeRenderedMessage(
                                    payload.old.id
                                );

                                await refreshConversationPreviews();
                            }
                        )
                        .subscribe();


                realtimeConversationsChannel =
                    db
                        .channel(
                            "ripdead-chat-members"
                        )
                        .on(
                            "postgres_changes",
                            {
                                event: "*",
                                schema: "public",
                                table:
                                    "conversation_members"
                            },
                            async () => {
                                await loadConversations();
                            }
                        )
                        .on(
                            "postgres_changes",
                            {
                                event: "*",
                                schema: "public",
                                table:
                                    "conversations"
                            },
                            async () => {
                                await loadConversations();
                            }
                        )
                        .subscribe();
            }


            async function refreshConversationPreviews() {
                if (
                    !conversations.length
                ) {
                    return;
                }


                const ids =
                    conversations.map(
                        conversation =>
                            conversation.id
                    );


                const {
                    data,
                    error
                } = await db
                    .from("messages")
                    .select(
                        "id,conversation_id,sender_id,content,created_at"
                    )
                    .in(
                        "conversation_id",
                        ids
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(300);


                if (error) {
                    return;
                }


                latestMessages =
                    new Map();


                for (
                    const message
                    of data || []
                ) {
                    const id =
                        normalizeId(
                            message.conversation_id
                        );

                    if (
                        !latestMessages.has(
                            id
                        )
                    ) {
                        latestMessages.set(
                            id,
                            message
                        );
                    }
                }


                conversations.sort(
                    (a, b) =>
                        new Date(
                            latestMessages.get(
                                normalizeId(
                                    b.id
                                )
                            )?.created_at ||
                            b.created_at
                        ).getTime() -
                        new Date(
                            latestMessages.get(
                                normalizeId(
                                    a.id
                                )
                            )?.created_at ||
                            a.created_at
                        ).getTime()
                );


                renderConversationList();
            }


            /* =====================================================
               EVENT HANDLERS
            ===================================================== */

            document
                .getElementById(
                    "new-chat-button"
                )
                .addEventListener(
                    "click",
                    openModal
                );


            document
                .getElementById(
                    "modal-close"
                )
                .addEventListener(
                    "click",
                    closeModal
                );


            document
                .getElementById(
                    "modal-cancel"
                )
                .addEventListener(
                    "click",
                    closeModal
                );


            modalBackdrop.addEventListener(
                "click",
                event => {
                    if (
                        event.target ===
                        modalBackdrop
                    ) {
                        closeModal();
                    }
                }
            );


            directModeButton.addEventListener(
                "click",
                () => {
                    setModalMode(
                        "direct"
                    );

                    searchResults.innerHTML =
                        "";

                    userSearch.value =
                        "";
                }
            );


            groupModeButton.addEventListener(
                "click",
                () => {
                    setModalMode(
                        "group"
                    );

                    searchResults.innerHTML =
                        "";

                    userSearch.value =
                        "";
                }
            );


            userSearch.addEventListener(
                "input",
                () => {
                    clearTimeout(
                        searchTimer
                    );

                    searchTimer =
                        setTimeout(
                            searchUsers,
                            250
                        );
                }
            );


            groupName.addEventListener(
                "input",
                () => {
                    createGroupButton.disabled =
                        !groupName.value.trim() ||
                        selectedGroupUsers.size <
                            1;
                }
            );


            createGroupButton.addEventListener(
                "click",
                createGroup
            );


            conversationSearch.addEventListener(
                "input",
                renderConversationList
            );


            messageForm.addEventListener(
                "submit",
                event => {
                    event.preventDefault();

                    sendMessage();
                }
            );


            messageInput.addEventListener(
                "keydown",
                event => {
                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {
                        event.preventDefault();

                        sendMessage();
                    }
                }
            );


            leaveButton.addEventListener(
                "click",
                leaveConversation
            );


            document.addEventListener(
                "keydown",
                event => {
                    if (
                        event.key === "Escape" &&
                        modalBackdrop.classList.contains(
                            "visible"
                        )
                    ) {
                        closeModal();
                    }
                }
            );


            /* =====================================================
               INITIALIZE
            ===================================================== */

            async function initializeChat() {
                if (!db) {
                    console.error(
                        "[Chat] Supabase client is missing."
                    );

                    return;
                }


                let session = null;


                for (
                    let attempt = 0;
                    attempt < 20;
                    attempt++
                ) {
                    const {
                        data,
                        error
                    } = await db.auth.getSession();


                    if (error) {
                        console.error(
                            "[Chat] Session error:",
                            error
                        );
                    }


                    session =
                        data?.session ||
                        null;


                    if (session) {
                        break;
                    }


                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                100
                            )
                    );
                }


                if (!session) {
                    window.location.href =
                        "/login/";

                    return;
                }


                currentSession =
                    session;

                currentUser =
                    session.user;


                if (
                    typeof window.initNavbar ===
                    "function"
                ) {
                    await window.initNavbar();
                }


                await loadConversations();

                setupRealtime();


                db.auth.onAuthStateChange(
                    async (
                        event,
                        newSession
                    ) => {
                        if (
                            event ===
                            "SIGNED_OUT"
                        ) {
                            window.location.href =
                                "/login/";

                            return;
                        }


                        if (
                            newSession &&
                            newSession.user
                        ) {
                            currentSession =
                                newSession;

                            currentUser =
                                newSession.user;
                        }
                    }
                );
            }


            initializeChat();

        })();
    </script>

</body>
