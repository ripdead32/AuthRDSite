<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat - Rip_Dead Account</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/global.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #09090d;
            color: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================================================
           RIP_DEAD NAVBAR
        ========================================================= */

        .rd-navbar {
            height: 58px;
            min-height: 58px;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            background: #0b0b10;
            border-bottom: 1px solid #252530;

            position: relative;
            z-index: 1000;
        }

        .rd-navbar-left,
        .rd-navbar-right {
            display: flex;
            align-items: center;
        }

        .rd-navbar-left {
            gap: 28px;
        }

        .rd-navbar-right {
            gap: 8px;
        }

        .rd-brand {
            color: #ffffff !important;
            text-decoration: none !important;

            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;

            white-space: nowrap;
        }

        .rd-brand:hover {
            color: #a78bfa !important;
        }

        .rd-nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .rd-navbar a {
            text-decoration: none !important;
        }

        .rd-nav-links a,
        .rd-account,
        .rd-navbar-right > .guest-only {
            color: #9696a5 !important;

            padding: 8px 11px;
            border-radius: 7px;

            font-size: 13px;
            font-weight: 500;

            transition:
                color 0.15s ease,
                background 0.15s ease;
        }

        .rd-nav-links a:hover,
        .rd-account:hover,
        .rd-navbar-right > .guest-only:hover {
            color: #ffffff !important;
            background: #181820;
        }

        .rd-nav-links a.active {
            color: #ffffff !important;
            background: #241b35;
        }

        .rd-signup {
            background: #7c3aed !important;
            color: #ffffff !important;
            padding: 8px 13px !important;
        }

        .rd-signup:hover {
            background: #8b5cf6 !important;
        }

        .rd-logout {
            border: 1px solid #30303b;
            background: #15151c;
            color: #aaaab6;

            padding: 8px 12px;
            border-radius: 7px;

            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            transition:
                color 0.15s ease,
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .rd-logout:hover {
            color: #ffffff;
            background: #1e1e27;
            border-color: #454552;
        }

        .rd-navbar .auth-only[hidden],
        .rd-navbar .guest-only[hidden] {
            display: none !important;
        }

        /* =========================================================
           CHAT PAGE
        ========================================================= */

        .chat-page {
            height: calc(100vh - 58px);
            width: 100%;

            display: flex;
            overflow: hidden;
        }

        /* =========================================================
           SIDEBAR
        ========================================================= */

        .chat-sidebar {
            width: 320px;
            min-width: 320px;

            background: #101017;
            border-right: 1px solid #24242f;

            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 18px;

            border-bottom: 1px solid #24242f;
        }

        .sidebar-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 14px;
        }

        .sidebar-title {
            margin: 0;

            font-size: 21px;
            font-weight: 700;
        }

        .new-chat-button {
            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 9px;

            background: #7c3aed;
            color: white;

            font-size: 24px;
            line-height: 1;

            cursor: pointer;
        }

        .new-chat-button:hover {
            background: #8b5cf6;
        }

        .conversation-search {
            width: 100%;

            padding: 11px 13px;

            border: 1px solid #30303c;
            border-radius: 9px;

            outline: none;

            background: #17171f;
            color: white;

            font-size: 14px;
        }

        .conversation-search:focus {
            border-color: #7c3aed;
        }

        .conversation-list {
            flex: 1;

            overflow-y: auto;

            padding: 8px;
        }

        .conversation {
            display: flex;
            align-items: center;

            gap: 11px;

            padding: 11px;

            border-radius: 9px;

            cursor: pointer;

            margin-bottom: 3px;
        }

        .conversation:hover {
            background: #1b1b25;
        }

        .conversation.active {
            background: #29203b;
        }

        .conversation-info {
            min-width: 0;
            flex: 1;
        }

        .conversation-name {
            display: flex;
            align-items: center;

            gap: 5px;

            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-preview {
            color: #888894;

            font-size: 13px;

            margin-top: 4px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-time {
            color: #666673;

            font-size: 11px;

            align-self: flex-start;

            white-space: nowrap;
        }

        .empty-conversations {
            text-align: center;

            color: #777783;

            padding: 40px 20px;

            line-height: 1.5;
        }

        /* =========================================================
           AVATARS
        ========================================================= */

        .avatar {
            width: 44px;
            height: 44px;

            min-width: 44px;

            border-radius: 50%;

            overflow: hidden;

            background: #292933;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #dddddd;

            font-weight: bold;

            user-select: none;
        }

        .avatar.small {
            width: 38px;
            height: 38px;
            min-width: 38px;

            font-size: 13px;
        }

        .avatar.large {
            width: 48px;
            height: 48px;
            min-width: 48px;
        }

        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        /* =========================================================
           CHAT MAIN
        ========================================================= */

        .chat-main {
            flex: 1;

            min-width: 0;

            display: flex;
            flex-direction: column;

            background: #0c0c11;
        }

        .chat-header {
            height: 70px;
            min-height: 70px;

            border-bottom: 1px solid #24242f;

            background: #101017;

            display: flex;
            align-items: center;

            padding: 10px 18px;

            gap: 12px;
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-name {
            font-size: 17px;
            font-weight: 700;
        }

        .chat-header-subtitle {
            color: #777783;

            font-size: 12px;

            margin-top: 3px;
        }

        .leave-button {
            border: 1px solid #4a2630;

            background: #241419;

            color: #ff7b8e;

            padding: 9px 14px;

            border-radius: 8px;

            cursor: pointer;
        }

        .leave-button:hover {
            background: #321923;
        }

        .leave-button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* =========================================================
           MESSAGES
        ========================================================= */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 20px;
        }

        .messages-empty {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #696974;

            text-align: center;
        }

        .message-row {
            display: flex;

            gap: 10px;

            margin-bottom: 17px;
        }

        .message-row.mine {
            flex-direction: row-reverse;
        }

        .message-content-area {
            max-width: min(720px, 75%);
        }

        .message-meta {
            display: flex;
            align-items: center;

            gap: 7px;

            margin-bottom: 4px;

            font-size: 12px;

            color: #777783;
        }

        .message-row.mine .message-meta {
            justify-content: flex-end;
        }

        .message-author {
            color: #aaaab5;
            font-weight: 600;
        }

        .message-time {
            color: #5e5e69;
        }

        .message-bubble {
            background: #191922;

            border: 1px solid #282833;

            border-radius: 12px;

            padding: 10px 13px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            line-height: 1.45;
        }

        .message-row.mine .message-bubble {
            background: #39205e;
            border-color: #54317e;
        }

        .message-actions {
            display: flex;

            gap: 5px;

            margin-top: 4px;

            opacity: 0;

            transition: opacity 0.15s;
        }

        .message-row:hover .message-actions {
            opacity: 1;
        }

        .message-row.mine .message-actions {
            justify-content: flex-end;
        }

        .message-delete {
            border: 0;

            background: transparent;

            color: #777783;

            cursor: pointer;

            font-size: 11px;
        }

        .message-delete:hover {
            color: #ff7185;
        }

        .verified {
            color: #8b5cf6;
            font-size: 12px;
        }

        /* =========================================================
           MESSAGE FORM
        ========================================================= */

        .message-form {
            padding: 13px;

            border-top: 1px solid #24242f;

            background: #101017;

            display: flex;

            gap: 9px;
        }

        .message-input {
            flex: 1;

            min-width: 0;

            resize: none;

            height: 44px;
            max-height: 130px;

            padding: 12px;

            border: 1px solid #30303c;

            border-radius: 9px;

            background: #17171f;

            color: white;

            outline: none;

            font-family: inherit;
        }

        .message-input:focus {
            border-color: #7c3aed;
        }

        .send-button {
            border: 0;

            border-radius: 9px;

            padding: 0 19px;

            background: #7c3aed;

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        .send-button:hover {
            background: #8b5cf6;
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* =========================================================
           MODAL
        ========================================================= */

        .modal-backdrop {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.72);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 9999;
        }

        .modal-backdrop.visible {
            display: flex;
        }

        .chat-modal {
            width: min(520px, calc(100vw - 30px));

            max-height: min(
                720px,
                calc(100vh - 30px)
            );

            overflow: hidden;

            display: flex;
            flex-direction: column;

            background: #111118;

            border: 1px solid #30303c;

            border-radius: 14px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55);
        }

        .modal-header {
            padding: 17px;

            border-bottom: 1px solid #292934;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            margin: 0;

            font-size: 19px;
        }

        .modal-close {
            border: 0;

            background: transparent;

            color: #888894;

            font-size: 22px;

            cursor: pointer;
        }

        .modal-body {
            padding: 17px;

            overflow-y: auto;
        }

        .chat-mode-buttons {
            display: flex;

            gap: 8px;

            margin-bottom: 13px;
        }

        .mode-button {
            flex: 1;

            padding: 10px;

            border-radius: 8px;

            border: 1px solid #30303c;

            background: #181820;

            color: #aaaab5;

            cursor: pointer;
        }

        .mode-button.active {
            border-color: #7c3aed;

            background: #291d3b;

            color: white;
        }

        .group-name {
            display: none;

            width: 100%;

            margin-bottom: 10px;

            padding: 11px;

            border: 1px solid #30303c;

            border-radius: 8px;

            background: #17171f;

            color: white;

            outline: none;
        }

        .group-name.visible {
            display: block;
        }

        .user-search {
            width: 100%;

            padding: 11px;

            border: 1px solid #30303c;

            border-radius: 8px;

            background: #17171f;

            color: white;

            outline: none;
        }

        .search-results {
            margin-top: 10px;

            max-height: 300px;

            overflow-y: auto;
        }

        .search-result {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 10px;

            border-radius: 9px;

            cursor: pointer;
        }

        .search-result:hover {
            background: #1c1c25;
        }

        .search-result-info {
            flex: 1;
            min-width: 0;
        }

        .search-result-name {
            font-weight: 600;
        }

        .search-result-username {
            color: #777783;

            font-size: 12px;

            margin-top: 2px;
        }

        .select-indicator {
            width: 20px;
            height: 20px;

            border-radius: 50%;

            border: 1px solid #555563;
        }

        .select-indicator.selected {
            background: #7c3aed;

            border-color: #7c3aed;

            position: relative;
        }

        .select-indicator.selected::after {
            content: "✓";

            position: absolute;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 12px;
        }

        .selected-users {
            display: none;

            flex-wrap: wrap;

            gap: 6px;

            margin: 10px 0;
        }

        .selected-users.visible {
            display: flex;
        }

        .selected-user {
            background: #29203b;

            color: #ddd;

            padding: 5px 8px;

            border-radius: 6px;

            font-size: 12px;
        }

        .modal-footer {
            padding: 13px 17px;

            border-top: 1px solid #292934;

            display: flex;

            justify-content: flex-end;

            gap: 8px;
        }

        .secondary-button,
        .primary-button {
            padding: 10px 15px;

            border-radius: 8px;

            cursor: pointer;
        }

        .secondary-button {
            border: 1px solid #30303c;

            background: #181820;

            color: #ccc;
        }

        .primary-button {
            border: 0;

            background: #7c3aed;

            color: white;
        }

        .primary-button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .modal-status {
            color: #ff7185;

            font-size: 13px;

            margin-top: 9px;

            min-height: 18px;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 900px) {
            .rd-navbar {
                padding: 0 12px;
            }

            .rd-navbar-left {
                gap: 12px;
            }

            .rd-nav-links {
                gap: 1px;
            }

            .rd-nav-links a,
            .rd-account,
            .rd-navbar-right > .guest-only {
                padding: 7px 8px;
                font-size: 12px;
            }
        }

        @media (max-width: 750px) {
            .chat-sidebar {
                width: 260px;
                min-width: 260px;
            }

            .message-content-area {
                max-width: 82%;
            }

            .leave-button {
                font-size: 12px;

                padding: 8px 9px;
            }
        }

        @media (max-width: 700px) {
            .rd-nav-links a:nth-child(4),
            .rd-nav-links a:nth-child(5) {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .chat-sidebar {
                width: 100%;
                min-width: 100%;
            }

            .chat-main {
                display: none;
            }

            .chat-page.mobile-chat-open
                .chat-sidebar {
                display: none;
            }

            .chat-page.mobile-chat-open
                .chat-main {
                display: flex;
                width: 100%;
            }

            .rd-navbar-left {
                gap: 8px;
            }

            .rd-nav-links {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         NAVBAR
    ========================================================= -->

    <nav class="rd-navbar">

        <div class="rd-navbar-left">

            <a
                href="/"
                class="rd-brand"
            >
                Rip_Dead
            </a>

            <div class="rd-nav-links">

                <a href="/">
                    Home
                </a>

                <a
                    href="/search/"
                    class="auth-only"
                >
                    Search
                </a>

                <a
                    href="/friends/"
                    class="auth-only"
                >
                    Friends
                </a>

                <a
                    href="/chat/"
                    class="auth-only active"
                >
                    Chat
                </a>

                <a
                    href="/apps/"
                    class="auth-only"
                >
                    Authorized Apps
                </a>

                <a
                    href="/settings/"
                    class="auth-only"
                >
                    Settings
                </a>

            </div>

        </div>


        <div class="rd-navbar-right">

            <a
                href="/account/"
                class="auth-only rd-account"
                id="navbar-user"
            >
                Account
            </a>

            <a
                href="/login/"
                class="guest-only"
            >
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only rd-signup"
            >
                Create Account
            </a>

            <button
                id="navbar-logout"
                class="auth-only rd-logout"
                type="button"
            >
                Log Out
            </button>

        </div>

    </nav>


    <!-- =========================================================
         CHAT PAGE
    ========================================================= -->

    <main
        class="chat-page"
        id="chat-page"
    >

        <!-- SIDEBAR -->

        <aside class="chat-sidebar">

            <div class="sidebar-header">

                <div class="sidebar-title-row">

                    <h1 class="sidebar-title">
                        Messages
                    </h1>

                    <button
                        class="new-chat-button"
                        id="new-chat-button"
                        type="button"
                        title="New chat"
                    >
                        +
                    </button>

                </div>

                <input
                    class="conversation-search"
                    id="conversation-search"
                    type="search"
                    placeholder="Search conversations..."
                    autocomplete="off"
                >

            </div>


            <div
                class="conversation-list"
                id="conversation-list"
            ></div>

        </aside>


        <!-- MAIN CHAT -->

        <section class="chat-main">

            <header class="chat-header">

                <div
                    class="avatar large"
                    id="header-avatar"
                >
                    ?
                </div>

                <div class="chat-header-info">

                    <div
                        class="chat-header-name"
                        id="chat-header-name"
                    >
                        Select a conversation
                    </div>

                    <div
                        class="chat-header-subtitle"
                        id="chat-header-subtitle"
                    >
                        Choose a conversation to start chatting
                    </div>

                </div>

                <button
                    class="leave-button"
                    id="leave-button"
                    type="button"
                    hidden
                >
                    Leave
                </button>

            </header>


            <div
                class="messages"
                id="messages"
            >
                <div class="messages-empty">
                    Select a conversation to start chatting.
                </div>
            </div>


            <form
                class="message-form"
                id="message-form"
                hidden
            >

                <textarea
                    class="message-input"
                    id="message-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                    maxlength="4000"
                ></textarea>

                <button
                    class="send-button"
                    id="send-button"
                    type="submit"
                >
                    Send
                </button>

            </form>

        </section>

    </main>


    <!-- =========================================================
         NEW CHAT MODAL
    ========================================================= -->

    <div
        class="modal-backdrop"
        id="modal-backdrop"
    >

        <div
            class="chat-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >

            <div class="modal-header">

                <h2 id="modal-title">
                    New Chat
                </h2>

                <button
                    class="modal-close"
                    id="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div class="modal-body">

                <div class="chat-mode-buttons">

                    <button
                        class="mode-button active"
                        id="direct-mode-button"
                        type="button"
                    >
                        Direct Message
                    </button>

                    <button
                        class="mode-button"
                        id="group-mode-button"
                        type="button"
                    >
                        Group Chat
                    </button>

                </div>


                <input
                    class="group-name"
                    id="group-name"
                    type="text"
                    maxlength="80"
                    placeholder="Group name..."
                    autocomplete="off"
                >


                <div
                    class="selected-users"
                    id="selected-users"
                ></div>


                <input
                    class="user-search"
                    id="user-search"
                    type="search"
                    placeholder="Search users..."
                    autocomplete="off"
                >


                <div
                    class="search-results"
                    id="search-results"
                ></div>


                <div
                    class="modal-status"
                    id="modal-status"
                ></div>

            </div>


            <div class="modal-footer">

                <button
                    class="secondary-button"
                    id="modal-cancel"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    class="primary-button"
                    id="create-group-button"
                    type="button"
                    hidden
                    disabled
                >
                    Create Group
                </button>

            </div>

        </div>

    </div>


    <script>
        (() => {
            "use strict";

            const db = window.supabaseClient;

            let currentSession = null;
            let currentUser = null;

            let conversations = [];

            let conversationMembers =
                new Map();

            let profiles =
                new Map();

            let latestMessages =
                new Map();

            let currentConversationId = null;

            let realtimeMessagesChannel =
                null;

            let realtimeConversationsChannel =
                null;

            let modalMode = "direct";

            let selectedGroupUsers =
                new Map();

            let searchTimer = null;

            const chatPage =
                document.getElementById(
                    "chat-page"
                );

            const conversationList =
                document.getElementById(
                    "conversation-list"
                );

            const conversationSearch =
                document.getElementById(
                    "conversation-search"
                );

            const messagesElement =
                document.getElementById(
                    "messages"
                );

            const messageForm =
                document.getElementById(
                    "message-form"
                );

            const messageInput =
                document.getElementById(
                    "message-input"
                );

            const sendButton =
                document.getElementById(
                    "send-button"
                );

            const leaveButton =
                document.getElementById(
                    "leave-button"
                );

            const headerAvatar =
