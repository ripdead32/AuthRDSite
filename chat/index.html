<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat - Rip_Dead Account</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --rd-purple: #8b5cf6;
            --rd-purple-dark: #6d28d9;
            --rd-purple-light: #a78bfa;

            --bg: #08080d;
            --panel: #101017;
            --panel-2: #15151e;
            --panel-3: #1b1b26;

            --border: rgba(255, 255, 255, 0.08);

            --text: #f4f4f5;
            --muted: #9696a5;

            --danger: #ef4444;
            --success: #22c55e;

            --navbar-height: 54px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .chat-page {
            width: 100%;
            height: calc(100vh - var(--navbar-height));
            display: flex;
            overflow: hidden;
            background: var(--bg);
        }

        /* -------------------------------------------------- */
        /* Left rail                                            */
        /* -------------------------------------------------- */

        .server-rail {
            width: 72px;
            min-width: 72px;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 12px 0;

            background: #09090e;
            border-right: 1px solid var(--border);
        }

        .server-icon {
            width: 46px;
            height: 46px;

            border: 0;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            background:
                linear-gradient(
                    135deg,
                    var(--rd-purple),
                    #4c1d95
                );

            font-size: 17px;
            font-weight: 800;

            box-shadow:
                0 8px 25px rgba(139, 92, 246, 0.18);
        }

        /* -------------------------------------------------- */
        /* Conversation sidebar                                */
        /* -------------------------------------------------- */

        .conversation-sidebar {
            width: 280px;
            min-width: 280px;

            display: flex;
            flex-direction: column;

            background: var(--panel);
            border-right: 1px solid var(--border);
        }

        .sidebar-header {
            height: 64px;
            padding: 0 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 17px;
            font-weight: 700;
        }

        .new-chat-button {
            width: 34px;
            height: 34px;

            border: 0;
            border-radius: 9px;

            color: white;
            background: var(--rd-purple);

            font-size: 21px;
            line-height: 1;
        }

        .new-chat-button:hover {
            background: var(--rd-purple-dark);
        }

        .conversation-search {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .search-box {
            width: 100%;
            height: 38px;

            border: 1px solid var(--border);
            border-radius: 9px;

            outline: none;

            padding: 0 12px;

            color: var(--text);
            background: var(--panel-2);
        }

        .search-box:focus {
            border-color: var(--rd-purple);
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conversation-item {
            width: 100%;
            min-height: 62px;

            display: flex;
            align-items: center;
            gap: 11px;

            padding: 8px 10px;

            border: 0;
            border-radius: 10px;

            color: var(--text);
            background: transparent;

            text-align: left;
        }

        .conversation-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .conversation-item.active {
            background: rgba(139, 92, 246, 0.17);
        }

        .conversation-info {
            min-width: 0;
            flex: 1;
        }

        .conversation-name {
            font-size: 14px;
            font-weight: 650;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-preview {
            margin-top: 3px;

            color: var(--muted);
            font-size: 12px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-list {
            padding: 30px 15px;

            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        /* -------------------------------------------------- */
        /* Avatar                                               */
        /* -------------------------------------------------- */

        .avatar {
            width: 42px;
            height: 42px;
            min-width: 42px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: white;
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4c1d95
                );

            font-size: 15px;
            font-weight: 700;
        }

        .avatar.small {
            width: 34px;
            height: 34px;
            min-width: 34px;

            font-size: 12px;
        }

        .avatar.large {
            width: 48px;
            height: 48px;
            min-width: 48px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .group-avatar {
            background:
                linear-gradient(
                    135deg,
                    #27272a,
                    #18181b
                );

            font-size: 18px;
        }

        /* -------------------------------------------------- */
        /* Main chat                                            */
        /* -------------------------------------------------- */

        .chat-main {
            min-width: 0;
            flex: 1;

            display: flex;
            flex-direction: column;

            background: var(--bg);
        }

        .chat-header {
            height: 64px;
            min-height: 64px;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 0 18px;

            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .chat-header-info {
            min-width: 0;
        }

        .chat-header-name {
            font-size: 16px;
            font-weight: 700;
        }

        .chat-header-subtitle {
            margin-top: 2px;

            color: var(--muted);
            font-size: 12px;
        }

        .chat-header-actions {
            margin-left: auto;

            display: flex;
            gap: 7px;
        }

        .header-button {
            width: 34px;
            height: 34px;

            border: 1px solid var(--border);
            border-radius: 8px;

            color: var(--muted);
            background: var(--panel-2);
        }

        .header-button:hover {
            color: white;
            background: var(--panel-3);
        }

        /* -------------------------------------------------- */
        /* Messages                                             */
        /* -------------------------------------------------- */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 22px 22px 10px;
        }

        .welcome {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--muted);
            text-align: center;
        }

        .welcome-inner {
            max-width: 420px;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 16px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--rd-purple),
                    #4c1d95
                );

            font-weight: 800;
            font-size: 20px;
        }

        .welcome h2 {
            margin: 0 0 7px;
            color: var(--text);
        }

        .welcome p {
            margin: 0;
            font-size: 14px;
        }

        .message-row {
            display: flex;
            gap: 11px;

            margin-bottom: 17px;
        }

        .message-content {
            min-width: 0;
            flex: 1;
        }

        .message-meta {
            display: flex;
            align-items: baseline;
            gap: 8px;

            margin-bottom: 3px;
        }

        .message-author {
            font-size: 14px;
            font-weight: 700;
        }

        .verified {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 15px;
            height: 15px;

            border-radius: 50%;

            color: white;
            background: var(--rd-purple);

            font-size: 9px;
            font-weight: 900;
        }

        .message-time {
            color: var(--muted);
            font-size: 11px;
        }

        .message-text {
            color: #dedee5;
            font-size: 14px;
            line-height: 1.55;

            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-row.own .message-text {
            color: #f2f2f7;
        }

        .message-actions {
            margin-top: 5px;

            display: flex;
            gap: 6px;

            opacity: 0;
            transition: opacity 0.12s ease;
        }

        .message-row:hover .message-actions {
            opacity: 1;
        }

        .message-action {
            border: 0;
            padding: 3px 7px;

            border-radius: 5px;

            color: var(--muted);
            background: transparent;

            font-size: 11px;
        }

        .message-action:hover {
            color: white;
            background: var(--panel-3);
        }

        .message-action.delete:hover {
            color: white;
            background: var(--danger);
        }

        /* -------------------------------------------------- */
        /* Composer                                             */
        /* -------------------------------------------------- */

        .composer-area {
            padding: 12px 18px 18px;
        }

        .composer {
            min-height: 48px;

            display: flex;
            align-items: flex-end;
            gap: 8px;

            padding: 7px 8px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--panel);

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .composer:focus-within {
            border-color: rgba(139, 92, 246, 0.6);

            box-shadow:
                0 0 0 3px rgba(139, 92, 246, 0.08);
        }

        .composer textarea {
            flex: 1;

            min-height: 32px;
            max-height: 150px;

            resize: none;

            border: 0;
            outline: none;

            padding: 7px 6px;

            color: var(--text);
            background: transparent;

            font-size: 14px;
            line-height: 1.4;
        }

        .composer textarea::placeholder {
            color: #6f6f7d;
        }

        .send-button {
            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 9px;

            color: white;
            background: var(--rd-purple);

            font-size: 16px;
        }

        .send-button:hover {
            background: var(--rd-purple-dark);
        }

        .send-button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        /* -------------------------------------------------- */
        /* Modal                                                */
        /* -------------------------------------------------- */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(8px);
        }

        .modal-backdrop.hidden {
            display: none;
        }

        .modal {
            width: min(520px, 100%);
            max-height: 85vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border: 1px solid var(--border);
            border-radius: 16px;

            background: var(--panel);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 17px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;

            border: 0;
            border-radius: 8px;

            color: var(--muted);
            background: transparent;

            font-size: 20px;
        }

        .modal-close:hover {
            color: white;
            background: var(--panel-3);
        }

        .modal-body {
            padding: 18px;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 14px 18px;

            display: flex;
            justify-content: flex-end;
            gap: 8px;

            border-top: 1px solid var(--border);
        }

        .modal-input {
            width: 100%;
            height: 42px;

            margin-bottom: 12px;

            padding: 0 12px;

            border: 1px solid var(--border);
            border-radius: 9px;

            outline: none;

            color: var(--text);
            background: var(--panel-2);
        }

        .modal-input:focus {
            border-color: var(--rd-purple);
        }

        .modal-button {
            min-height: 38px;

            padding: 0 15px;

            border: 0;
            border-radius: 8px;

            color: white;
            background: var(--rd-purple);
        }

        .modal-button.secondary {
            color: var(--text);
            background: var(--panel-3);
        }

        .modal-button.danger {
            background: var(--danger);
        }

        .user-results {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .user-result {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 9px;

            border: 1px solid transparent;
            border-radius: 9px;

            color: var(--text);
            background: transparent;

            text-align: left;
        }

        .user-result:hover {
            background: var(--panel-2);
        }

        .user-result.selected {
            border-color: rgba(139, 92, 246, 0.45);
            background: rgba(139, 92, 246, 0.12);
        }

        .user-result-info {
            min-width: 0;
            flex: 1;
        }

        .user-result-name {
            font-size: 13px;
            font-weight: 650;
        }

        .user-result-username {
            margin-top: 2px;

            color: var(--muted);
            font-size: 11px;
        }

        .selected-check {
            color: var(--rd-purple-light);
            font-size: 18px;
        }

        .selected-users {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;

            margin-bottom: 12px;
        }

        .selected-user {
            padding: 5px 8px;

            border-radius: 7px;

            color: #ddd6fe;
            background: rgba(139, 92, 246, 0.16);

            font-size: 12px;
        }

        .status-message {
            padding: 9px 11px;

            border-radius: 8px;

            color: var(--muted);
            background: var(--panel-2);

            font-size: 12px;
        }

        .status-message.error {
            color: #fecaca;
            background: rgba(239, 68, 68, 0.12);
        }

        /* -------------------------------------------------- */
        /* Scrollbars                                           */
        /* -------------------------------------------------- */

        * {
            scrollbar-width: thin;
            scrollbar-color: #30303a transparent;
        }

        *::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        *::-webkit-scrollbar-track {
            background: transparent;
        }

        *::-webkit-scrollbar-thumb {
            border-radius: 10px;
            background: #30303a;
        }

        /* -------------------------------------------------- */
        /* Mobile                                               */
        /* -------------------------------------------------- */

        @media (max-width: 800px) {
            .server-rail {
                display: none;
            }

            .conversation-sidebar {
                width: 240px;
                min-width: 240px;
            }
        }

        @media (max-width: 600px) {
            .conversation-sidebar {
                width: 100%;
                min-width: 100%;
            }

            .chat-main {
                display: none;
            }

            .chat-page.mobile-chat-open .conversation-sidebar {
                display: none;
            }

            .chat-page.mobile-chat-open .chat-main {
                display: flex;
            }

            .mobile-back {
                display: block !important;
            }
        }

        .mobile-back {
            display: none;

            width: 32px;
            height: 32px;

            border: 0;
            border-radius: 8px;

            color: var(--muted);
            background: transparent;
        }

        .mobile-back:hover {
            color: white;
            background: var(--panel-3);
        }
    </style>
</head>

<body>

    <!-- Existing Rip_Dead Account navbar -->
    <nav id="navbar"></nav>

    <main class="chat-page" id="chat-page">

        <!-- Server / app rail -->
        <aside class="server-rail">
            <div class="server-icon">
                RD
            </div>
        </aside>

        <!-- Conversations -->
        <aside class="conversation-sidebar">

            <div class="sidebar-header">
                <div class="sidebar-title">
                    Messages
                </div>

                <button
                    class="new-chat-button"
                    id="new-chat-button"
                    title="New conversation"
                    type="button"
                >
                    +
                </button>
            </div>

            <div class="conversation-search">
                <input
                    id="conversation-search"
                    class="search-box"
                    type="text"
                    placeholder="Search conversations..."
                    autocomplete="off"
                >
            </div>

            <div
                class="conversation-list"
                id="conversation-list"
            >
                <div class="empty-list">
                    Loading conversations...
                </div>
            </div>

        </aside>

        <!-- Main chat -->
        <section class="chat-main">

            <header class="chat-header">

                <button
                    class="mobile-back"
                    id="mobile-back"
                    type="button"
                    title="Back"
                >
                    ←
                </button>

                <div
                    id="chat-header-avatar"
                    class="avatar large"
                    style="display:none"
                ></div>

                <div class="chat-header-info">
                    <div
                        class="chat-header-name"
                        id="chat-header-name"
                    >
                        Select a conversation
                    </div>

                    <div
                        class="chat-header-subtitle"
                        id="chat-header-subtitle"
                    >
                        Your messages will appear here.
                    </div>
                </div>

                <div class="chat-header-actions">

                    <button
                        class="header-button"
                        id="leave-button"
                        type="button"
                        title="Leave conversation"
                        style="display:none"
                    >
                        ↪
                    </button>

                </div>

            </header>

            <div
                class="messages"
                id="messages"
            >
                <div class="welcome">
                    <div class="welcome-inner">

                        <div class="welcome-logo">
                            RD
                        </div>

                        <h2>
                            Rip_Dead Messaging
                        </h2>

                        <p>
                            Select a conversation or start a new one.
                        </p>

                    </div>
                </div>
            </div>

            <div class="composer-area">

                <form
                    class="composer"
                    id="composer"
                >

                    <textarea
                        id="message-input"
                        placeholder="Select a conversation..."
                        rows="1"
                        disabled
                    ></textarea>

                    <button
                        class="send-button"
                        id="send-button"
                        type="submit"
                        disabled
                        title="Send"
                    >
                        ➤
                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- New conversation modal -->
    <div
        class="modal-backdrop hidden"
        id="new-chat-modal"
    >
        <div class="modal">

            <div class="modal-header">
                <div class="modal-title">
                    New Conversation
                </div>

                <button
                    class="modal-close"
                    id="new-chat-close"
                    type="button"
                >
                    ×
                </button>
            </div>

            <div class="modal-body">

                <input
                    class="modal-input"
                    id="user-search"
                    type="text"
                    placeholder="Search users..."
                    autocomplete="off"
                >

                <div
                    class="user-results"
                    id="user-results"
                >
                    <div class="empty-list">
                        Search for a user to start chatting.
                    </div>
                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="modal-button secondary"
                    id="new-chat-cancel"
                    type="button"
                >
                    Cancel
                </button>

            </div>

        </div>
    </div>

    <!-- Group modal -->
    <div
        class="modal-backdrop hidden"
        id="group-modal"
    >
        <div class="modal">

            <div class="modal-header">
                <div class="modal-title">
                    Create Group
                </div>

                <button
                    class="modal-close"
                    id="group-close"
                    type="button"
                >
                    ×
                </button>
            </div>

            <div class="modal-body">

                <input
                    class="modal-input"
                    id="group-name"
                    type="text"
                    placeholder="Group name"
                    maxlength="80"
                >

                <div
                    class="selected-users"
                    id="selected-users"
                ></div>

                <input
                    class="modal-input"
                    id="group-user-search"
                    type="text"
                    placeholder="Add people..."
                    autocomplete="off"
                >

                <div
                    class="user-results"
                    id="group-user-results"
                >
                    <div class="empty-list">
                        Search for people to add.
                    </div>
                </div>

                <div
                    class="status-message"
                    id="group-status"
                    style="display:none"
                ></div>

            </div>

            <div class="modal-footer">

                <button
                    class="modal-button secondary"
                    id="group-cancel"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    class="modal-button"
                    id="group-create"
                    type="button"
                >
                    Create Group
                </button>

            </div>

        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/global.js"></script>

    <script>
        "use strict";

        const db = window.supabaseClient;

        let currentSession = null;
        let currentConversationId = null;

        let conversations = [];
        let conversationMembers = {};
        let profiles = {};

        let messageRealtimeChannel = null;
        let conversationRealtimeChannel = null;

        let userSearchTimer = null;
        let groupSearchTimer = null;

        let selectedGroupUsers = [];

        /*
         * --------------------------------------------------
         * Helpers
         * --------------------------------------------------
         */

        function $(id) {
            return document.getElementById(id);
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeIlike(value) {
            return String(value ?? "")
                .replace(/\\/g, "\\\\")
                .replace(/%/g, "\\%")
                .replace(/_/g, "\\_");
        }

        function getDisplayName(profile) {
            return (
                profile?.display_name ||
                profile?.username ||
                "Unknown User"
            );
        }

        function getInitial(profile) {
            const name = getDisplayName(profile).trim();

            return (
                name.charAt(0).toUpperCase() ||
                "?"
            );
        }

        function createLocalAvatar(
            profile,
            className = "avatar"
        ) {
            const element =
                document.createElement("div");

            element.className = className;

            if (
                profile &&
                profile.avatar_url
            ) {
                const image =
                    document.createElement("img");

                image.src =
                    profile.avatar_url;

                image.alt =
                    getDisplayName(profile);

                image.loading = "lazy";

                image.onerror = () => {
                    image.remove();

                    element.textContent =
                        getInitial(profile);
                };

                element.appendChild(image);
            } else {
                element.textContent =
                    getInitial(profile);
            }

            return element;
        }

        function formatMessageTime(dateString) {
            const date =
                new Date(dateString);

            if (Number.isNaN(date.getTime())) {
                return "";
            }

            return date.toLocaleString(
                [],
                {
                    dateStyle: "short",
                    timeStyle: "short"
                }
            );
        }

        function formatConversationTime(dateString) {
            if (!dateString) {
                return "";
            }

            const date =
                new Date(dateString);

            if (Number.isNaN(date.getTime())) {
                return "";
            }

            const now = new Date();

            if (
                date.toDateString() ===
                now.toDateString()
            ) {
                return date.toLocaleTimeString(
                    [],
                    {
                        hour: "numeric",
                        minute: "2-digit"
                    }
                );
            }

            return date.toLocaleDateString(
                [],
                {
                    month: "short",
                    day: "numeric"
                }
            );
        }

        /*
         * Client-side numeric IDs.
         *
         * The supplied schema does not expose a default
         * for the bigint IDs, so we generate collision-resistant
         * positive bigint-compatible IDs here.
         */
        function generateNumericId() {
            const time =
                Date.now()
                    .toString();

            const random =
                Math.floor(
                    Math.random() * 1000
                )
                    .toString()
                    .padStart(3, "0");

            return Number(
                time + random
            );
        }

        function showModal(id) {
            $(id).classList.remove(
                "hidden"
            );
        }

        function hideModal(id) {
            $(id).classList.add(
                "hidden"
            );
        }

        function showStatus(
            element,
            message,
            error = false
        ) {
            element.textContent =
                message;

            element.style.display =
                "block";

            element.classList.toggle(
                "error",
                error
            );
        }

        /*
         * --------------------------------------------------
         * Authentication
         * --------------------------------------------------
         */

        async function initializeChat() {
            if (!db) {
                showFatalError(
                    "Supabase failed to initialize."
                );

                return;
            }

            let session = null;

            for (
                let attempt = 0;
                attempt < 20;
                attempt++
            ) {
                const {
                    data,
                    error
                } =
                    await db.auth.getSession();

                if (error) {
                    console.error(
                        "[Chat] Session error:",
                        error
                    );
                }

                session =
                    data?.session || null;

                if (session) {
                    break;
                }

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            100
                        )
                );
            }

            if (!session) {
                window.location.href =
                    "/login/";

                return;
            }

            currentSession =
                session;

            if (
                window.initNavbar
            ) {
                await window.initNavbar();
            }

            await loadConversations();

            setupRealtime();

            console.log(
                "[Chat] Initialized."
            );
        }

        function showFatalError(message) {
            $("messages").innerHTML = `
                <div class="welcome">
                    <div class="welcome-inner">
                        <div class="welcome-logo">
                            !
                        </div>
                        <h2>Chat unavailable</h2>
                        <p>${escapeHtml(message)}</p>
                    </div>
                </div>
            `;
        }

        /*
         * --------------------------------------------------
         * Profiles
         * --------------------------------------------------
         */

        async function loadProfiles(ids) {
            const uniqueIds =
                [
                    ...new Set(
                        ids.filter(Boolean)
                    )
                ];

            const missingIds =
                uniqueIds.filter(
                    id => !profiles[id]
                );

            if (
                missingIds.length === 0
            ) {
                return;
            }

            /*
             * We intentionally fetch individually in chunks
             * instead of using PostgREST .in() with an unknown
             * number of IDs.
             */
            for (
                let i = 0;
                i < missingIds.length;
                i += 50
            ) {
                const chunk =
                    missingIds.slice(
                        i,
                        i + 50
                    );

                const {
                    data,
                    error
                } =
                    await db
                        .from("profiles")
                        .select(
                            "id,username,display_name,avatar_url,bio,is_verified"
                        )
                        .in(
                            "id",
                            chunk
                        );

                if (error) {
                    console.error(
                        "[Chat] Profile load error:",
                        error
                    );

                    continue;
                }

                for (
                    const profile of
                    data || []
                ) {
                    profiles[
                        profile.id
                    ] = profile;
                }
            }
        }

        /*
         * --------------------------------------------------
         * Conversations
         * --------------------------------------------------
         */

        async function loadConversations() {
            const {
                data,
                error
            } =
                await db
                    .from("conversations")
                    .select(
                        "id,created_at,name,is_group"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );

            if (error) {
                console.error(
                    "[Chat] Conversation load error:",
                    error
                );

                $("conversation-list").innerHTML = `
                    <div class="empty-list">
                        Failed to load conversations.
                    </div>
                `;

                return;
            }

            conversations =
                data || [];

            const conversationIds =
                conversations.map(
                    conversation =>
                        conversation.id
                );

            conversationMembers = {};

            if (
                conversationIds.length
            ) {
                const {
                    data:
                        members,
                    error:
                        memberError
                } =
                    await db
                        .from(
                            "conversation_members"
                        )
                        .select(
                            "conversation_id,user_id,joined_at"
                        )
                        .in(
                            "conversation_id",
                            conversationIds
                        );

                if (memberError) {
                    console.error(
                        "[Chat] Member load error:",
                        memberError
                    );
                } else {
                    for (
                        const member of
                        members || []
                    ) {
                        if (
                            !conversationMembers[
                                member.conversation_id
                            ]
                        ) {
                            conversationMembers[
                                member.conversation_id
                            ] = [];
                        }

                        conversationMembers[
                            member.conversation_id
                        ].push(member);
                    }
                }
            }

            const userIds = [];

            for (
                const members of
                Object.values(
                    conversationMembers
                )
            ) {
                for (
                    const member of members
                ) {
                    userIds.push(
                        member.user_id
                    );
                }
            }

            await loadProfiles(
                userIds
            );

            await loadConversationPreviews();

            renderConversationList();
        }

        async function loadConversationPreviews() {
            for (
                const conversation of
                conversations
            ) {
                const {
                    data,
                    error
                } =
                    await db
                        .from("messages")
                        .select(
                            "id,content,sender_id,created_at"
                        )
                        .eq(
                            "conversation_id",
                            conversation.id
                        )
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        )
                        .limit(1);

                if (!error) {
                    conversation.lastMessage =
                        data?.[0] || null;
                }
            }
        }

        function getConversationName(
            conversation
        ) {
            if (
                conversation.is_group
            ) {
                return (
                    conversation.name ||
                    "Group Chat"
                );
            }

            const members =
                conversationMembers[
                    conversation.id
                ] || [];

            const otherMember =
                members.find(
                    member =>
                        member.user_id !==
                        currentSession.user.id
                );

            if (!otherMember) {
                return "Conversation";
            }

            const profile =
                profiles[
                    otherMember.user_id
                ];

            return getDisplayName(
                profile
            );
        }

        function getConversationAvatar(
            conversation
        ) {
            if (
                conversation.is_group
            ) {
                const avatar =
                    document.createElement(
                        "div"
                    );

                avatar.className =
                    "avatar group-avatar";

                avatar.textContent =
                    "👥";

                return avatar;
            }

            const members =
                conversationMembers[
                    conversation.id
                ] || [];

            const otherMember =
                members.find(
                    member =>
                        member.user_id !==
                        currentSession.user.id
                );

            if (!otherMember) {
                return createLocalAvatar(
                    null
                );
            }

            return createLocalAvatar(
                profiles[
                    otherMember.user_id
                ]
            );
        }

        function renderConversationList() {
            const list =
                $("conversation-list");

            const search =
                $("conversation-search")
                    .value
                    .trim()
                    .toLowerCase();

            const visible =
                conversations.filter(
                    conversation => {
                        if (!search) {
                            return true;
                        }

                        const name =
                            getConversationName(
                                conversation
                            )
                                .toLowerCase();

                        const preview =
                            conversation
                                .lastMessage
                                ?.content
                                ?.toLowerCase() ||
                            "";

                        return (
                            name.includes(
                                search
                            ) ||
                            preview.includes(
                                search
                            )
                        );
                    }
                );

            if (!visible.length) {
                list.innerHTML = `
                    <div class="empty-list">
                        ${
                            search
                                ? "No conversations found."
                                : "No conversations yet."
                        }
                    </div>
                `;

                return;
            }

            list.innerHTML = "";

            for (
                const conversation of
                visible
            ) {
                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "conversation-item";

                if (
                    String(
                        conversation.id
                    ) ===
                    String(
                        currentConversationId
                    )
                ) {
                    button.classList.add(
                        "active"
                    );
                }

                const avatar =
                    getConversationAvatar(
                        conversation
                    );

                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "conversation-info";

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "conversation-name";

                name.textContent =
                    getConversationName(
                        conversation
                    );

                const preview =
                    document.createElement(
                        "div"
                    );

                preview.className =
                    "conversation-preview";

                preview.textContent =
                    conversation
                        .lastMessage
                        ?.content ||
                    (
                        conversation.is_group
                            ? "Group conversation"
                            : "No messages yet"
                    );

                info.appendChild(
                    name
                );

                info.appendChild(
                    preview
                );

                button.appendChild(
                    avatar
                );

                button.appendChild(
                    info
                );

                button.addEventListener(
                    "click",
                    () =>
                        openConversation(
                            conversation.id
                        )
                );

                list.appendChild(
                    button
                );
            }
        }

        /*
         * --------------------------------------------------
         * Open conversation
         * --------------------------------------------------
         */

        async function openConversation(
            conversationId
        ) {
            const conversation =
                conversations.find(
                    item =>
                        String(
                            item.id
                        ) ===
                        String(
                            conversationId
                        )
                );

            if (!conversation) {
                return;
            }

            currentConversationId =
                conversation.id;

            renderConversationList();

            $("messages").innerHTML = `
                <div class="welcome">
                    <div class="welcome-inner">
                        Loading messages...
                    </div>
                </div>
            `;

            const headerName =
                $("chat-header-name");

            const headerSubtitle =
                $("chat-header-subtitle");

            const headerAvatar =
                $("chat-header-avatar");

            headerName.textContent =
                getConversationName(
                    conversation
                );

            if (
                conversation.is_group
            ) {
                const members =
                    conversationMembers[
                        conversation.id
                    ] || [];

                headerSubtitle.textContent =
                    `${members.length} member${
                        members.length === 1
                            ? ""
                            : "s"
                    }`;

                headerAvatar.style.display =
                    "flex";

                headerAvatar.innerHTML =
                    "";

                headerAvatar.textContent =
                    "👥";
            } else {
                const members =
                    conversationMembers[
                        conversation.id
                    ] || [];

                const other =
                    members.find(
                        member =>
                            member.user_id !==
                            currentSession
                                .user
                                .id
                    );

                const profile =
                    other
                        ? profiles[
                              other.user_id
                          ]
                        : null;

                headerSubtitle.textContent =
                    profile?.username
                        ? `@${profile.username}`
                        : "Direct message";

                headerAvatar.style.display =
                    "flex";

                headerAvatar.innerHTML =
                    "";

                const avatar =
                    createLocalAvatar(
                        profile,
                        "avatar large"
                    );

                headerAvatar.appendChild(
                    avatar.querySelector(
                        "img"
                    )
                        ? avatar.querySelector(
                              "img"
                          ).cloneNode(true)
                        : document.createTextNode(
                              avatar.textContent
                          )
                );
            }

            $("leave-button").style.display =
                "block";

            $("message-input").disabled =
                false;

            $("send-button").disabled =
                false;

            $("message-input").placeholder =
                `Message ${getConversationName(
                    conversation
                )}`;

            await loadMessages(
                conversation.id
            );

            $("chat-page").classList.add(
                "mobile-chat-open"
            );

            $("message-input").focus();
        }

        /*
         * --------------------------------------------------
         * Messages
         * --------------------------------------------------
         */

        async function loadMessages(
            conversationId
        ) {
            const {
                data,
                error
            } =
                await db
                    .from("messages")
                    .select(
                        "id,conversation_id,sender_id,content,created_at"
                    )
                    .eq(
                        "conversation_id",
                        conversationId
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );

            if (error) {
                console.error(
                    "[Chat] Message load error:",
                    error
                );

                $("messages").innerHTML = `
                    <div class="welcome">
                        <div class="welcome-inner">
                            Failed to load messages.
                        </div>
                    </div>
                `;

                return;
            }

            await loadProfiles(
                (data || []).map(
                    message =>
                        message.sender_id
                )
            );

            renderMessages(
                data || []
            );
        }

        function renderMessages(
            messages
        ) {
            const container =
                $("messages");

            container.innerHTML =
                "";

            if (!messages.length) {
                container.innerHTML = `
                    <div class="welcome">
                        <div class="welcome-inner">
                            <div class="welcome-logo">
                                💬
                            </div>

                            <h2>
                                Start the conversation
                            </h2>

                            <p>
                                Send the first message.
                            </p>
                        </div>
                    </div>
                `;

                return;
            }

            for (
                const message of messages
            ) {
                container.appendChild(
                    createMessageElement(
                        message
                    )
                );
            }

            scrollMessagesToBottom();
        }

        function createMessageElement(
            message
        ) {
            const profile =
                profiles[
                    message.sender_id
                ] || null;

            const own =
                message.sender_id ===
                currentSession.user.id;

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "message-row";

            if (own) {
                row.classList.add(
                    "own"
                );
            }

            const avatar =
                createLocalAvatar(
                    profile,
                    "avatar"
                );

            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "message-content";

            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "message-meta";

            const author =
                document.createElement(
                    "span"
                );

            author.className =
                "message-author";

            author.textContent =
                getDisplayName(
                    profile
                );

            meta.appendChild(
                author
            );

            if (
                profile?.is_verified
            ) {
                const verified =
                    document.createElement(
                        "span"
                    );

                verified.className =
                    "verified";

                verified.textContent =
                    "✓";

                verified.title =
                    "Verified";

                meta.appendChild(
                    verified
                );
            }

            const time =
                document.createElement(
                    "span"
                );

            time.className =
                "message-time";

            time.textContent =
                formatMessageTime(
                    message.created_at
                );

            meta.appendChild(
                time
            );

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "message-text";

            text.textContent =
                message.content;

            content.appendChild(
                meta
            );

            content.appendChild(
                text
            );

            if (own) {
                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "message-actions";

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.type =
                    "button";

                deleteButton.className =
                    "message-action delete";

                deleteButton.textContent =
                    "Delete";

                deleteButton.addEventListener(
                    "click",
                    () =>
                        deleteMessage(
                            message.id
                        )
                );

                actions.appendChild(
                    deleteButton
                );

                content.appendChild(
                    actions
                );
            }

            row.appendChild(
                avatar
            );

            row.appendChild(
                content
            );

            return row;
        }

        function scrollMessagesToBottom() {
            const container =
                $("messages");

            requestAnimationFrame(
                () => {
                    container.scrollTop =
                        container.scrollHeight;
                }
            );
        }

        async function sendMessage() {
            if (
                !currentConversationId ||
                !currentSession
            ) {
                return;
            }

            const input =
                $("message-input");

            const content =
                input.value.trim();

            if (!content) {
                return;
            }

            input.disabled = true;
            $("send-button").disabled =
                true;

            const messageId =
                generateNumericId();

            const {
                data,
                error
            } =
                await db
                    .from("messages")
                    .insert({
                        id: messageId,
                        conversation_id:
                            currentConversationId,
                        sender_id:
                            currentSession
                                .user
                                .id,
                        content
                    })
                    .select(
                        "id,conversation_id,sender_id,content,created_at"
                    )
                    .single();

            input.disabled = false;
            $("send-button").disabled =
                false;

            if (error) {
                console.error(
                    "[Chat] Send error:",
                    error
                );

                alert(
                    `Could not send message:\n${error.message}`
                );

                return;
            }

            input.value =
                "";

            resizeComposer();

            await loadProfiles([
                data.sender_id
            ]);

            /*
             * Realtime will normally render this.
             * This fallback makes the message appear
             * immediately even if Realtime takes a moment.
             */
            const existing =
                document.querySelector(
                    `[data-message-id="${data.id}"]`
                );

            if (!existing) {
                const welcome =
                    $("messages")
                        .querySelector(
                            ".welcome"
                        );

                if (welcome) {
                    $("messages").innerHTML =
                        "";
                }

                const element =
                    createMessageElement(
                        data
                    );

                element.dataset.messageId =
                    data.id;

                $("messages").appendChild(
                    element
                );

                scrollMessagesToBottom();
            }

            await refreshConversationPreview(
                currentConversationId
            );
        }

        async function deleteMessage(
            messageId
        ) {
            const confirmed =
                window.confirm(
                    "Delete this message?"
                );

            if (!confirmed) {
                return;
            }

            const {
                error
            } =
                await db
                    .from("messages")
                    .delete()
                    .eq(
                        "id",
                        messageId
                    )
                    .eq(
                        "sender_id",
                        currentSession
                            .user
                            .id
                    );

            if (error) {
                console.error(
                    "[Chat] Delete error:",
                    error
                );

                alert(
                    `Could not delete message:\n${error.message}`
                );

                return;
            }

            await loadMessages(
                currentConversationId
            );

            await refreshConversationPreview(
                currentConversationId
            );
        }

        async function refreshConversationPreview(
            conversationId
        ) {
            const conversation =
                conversations.find(
                    item =>
                        String(
                            item.id
                        ) ===
                        String(
                            conversationId
                        )
                );

            if (!conversation) {
                return;
            }

            const {
                data
            } =
                await db
                    .from("messages")
                    .select(
                        "id,content,sender_id,created_at"
                    )
                    .eq(
                        "conversation_id",
                        conversationId
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1);

            conversation.lastMessage =
                data?.[0] || null;

            renderConversationList();
        }

        /*
         * --------------------------------------------------
         * Direct messages
         * --------------------------------------------------
         */

        async function findExistingDirectConversation(
            targetUserId
        ) {
            const {
                data,
                error
            } =
                await db
                    .from("conversation_members")
                    .select(
                        "conversation_id,user_id"
                    )
                    .eq(
                        "user_id",
                        currentSession
                            .user
                            .id
                    );

            if (error) {
                console.error(
                    "[Chat] Own conversation lookup error:",
                    error
                );

                return null;
            }

            const ownConversationIds =
                [
                    ...new Set(
                        (data || []).map(
                            row =>
                                row.conversation_id
                        )
                    )
                ];

            if (
                !ownConversationIds.length
            ) {
                return null;
            }

            const {
                data:
                    targetMemberships,
                error:
                    targetError
            } =
                await db
                    .from(
                        "conversation_members"
                    )
                    .select(
                        "conversation_id,user_id"
                    )
                    .eq(
                        "user_id",
                        targetUserId
                    )
                    .in(
                        "conversation_id",
                        ownConversationIds
                    );

            if (targetError) {
                console.error(
                    "[Chat] Target conversation lookup error:",
                    targetError
                );

                return null;
            }

            const targetIds =
                new Set(
                    (targetMemberships || [])
                        .map(
                            row =>
                                row.conversation_id
                        )
                );

            for (
                const conversation of
                conversations
            ) {
                if (
                    !conversation.is_group &&
                    targetIds.has(
                        conversation.id
                    )
                ) {
                    return conversation;
                }
            }

            return null;
        }

        async function startDirectConversation(
            targetProfile
        ) {
            hideModal(
                "new-chat-modal"
            );

            /*
             * Refresh first so conversations created
             * elsewhere are known to the client.
             */
            await loadConversations();

            const existing =
                await findExistingDirectConversation(
                    targetProfile.id
                );

            if (existing) {
                await openConversation(
                    existing.id
                );

                return;
            }

            const conversationId =
                generateNumericId();

            const {
                data:
                    conversation,
                error
            } =
                await db
                    .from("conversations")
                    .insert({
                        id:
                            conversationId,
                        name: null,
                        is_group: false
                    })
                    .select(
                        "id,created_at,name,is_group"
                    )
                    .single();

            if (error) {
                console.error(
                    "[Chat] Conversation creation error:",
                    error
                );

                alert(
                    `Could not create conversation:\n${error.message}`
                );

                return;
            }

            const {
                error:
                    memberError
            } =
                await db
                    .from(
                        "conversation_members"
                    )
                    .insert([
                        {
                            conversation_id:
                                conversation.id,
                            user_id:
                                currentSession
                                    .user
                                    .id
                        },
                        {
                            conversation_id:
                                conversation.id,
                            user_id:
                                targetProfile.id
                        }
                    ]);

            if (memberError) {
                console.error(
                    "[Chat] Member creation error:",
                    memberError
                );

                /*
                 * Try to clean up the empty conversation.
                 * This may be blocked by RLS, so failure here
                 * is harmless.
                 */
                await db
                    .from("conversations")
                    .delete()
                    .eq(
                        "id",
                        conversation.id
                    );

                alert(
                    `Could not add conversation members:\n${memberError.message}`
                );

                return;
            }

            await loadConversations();

            await openConversation(
                conversation.id
            );
        }

        /*
         * --------------------------------------------------
         * User search
         * --------------------------------------------------
         */

        async function searchUsers(
            input,
            resultContainer,
            selectionMode = false
        ) {
            const query =
                input.value.trim();

            if (!query) {
                resultContainer.innerHTML = `
                    <div class="empty-list">
                        Search for a user...
                    </div>
                `;

                return;
            }

            resultContainer.innerHTML = `
                <div class="empty-list">
                    Searching...
                </div>
            `;

            const pattern =
                `%${escapeIlike(
                    query
                )}%`;

            /*
             * Avoid the problematic .or() expression
             * from the old Chat implementation.
             */
            const [
                usernameResult,
                displayNameResult
            ] =
                await Promise.all([
                    db
                        .from("profiles")
                        .select(
                            "id,username,display_name,avatar_url,bio,is_verified"
                        )
                        .ilike(
                            "username",
                            pattern
                        )
                        .neq(
                            "id",
                            currentSession
                                .user
                                .id
                        )
                        .limit(20),

                    db
                        .from("profiles")
                        .select(
                            "id,username,display_name,avatar_url,bio,is_verified"
                        )
                        .ilike(
                            "display_name",
                            pattern
                        )
                        .neq(
                            "id",
                            currentSession
                                .user
                                .id
                        )
                        .limit(20)
                ]);

            if (
                usernameResult.error ||
                displayNameResult.error
            ) {
                console.error(
                    "[Chat] User search error:",
                    usernameResult.error ||
                        displayNameResult.error
                );

                resultContainer.innerHTML = `
                    <div class="empty-list">
                        Search failed.
                    </div>
                `;

                return;
            }

            const merged =
                new Map();

            for (
                const profile of
                usernameResult.data || []
            ) {
                merged.set(
                    profile.id,
                    profile
                );
            }

            for (
                const profile of
                displayNameResult.data || []
            ) {
                merged.set(
                    profile.id,
                    profile
                );
            }

            const results =
                [
                    ...merged.values()
                ];

            if (!results.length) {
                resultContainer.innerHTML = `
                    <div class="empty-list">
                        No users found.
                    </div>
                `;

                return;
            }

            for (
                const profile of results
            ) {
                profiles[
                    profile.id
                ] = profile;
            }

            resultContainer.innerHTML =
                "";

            for (
                const profile of results
            ) {
                resultContainer.appendChild(
                    createUserResult(
                        profile,
                        selectionMode
                    )
                );
            }
        }

        function createUserResult(
            profile,
            selectionMode
        ) {
            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "user-result";

            const avatar =
                createLocalAvatar(
                    profile,
                    "avatar small"
                );

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "user-result-info";

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "user-result-name";

            name.textContent =
                getDisplayName(
                    profile
                );

            const username =
                document.createElement(
                    "div"
                );

            username.className =
                "user-result-username";

            username.textContent =
                profile.username
                    ? `@${profile.username}`
                    : "";

            info.appendChild(
                name
            );

            info.appendChild(
                username
            );

            button.appendChild(
                avatar
            );

            button.appendChild(
                info
            );

            if (
                selectionMode
            ) {
                const selected =
                    selectedGroupUsers.some(
                        user =>
                            user.id ===
                            profile.id
                    );

                if (selected) {
                    button.classList.add(
                        "selected"
                    );
                }

                const check =
                    document.createElement(
                        "span"
                    );

                check.className =
                    "selected-check";

                check.textContent =
                    selected
                        ? "✓"
                        : "";

                button.appendChild(
                    check
                );

                button.addEventListener(
                    "click",
                    () =>
                        toggleGroupUser(
                            profile
                        )
                );
            } else {
                button.addEventListener(
                    "click",
                    () =>
                        startDirectConversation(
                            profile
                        )
                );
            }

            return button;
        }

        /*
         * --------------------------------------------------
         * Group creation
         * --------------------------------------------------
         */

        function toggleGroupUser(
            profile
        ) {
            const existingIndex =
                selectedGroupUsers.findIndex(
                    user =>
                        user.id ===
                        profile.id
                );

            if (
                existingIndex >= 0
            ) {
                selectedGroupUsers.splice(
                    existingIndex,
                    1
                );
            } else {
                selectedGroupUsers.push(
                    profile
                );
            }

            renderSelectedUsers();

            if (
                $("group-user-search")
                    .value
                    .trim()
            ) {
                searchUsers(
                    $("group-user-search"),
                    $("group-user-results"),
                    true
                );
            }
        }

        function renderSelectedUsers() {
            const container =
                $("selected-users");

            container.innerHTML =
                "";

            for (
                const profile of
                selectedGroupUsers
            ) {
                const element =
                    document.createElement(
                        "span"
                    );

                element.className =
                    "selected-user";

                element.textContent =
                    getDisplayName(
                        profile
                    );

                container.appendChild(
                    element
                );
            }
        }

        async function createGroup() {
            const name =
                $("group-name")
                    .value
                    .trim();

            const status =
                $("group-status");

            if (!name) {
                showStatus(
                    status,
                    "Enter a group name.",
                    true
                );

                return;
            }

            if (
                selectedGroupUsers.length <
                1
            ) {
                showStatus(
                    status,
                    "Add at least one other person.",
                    true
                );

                return;
            }

            const button =
                $("group-create");

            button.disabled =
                true;

            showStatus(
                status,
                "Creating group..."
            );

            const conversationId =
                generateNumericId();

            const {
                data:
                    conversation,
                error
            } =
                await db
