<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Authorize - Rip_Dead Account</title>

    <link rel="stylesheet" href="/css/auth.css">

    <style>
        body {
            min-height: 100vh;
        }

        .authorize-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .authorize-card {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg, #11111a);
            border: 1px solid var(--border, rgba(255,255,255,0.08));
            border-radius: 20px;
            padding: 32px;
            box-sizing: border-box;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .authorize-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .authorize-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 18px;
            background: var(--purple, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
            font-weight: 900;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.25);
        }

        .authorize-brand h1 {
            margin: 0;
            font-size: 24px;
        }

        .authorize-brand p {
            margin: 7px 0 0;
            opacity: 0.65;
            font-size: 14px;
        }

        .request-box {
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 22px;
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .app-icon {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 14px;
            background: rgba(139,92,246,0.15);
            border: 1px solid rgba(139,92,246,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--purple, #8b5cf6);
            font-size: 21px;
            font-weight: 900;
        }

        .app-name {
            font-size: 18px;
            font-weight: 800;
        }

        .app-client {
            margin-top: 4px;
            font-size: 12px;
            opacity: 0.5;
            word-break: break-all;
        }

        .request-text {
            font-size: 15px;
            line-height: 1.55;
            opacity: 0.85;
        }

        .scope-list {
            margin: 16px 0 0;
            padding: 0;
            list-style: none;
        }

        .scope-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            font-size: 14px;
        }

        .scope-check {
            width: 20px;
            height: 20px;
            min-width: 20px;
            border-radius: 50%;
            background: var(--purple, #8b5cf6);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
        }

        .authorize-actions {
            display: flex;
            gap: 12px;
        }

        .authorize-actions button {
            flex: 1;
            min-height: 46px;
            border: 0;
            border-radius: 12px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition:
                transform 0.15s ease,
                opacity 0.15s ease,
                background 0.15s ease;
        }

        .authorize-actions button:hover {
            transform: translateY(-1px);
        }

        .authorize-actions button:active {
            transform: translateY(0);
        }

        .deny-button {
            background: rgba(255,255,255,0.07);
            color: inherit;
            border: 1px solid rgba(255,255,255,0.08) !important;
        }

        .allow-button {
            background: var(--purple, #8b5cf6);
            color: white;
        }

        .allow-button:hover {
            opacity: 0.9;
        }

        .authorize-error {
            display: none;
            margin-bottom: 20px;
            padding: 13px 15px;
            border-radius: 11px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5;
            font-size: 14px;
            line-height: 1.45;
        }

        .authorize-error.visible {
            display: block;
        }

        .authorize-loading {
            text-align: center;
            padding: 30px 0;
            opacity: 0.65;
        }

        .authorize-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            opacity: 0.45;
            line-height: 1.5;
        }

        .authorize-footer a {
            color: inherit;
        }

        @media (max-width: 520px) {
            .authorize-page {
                padding: 14px;
            }

            .authorize-card {
                padding: 24px;
                border-radius: 17px;
            }

            .authorize-actions {
                flex-direction: column-reverse;
            }
        }
    </style>
</head>

<body>

<div class="authorize-page">

    <main class="authorize-card">

        <div class="authorize-brand">
            <div class="authorize-logo">
                RD
            </div>

            <h1>Rip_Dead Account</h1>

            <p>Application Authorization</p>
        </div>

        <div
            id="authorize-error"
            class="authorize-error"
        ></div>

        <div
            id="authorize-loading"
            class="authorize-loading"
        >
            Checking authorization request...
        </div>

        <section
            id="authorize-content"
            hidden
        >

            <div class="request-box">

                <div class="app-info">

                    <div
                        id="app-icon"
                        class="app-icon"
                    >
                        RD
                    </div>

                    <div>
                        <div
                            id="app-name"
                            class="app-name"
                        >
                            Application
                        </div>

                        <div
                            id="app-client"
                            class="app-client"
                        ></div>
                    </div>

                </div>

                <div class="request-text">
                    <strong id="app-name-text">
                        This application
                    </strong>
                    wants to access your Rip_Dead Account.
                </div>

                <ul
                    id="scope-list"
                    class="scope-list"
                ></ul>

            </div>

            <div class="authorize-actions">

                <button
                    id="deny-button"
                    class="deny-button"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="allow-button"
                    class="allow-button"
                    type="button"
                >
                    Allow
                </button>

            </div>

        </section>

        <div class="authorize-footer">
            Only continue if you trust this application.
            <br>
            <a href="https://ripdead.de5.net">
                Rip_Dead
            </a>
        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

<script>
"use strict";

const params = new URLSearchParams(window.location.search);

const clientId = params.get("client_id");
const redirectUri = params.get("redirect_uri");
const responseType = params.get("response_type");
const requestedScopes = params.get("scope");
const state = params.get("state");

const loadingElement =
    document.getElementById("authorize-loading");

const contentElement =
    document.getElementById("authorize-content");

const errorElement =
    document.getElementById("authorize-error");

const appNameElement =
    document.getElementById("app-name");

const appNameTextElement =
    document.getElementById("app-name-text");

const appClientElement =
    document.getElementById("app-client");

const appIconElement =
    document.getElementById("app-icon");

const scopeListElement =
    document.getElementById("scope-list");

const allowButton =
    document.getElementById("allow-button");

const denyButton =
    document.getElementById("deny-button");


/*
 * ---------------------------------------------------------
 * Application registry
 * ---------------------------------------------------------
 *
 * TEMPORARY:
 * This is only the initial client-side registry.
 *
 * Later, this will move to a secure server-side registry
 * so applications cannot modify their own authorization
 * information.
 */

const REGISTERED_APPS = {

    "ripdead-site": {
        name: "Rip_Dead Site",
        icon: "RD",
        redirectUris: [
            "https://ripdead.de5.net/auth/callback/"
        ],
        scopes: [
            "profile"
        ]
    },

    "ripdead-app": {
        name: "Rip_Dead App",
        icon: "RD",
        redirectUris: [
            "https://ripdead.de5.net/app/callback/"
        ],
        scopes: [
            "profile"
        ]
    }

};


/*
 * ---------------------------------------------------------
 * Scope descriptions
 * ---------------------------------------------------------
 */

const SCOPE_DESCRIPTIONS = {

    "profile": "View your basic Rip_Dead Account profile",

    "username": "View your username",

    "display_name": "View your display name",

    "avatar": "View your profile avatar",

    "friends": "Access your Rip_Dead friends",

    "follows": "Access your Rip_Dead follows"

};


/*
 * ---------------------------------------------------------
 * Error handling
 * ---------------------------------------------------------
 */

function showError(message) {

    loadingElement.hidden = true;
    contentElement.hidden = true;

    errorElement.textContent = message;
    errorElement.classList.add("visible");

}


/*
 * ---------------------------------------------------------
 * Redirect helper
 * ---------------------------------------------------------
 */

function redirectWithError(errorCode) {

    if (!redirectUri) {
        window.location.href = "/login/";
        return;
    }

    try {

        const url = new URL(redirectUri);

        url.searchParams.set(
            "error",
            errorCode
        );

        if (state) {
            url.searchParams.set(
                "state",
                state
            );
        }

        window.location.href = url.toString();

    } catch (error) {

        window.location.href = "/login/";

    }

}


/*
 * ---------------------------------------------------------
 * Render scopes
 * ---------------------------------------------------------
 */

function renderScopes(app) {

    scopeListElement.innerHTML = "";

    const requested = requestedScopes
        ? requestedScopes
            .split(" ")
            .map(scope => scope.trim())
            .filter(Boolean)
        : ["profile"];

    const allowedScopes =
        app.scopes || [];

    const uniqueScopes =
        [...new Set(requested)];

    for (const scope of uniqueScopes) {

        if (!allowedScopes.includes(scope)) {

            showError(
                `This application requested an unsupported permission: ${scope}`
            );

            return false;
        }

        const li =
            document.createElement("li");

        const check =
            document.createElement("span");

        check.className =
            "scope-check";

        check.textContent =
            "✓";

        const text =
            document.createElement("span");

        text.textContent =
            SCOPE_DESCRIPTIONS[scope] ||
            scope;

        li.appendChild(check);
        li.appendChild(text);

        scopeListElement.appendChild(li);

    }

    return true;

}


/*
 * ---------------------------------------------------------
 * Validate request
 * ---------------------------------------------------------
 */

function validateAuthorizationRequest() {

    if (!clientId) {

        showError(
            "This authorization request is missing a client_id."
        );

        return null;

    }

    if (!redirectUri) {

        showError(
            "This authorization request is missing a redirect_uri."
        );

        return null;

    }

    if (!responseType) {

        showError(
            "This authorization request is missing a response_type."
        );

        return null;

    }

    if (responseType !== "code") {

        showError(
            "Unsupported response type. Rip_Dead Account currently supports authorization code requests."
        );

        return null;

    }

    const app =
        REGISTERED_APPS[clientId];

    if (!app) {

        showError(
            "Unknown application."
        );

        return null;

    }

    if (!app.redirectUris.includes(redirectUri)) {

        showError(
            "The redirect URI is not registered for this application."
        );

        return null;

    }

    if (!renderScopes(app)) {
        return null;
    }

    return app;

}


/*
 * ---------------------------------------------------------
 * Display application
 * ---------------------------------------------------------
 */

function displayApplication(app) {

    appNameElement.textContent =
        app.name;

    appNameTextElement.textContent =
        app.name;

    appClientElement.textContent =
        `Client ID: ${clientId}`;

    appIconElement.textContent =
        app.icon || "RD";

    loadingElement.hidden = true;
    contentElement.hidden = false;

}


/*
 * ---------------------------------------------------------
 * Allow authorization
 * ---------------------------------------------------------
 *
 * TEMPORARY:
 * We do NOT issue an authorization code yet.
 *
 * This will later call a secure backend endpoint which:
 *
 * 1. Verifies the logged-in Supabase user
 * 2. Verifies client_id
 * 3. Verifies redirect_uri
 * 4. Verifies requested scopes
 * 5. Creates a short-lived authorization code
 * 6. Redirects the user back to the application
 *
 */

async function authorizeApplication() {

    if (allowButton.disabled) {
        return;
    }

    allowButton.disabled = true;
    denyButton.disabled = true;

    allowButton.textContent =
        "Authorizing...";

    try {

        const session =
            await window.getSession();

        if (!session) {

            const currentUrl =
                window.location.href;

            window.location.href =
                `/login/?redirect=${encodeURIComponent(currentUrl)}`;

            return;

        }

        /*
         * Backend authorization will be added here.
         */

        showError(
            "Authorization backend is not connected yet. The authorization screen is ready, but token/code issuance still needs to be configured."
        );

    } catch (error) {

        console.error(
            "[Authorize] Authorization error:",
            error
        );

        showError(
            "Something went wrong while authorizing this application."
        );

    }

    allowButton.disabled = false;
    denyButton.disabled = false;

    allowButton.textContent =
        "Allow";

}


/*
 * ---------------------------------------------------------
 * Deny authorization
 * ---------------------------------------------------------
 */

function denyAuthorization() {

    if (denyButton.disabled) {
        return;
    }

    redirectWithError(
        "access_denied"
    );

}


/*
 * ---------------------------------------------------------
 * Button events
 * ---------------------------------------------------------
 */

allowButton.addEventListener(
    "click",
    authorizeApplication
);

denyButton.addEventListener(
    "click",
    denyAuthorization
);


/*
 * ---------------------------------------------------------
 * Initialization
 * ---------------------------------------------------------
 */

async function initializeAuthorization() {

    const app =
        validateAuthorizationRequest();

    if (!app) {
        return;
    }

    const session =
        await window.getSession();

    if (!session) {

        const currentUrl =
            window.location.href;

        window.location.href =
            `/login/?redirect=${encodeURIComponent(currentUrl)}`;

        return;

    }

    displayApplication(app);

}


initializeAuthorization();

</script>

</body>
</html>
