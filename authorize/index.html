<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authorize — Rip_Dead Account</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            Rip_Dead Account
        </div>

        <h1 id="title">
            Authorize Application
        </h1>

        <p id="description">
            Checking authorization request...
        </p>

        <div id="loading" class="message">
            Loading...
        </div>

        <div id="authorize-content" style="display:none;">

            <div class="app-box">

                <div id="app-icon" class="app-icon">
                    <span>R</span>
                </div>

                <div class="app-info">

                    <strong id="app-name">
                        Application
                    </strong>

                    <span id="app-description">
                        Requesting access to your Rip_Dead Account.
                    </span>

                </div>

            </div>

            <h3>
                This application wants access to:
            </h3>

            <div id="scopes" class="scope-list"></div>

            <p id="account-status" class="message"></p>

            <div class="buttons">

                <button
                    id="allow-button"
                    class="primary-button"
                    type="button">

                    Allow Access

                </button>

                <button
                    id="cancel-button"
                    class="secondary-button"
                    type="button">

                    Cancel

                </button>

            </div>

        </div>

        <div id="error-content" style="display:none;">

            <p id="error-message" class="message error"></p>

            <a
                href="/account/"
                class="secondary-button">

                Return to Account

            </a>

        </div>

    </div>

</div>

<script src="/js/auth.js"></script>

<script>

const supabaseClient = window.supabaseClient;

const params =
    new URLSearchParams(window.location.search);

const clientId =
    params.get("client_id");

const redirectUri =
    params.get("redirect_uri");

const responseType =
    params.get("response_type");

const scopeString =
    params.get("scope") || "profile";

const state =
    params.get("state");

const requestedScopes =
    scopeString
        .split(/\s+/)
        .filter(Boolean);

let application = null;


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
    document.getElementById("loading");

const authorizeContent =
    document.getElementById("authorize-content");

const errorContent =
    document.getElementById("error-content");

const errorMessage =
    document.getElementById("error-message");

const appName =
    document.getElementById("app-name");

const appDescription =
    document.getElementById("app-description");

const appIcon =
    document.getElementById("app-icon");

const scopesElement =
    document.getElementById("scopes");

const accountStatus =
    document.getElementById("account-status");

const allowButton =
    document.getElementById("allow-button");

const cancelButton =
    document.getElementById("cancel-button");


/* =========================================================
   ERROR UI
========================================================= */

function showError(message) {

    console.error(
        "[OAuth] " + message
    );

    loading.style.display =
        "none";

    authorizeContent.style.display =
        "none";

    errorContent.style.display =
        "block";

    errorMessage.textContent =
        message;
}


/* =========================================================
   REDIRECT WITH ERROR
========================================================= */

function redirectError(
    error,
    description
) {

    if (!redirectUri) {

        showError(
            description
        );

        return;
    }

    const url =
        new URL(
            redirectUri
        );

    url.searchParams.set(
        "error",
        error
    );

    if (description) {

        url.searchParams.set(
            "error_description",
            description
        );
    }

    if (state) {

        url.searchParams.set(
            "state",
            state
        );
    }

    window.location.href =
        url.toString();
}


/* =========================================================
   LOAD APPLICATION
========================================================= */

async function loadApplication() {

    if (!clientId) {

        showError(
            "Missing OAuth client_id."
        );

        return;
    }

    if (!redirectUri) {

        showError(
            "Missing OAuth redirect_uri."
        );

        return;
    }

    if (responseType !== "code") {

        redirectError(
            "unsupported_response_type",
            "Only authorization code flow is supported."
        );

        return;
    }

    if (
        requestedScopes.length === 0
    ) {

        showError(
            "No OAuth scopes were requested."
        );

        return;
    }

    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "get_oauth_app",
                {
                    requested_client_id:
                        clientId
                }
            );

        if (error) {

            console.error(
                "[OAuth] App lookup error:",
                error
            );

            throw new Error(
                "Could not load application."
            );
        }

        if (
            !data ||
            data.length === 0
        ) {

            throw new Error(
                "Unknown OAuth application."
            );
        }

        application =
            data[0];

        /*
         * Make sure the redirect URI is registered.
         */

        if (
            !Array.isArray(
                application.redirect_uris
            ) ||
            !application.redirect_uris.includes(
                redirectUri
            )
        ) {

            throw new Error(
                "This redirect URI is not registered for this application."
            );
        }

        /*
         * Make sure every requested scope
         * is allowed.
         */

        const allowedScopes =
            Array.isArray(
                application.allowed_scopes
            )
                ? application.allowed_scopes
                : [];

        for (
            const scope
            of requestedScopes
        ) {

            if (
                !allowedScopes.includes(
                    scope
                )
            ) {

                throw new Error(
                    `The "${scope}" permission is not allowed for this application.`
                );
            }
        }

        /*
         * Display application.
         */

        appName.textContent =
            application.name;

        appDescription.textContent =
            application.description ||
            "Requesting access to your Rip_Dead Account.";

        if (
            application.icon_url
        ) {

            appIcon.innerHTML = "";

            const image =
                document.createElement(
                    "img"
                );

            image.src =
                application.icon_url;

            image.alt = "";

            image.style.width =
                "100%";

            image.style.height =
                "100%";

            image.style.objectFit =
                "cover";

            image.style.borderRadius =
                "inherit";

            appIcon.appendChild(
                image
            );

        } else {

            appIcon.textContent =
                application.name
                    ?.charAt(0)
                    ?.toUpperCase() ||
                "R";
        }

        scopesElement.innerHTML = "";

        for (
            const scope
            of requestedScopes
        ) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "scope-item";

            if (
                scope === "profile"
            ) {

                item.textContent =
                    "View your Rip_Dead profile";

            } else {

                item.textContent =
                    scope;
            }

            scopesElement.appendChild(
                item
            );
        }

        loading.style.display =
            "none";

        authorizeContent.style.display =
            "block";

        /*
         * Check whether user is logged in.
         */

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabaseClient.auth.getSession();

        if (sessionError) {

            console.error(
                "[OAuth] Session error:",
                sessionError
            );

            throw new Error(
                "Could not check your account session."
            );
        }

        if (
            !sessionData ||
            !sessionData.session
        ) {

            accountStatus.textContent =
                "You must sign in to your Rip_Dead Account before continuing.";

            allowButton.disabled =
                true;

            return;
        }

        accountStatus.textContent =
            "You are signed in. Review the requested permissions and continue.";

    } catch (error) {

        console.error(
            "[OAuth] Load application failed:",
            error
        );

        showError(
            error.message ||
            "Unable to load authorization request."
        );
    }
}


/* =========================================================
   RANDOM AUTHORIZATION CODE
========================================================= */

function generateRandomCode() {

    const bytes =
        new Uint8Array(32);

    crypto.getRandomValues(
        bytes
    );

    let binary = "";

    for (
        const byte
        of bytes
    ) {

        binary +=
            String.fromCharCode(
                byte
            );
    }

    return btoa(
        binary
    )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
}


/* =========================================================
   SHA-256
========================================================= */

async function sha256(
    value
) {

    const data =
        new TextEncoder()
            .encode(value);

    const digest =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const bytes =
        new Uint8Array(
            digest
        );

    let binary = "";

    for (
        const byte
        of bytes
    ) {

        binary +=
            String.fromCharCode(
                byte
            );
    }

    return btoa(
        binary
    )
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
}


/* =========================================================
   AUTHORIZE
========================================================= */

async function authorize() {

    allowButton.disabled =
        true;

    cancelButton.disabled =
        true;

    allowButton.textContent =
        "Authorizing...";

    try {

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabaseClient.auth.getSession();

        if (
            sessionError ||
            !sessionData ||
            !sessionData.session
        ) {

            throw new Error(
                "You are no longer signed in."
            );
        }

        /*
         * Generate the raw authorization code.
         */

        const code =
            generateRandomCode();

        /*
         * Only the SHA-256 hash is stored
         * in Supabase.
         */

        const codeHash =
            await sha256(
                code
            );

        /*
         * THIS IS THE IMPORTANT PART.
         *
         * The old placeholder message is gone.
         * We actually create the authorization
         * code in Supabase.
         */

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "create_oauth_authorization_code",
                {
                    requested_client_id:
                        clientId,

                    requested_redirect_uri:
                        redirectUri,

                    requested_scopes:
                        requestedScopes,

                    requested_code_hash:
                        codeHash
                }
            );

        if (error) {

            console.error(
                "[OAuth] Authorization code creation failed:",
                error
            );

            throw new Error(
                error.message ||
                "Authorization backend failed."
            );
        }

        if (data !== true) {

            throw new Error(
                "Authorization code was not created."
            );
        }

        /*
         * Authorization succeeded.
         *
         * Send the RAW code to the registered
         * redirect URI.
         */

        const callbackUrl =
            new URL(
                redirectUri
            );

        callbackUrl.searchParams.set(
            "code",
            code
        );

        if (state) {

            callbackUrl.searchParams.set(
                "state",
                state
            );
        }

        window.location.href =
            callbackUrl.toString();

    } catch (error) {

        console.error(
            "[OAuth] Authorization failed:",
            error
        );

        allowButton.disabled =
            false;

        cancelButton.disabled =
            false;

        allowButton.textContent =
            "Allow Access";

        accountStatus.textContent =
            error.message ||
            "Authorization failed.";

        accountStatus.classList.add(
            "error"
        );
    }
}


/* =========================================================
   CANCEL
========================================================= */

function cancelAuthorization() {

    if (!redirectUri) {

        window.location.href =
            "/account/";

        return;
    }

    const url =
        new URL(
            redirectUri
        );

    url.searchParams.set(
        "error",
        "access_denied"
    );

    url.searchParams.set(
        "error_description",
        "The user denied the authorization request."
    );

    if (state) {

        url.searchParams.set(
            "state",
            state
        );
    }

    window.location.href =
        url.toString();
}


/* =========================================================
   BUTTONS
========================================================= */

allowButton.addEventListener(
    "click",
    authorize
);

cancelButton.addEventListener(
    "click",
    cancelAuthorization
);


/* =========================================================
   START
========================================================= */

loadApplication();

</script>

</body>
</html>
