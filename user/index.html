<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Profile — Rip_Dead Account</title>

    <link
        rel="stylesheet"
        href="/css/auth.css"
    >
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="navbar-brand"
        >
            Rip_Dead Account
        </a>


        <div class="navbar-links">

            <a href="/">
                Home
            </a>

            <a
                href="/search/"
                class="auth-only"
                hidden
            >
                Search
            </a>

            <a
                href="/friends/"
                class="auth-only"
                hidden
            >
                Friends
            </a>

            <a
                href="/chat/"
                class="auth-only"
                hidden
            >
                Chat
            </a>

            <a
                href="/apps/"
                class="auth-only"
                hidden
            >
                Authorized Apps
            </a>
            
            <a
                href="/settings/"
                class="auth-only"
                hidden
            >
                Settings
            </a>

            <a
                href="/account/"
                class="auth-only"
                hidden
            >
                Account
            </a>

            <a
                href="/login/"
                class="guest-only"
            >
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link"
            >
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden
            >
                Log Out
            </button>

        </div>

    </div>

</nav>


<main class="page page-small">

    <div
        id="profile-loading"
        class="message"
    >
        Loading profile...
    </div>


    <div
        id="profile-error"
        class="message error"
        hidden
    ></div>


    <section
        id="profile-card"
        class="card"
        hidden
    >

        <div class="account-profile">

            <div
                id="profile-avatar"
                class="account-avatar empty"
            ></div>


            <div class="account-profile-info">

                <div
                    id="profile-name"
                    class="account-name"
                ></div>

                <div
                    id="profile-username"
                    class="account-username"
                ></div>

            </div>

        </div>


        <div
            id="profile-bio"
            class="profile-bio"
        ></div>


        <div
            id="profile-actions"
            class="button-row"
        ></div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>


<script>

document.addEventListener("DOMContentLoaded", async () => {

    const loading =
        document.getElementById("profile-loading");

    const errorBox =
        document.getElementById("profile-error");

    const card =
        document.getElementById("profile-card");

    const avatar =
        document.getElementById("profile-avatar");

    const name =
        document.getElementById("profile-name");

    const username =
        document.getElementById("profile-username");

    const bio =
        document.getElementById("profile-bio");

    const actions =
        document.getElementById("profile-actions");


    function showError(text) {

        loading.hidden = true;

        card.hidden = true;

        errorBox.textContent = text;

        errorBox.hidden = false;
    }


    function getViewedUserId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get("id");
    }


    const viewedUserId =
        getViewedUserId();


    if (!viewedUserId) {

        showError(
            "No user profile was specified."
        );

        return;
    }


    try {

        const session =
            await initNavbar();


        const viewedProfile =
            await getProfile(
                viewedUserId
            );


        if (!viewedProfile) {

            showError(
                "That user could not be found."
            );

            return;
        }


        const displayName =
            viewedProfile.display_name ||
            viewedProfile.username ||
            "Rip_Dead User";


        const viewedUsername =
            viewedProfile.username ||
            "unknown";


        name.textContent =
            displayName;


        username.textContent =
            "@" + viewedUsername;


        if (viewedProfile.is_verified) {

            const verified =
                document.createElement("span");

            verified.className =
                "verified-text";

            verified.textContent =
                "✓ Verified";

            name.appendChild(
                verified
            );
        }


        if (viewedProfile.bio) {

            bio.textContent =
                viewedProfile.bio;

            bio.style.display =
                "block";

        } else {

            bio.textContent =
                "No bio yet.";

            bio.style.opacity =
                "0.65";
        }


        const avatarElement =
            createAvatar(
                viewedProfile,
                "account-avatar"
            );


        avatar.innerHTML = "";

        avatar.classList.remove(
            "empty"
        );

        avatar.appendChild(
            avatarElement
        );


        if (session) {

            await loadActions(
                session,
                viewedProfile
            );

        } else {

            const loginButton =
                document.createElement("a");

            loginButton.href =
                "/login/";

            loginButton.className =
                "button";

            loginButton.textContent =
                "Log In to Connect";

            actions.appendChild(
                loginButton
            );
        }


        document.title =
            `${displayName} — Rip_Dead Account`;


        loading.hidden = true;

        card.hidden = false;


    } catch (err) {

        console.error(err);

        showError(
            "Something went wrong while loading this profile."
        );
    }


    async function loadActions(
        session,
        viewedProfile
    ) {

        actions.innerHTML = "";


        if (
            session.user.id ===
            viewedProfile.id
        ) {

            const accountButton =
                document.createElement("a");

            accountButton.href =
                "/account/";

            accountButton.className =
                "button";

            accountButton.textContent =
                "Edit Account";

            actions.appendChild(
                accountButton
            );

            return;
        }


        const friendship =
            await loadFriendship(
                session.user.id,
                viewedProfile.id
            );


        const following =
            await loadFollowing(
                session.user.id,
                viewedProfile.id
            );


        if (
            friendship &&
            friendship.status === "accepted"
        ) {

            const friendsLabel =
                document.createElement("span");

            friendsLabel.className =
                "button secondary";

            friendsLabel.textContent =
                "Friends";

            actions.appendChild(
                friendsLabel
            );

        } else if (
            friendship &&
            friendship.requester_id ===
            session.user.id &&
            friendship.status === "pending"
        ) {

            const pending =
                document.createElement("span");

            pending.className =
                "button secondary";

            pending.textContent =
                "Request Sent";

            actions.appendChild(
                pending
            );

        } else if (
            friendship &&
            friendship.addressee_id ===
            session.user.id &&
            friendship.status === "pending"
        ) {

            const acceptButton =
                document.createElement("button");

            acceptButton.type =
                "button";

            acceptButton.className =
                "button";

            acceptButton.textContent =
                "Accept Friend Request";


            acceptButton.addEventListener(
                "click",
                async () => {

                    acceptButton.disabled =
                        true;

                    try {

                        await acceptFriendRequest(
                            friendship.id,
                            session.user.id
                        );

                        await loadActions(
                            session,
                            viewedProfile
                        );

                    } catch (err) {

                        console.error(err);

                        acceptButton.disabled =
                            false;
                    }
                }
            );


            actions.appendChild(
                acceptButton
            );

        } else {

            const friendButton =
                document.createElement("button");

            friendButton.type =
                "button";

            friendButton.className =
                "button";

            friendButton.textContent =
                "Add Friend";


            friendButton.addEventListener(
                "click",
                async () => {

                    friendButton.disabled =
                        true;

                    try {

                        await sendFriendRequest(
                            session.user.id,
                            viewedProfile.id
                        );

                        await loadActions(
                            session,
                            viewedProfile
                        );

                    } catch (err) {

                        console.error(err);

                        friendButton.disabled =
                            false;
                    }
                }
            );


            actions.appendChild(
                friendButton
            );
        }


        const followButton =
            document.createElement("button");


        followButton.type =
            "button";


        followButton.className =
            "button secondary";


        if (following) {

            followButton.textContent =
                "Unfollow";


            followButton.addEventListener(
                "click",
                async () => {

                    followButton.disabled =
                        true;

                    try {

                        await unfollowUser(
                            session.user.id,
                            viewedProfile.id
                        );

                        await loadActions(
                            session,
                            viewedProfile
                        );

                    } catch (err) {

                        console.error(err);

                        followButton.disabled =
                            false;
                    }
                }
            );

        } else {

            followButton.textContent =
                "Follow";


            followButton.addEventListener(
                "click",
                async () => {

                    followButton.disabled =
                        true;

                    try {

                        await followUser(
                            session.user.id,
                            viewedProfile.id
                        );

                        await loadActions(
                            session,
                            viewedProfile
                        );

                    } catch (err) {

                        console.error(err);

                        followButton.disabled =
                            false;
                    }
                }
            );
        }


        actions.appendChild(
            followButton
        );
    }


    async function loadFriendship(
        currentUserId,
        otherUserId
    ) {

        const {
            data,
            error
        } = await supabaseClient
            .from("friendships")
            .select("*")
            .or(
                `and(requester_id.eq.${currentUserId},addressee_id.eq.${otherUserId}),and(requester_id.eq.${otherUserId},addressee_id.eq.${currentUserId})`
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(1)
            .maybeSingle();


        if (error) {
            throw error;
        }


        return data;
    }


    async function loadFollowing(
        currentUserId,
        otherUserId
    ) {

        const {
            data,
            error
        } = await supabaseClient
            .from("follows")
            .select("follower_id")
            .eq(
                "follower_id",
                currentUserId
            )
            .eq(
                "following_id",
                otherUserId
            )
            .maybeSingle();


        if (error) {
            throw error;
        }


        return !!data;
    }


    async function sendFriendRequest(
        currentUserId,
        otherUserId
    ) {

        const {
            error
        } = await supabaseClient
            .from("friendships")
            .insert({
                requester_id:
                    currentUserId,

                addressee_id:
                    otherUserId,

                status:
                    "pending"
            });


        if (error) {
            throw error;
        }
    }


    async function acceptFriendRequest(
        friendshipId,
        currentUserId
    ) {

        const {
            error
        } = await supabaseClient
            .from("friendships")
            .update({
                status:
                    "accepted"
            })
            .eq(
                "id",
                friendshipId
            )
            .eq(
                "addressee_id",
                currentUserId
            );


        if (error) {
            throw error;
        }
    }


    async function followUser(
        currentUserId,
        otherUserId
    ) {

        const {
            error
        } = await supabaseClient
            .from("follows")
            .insert({
                follower_id:
                    currentUserId,

                following_id:
                    otherUserId
            });


        if (error) {
            throw error;
        }
    }


    async function unfollowUser(
        currentUserId,
        otherUserId
    ) {

        const {
            error
        } = await supabaseClient
            .from("follows")
            .delete()
            .eq(
                "follower_id",
                currentUserId
            )
            .eq(
                "following_id",
                otherUserId
            );


        if (error) {
            throw error;
        }
    }

});

</script>

</body>

</html>
```
