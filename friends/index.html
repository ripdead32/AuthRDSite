<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friends - Rip_Dead Authentication</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a
            href="../"
            class="navbar-brand"
        >
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">

            <a href="../">
                Home
            </a>

            <a href="../search/">
                Search
            </a>

            <a href="../friends/">
                Friends
            </a>

            <a href="../settings/">
                Settings
            </a>

            <a href="../account/">
                Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="navbar-logout"
            >
                Log Out
            </button>

        </div>

    </div>

</nav>

<main class="auth-container">

    <div class="auth-card wide">

        <div class="auth-header">

            <h1>Friends</h1>

            <p>
                Manage your Rip_Dead friendships.
            </p>

        </div>

        <section class="friend-section">

            <h3>
                Pending Requests
            </h3>

            <div id="requests">
                <div class="search-empty">
                    Loading...
                </div>
            </div>

        </section>

        <section class="friend-section">

            <h3>
                Friends
            </h3>

            <div id="friends-list">
                <div class="search-empty">
                    Loading...
                </div>
            </div>

        </section>

        <div
            id="friends-message"
            class="auth-message"
        ></div>

    </div>

</main>

<script>
let currentUserId = null;

async function getProfileById(id) {

    const { data, error } =
        await window.supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", id)
            .single();

    if (error) {
        console.error(
            "Profile lookup error:",
            error
        );

        return null;
    }

    return data;
}

function createFriendElement(
    profile,
    buttons = []
) {

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "friend-item";

    const avatar =
        createAvatar(
            profile,
            "result-avatar"
        );

    const info =
        document.createElement(
            "div"
        );

    info.className =
        "friend-item-info";

    const name =
        document.createElement(
            "strong"
        );

    name.textContent =
        profile.display_name ||
        profile.username ||
        "User";

    const username =
        document.createElement(
            "span"
        );

    username.textContent =
        profile.username
            ? "@" + profile.username
            : "";

    info.appendChild(name);
    info.appendChild(username);

    item.appendChild(avatar);
    item.appendChild(info);

    if (buttons.length) {

        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "friend-actions";

        buttons.forEach(
            (button) => {
                actions.appendChild(
                    button
                );
            }
        );

        item.appendChild(actions);
    }

    return item;
}

async function loadFriends() {

    const requests =
        document.getElementById(
            "requests"
        );

    const friends =
        document.getElementById(
            "friends-list"
        );

    requests.innerHTML = "";
    friends.innerHTML = "";

    const { data, error } =
        await window.supabaseClient
            .from("friendships")
            .select("*")
            .or(
                "requester_id.eq." +
                currentUserId +
                ",addressee_id.eq." +
                currentUserId
            );

    if (error) {

        console.error(
            "Friendship query error:",
            error
        );

        requests.innerHTML =
            "<div class=\"search-empty\">" +
            "Unable to load friendships." +
            "</div>";

        return;
    }

    let requestCount = 0;
    let friendCount = 0;

    for (const friendship of data || []) {

        const otherId =
            friendship.requester_id ===
            currentUserId
                ? friendship.addressee_id
                : friendship.requester_id;

        const profile =
            await getProfileById(
                otherId
            );

        if (!profile) {
            continue;
        }

        if (
            friendship.status ===
            "pending" &&
            friendship.addressee_id ===
            currentUserId
        ) {

            requestCount++;

            const accept =
                document.createElement(
                    "button"
                );

            accept.textContent =
                "Accept";

            accept.addEventListener(
                "click",
                async () => {

                    const { error } =
                        await window.supabaseClient
                            .from("friendships")
                            .update({
                                status:
                                    "accepted"
                            })
                            .eq(
                                "id",
                                friendship.id
                            );

                    if (error) {
                        alert(
                            error.message
                        );
                        return;
                    }

                    await loadFriends();
                }
            );

            const decline =
                document.createElement(
                    "button"
                );

            decline.textContent =
                "Decline";

            decline.className =
                "danger-button";

            decline.addEventListener(
                "click",
                async () => {

                    const { error } =
                        await window.supabaseClient
                            .from("friendships")
                            .delete()
                            .eq(
                                "id",
                                friendship.id
                            );

                    if (error) {
                        alert(
                            error.message
                        );
                        return;
                    }

                    await loadFriends();
                }
            );

            requests.appendChild(
                createFriendElement(
                    profile,
                    [
                        accept,
                        decline
                    ]
                )
            );
        }

        if (
            friendship.status ===
            "accepted"
        ) {

            friendCount++;

            const remove =
                document.createElement(
                    "button"
                );

            remove.textContent =
                "Remove";

            remove.className =
                "danger-button";

            remove.addEventListener(
                "click",
                async () => {

                    const { error } =
                        await window.supabaseClient
                            .from("friendships")
                            .delete()
                            .eq(
                                "id",
                                friendship.id
                            );

                    if (error) {
                        alert(
                            error.message
                        );
                        return;
                    }

                    await loadFriends();
                }
            );

            friends.appendChild(
                createFriendElement(
                    profile,
                    [remove]
                )
            );
        }
    }

    if (requestCount === 0) {

        requests.innerHTML =
            "<div class=\"search-empty\">" +
            "No pending requests." +
            "</div>";
    }

    if (friendCount === 0) {

        friends.innerHTML =
            "<div class=\"search-empty\">" +
            "You don't have any friends yet." +
            "</div>";
    }
}

async function initializeFriends() {

    const session =
        await requireAuth();

    if (!session) {
        return;
    }

    currentUserId =
        session.user.id;

    await initNavbar();

    await loadFriends();
}

initializeFriends();
</script>

</body>
</html>
