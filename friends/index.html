<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friends - Rip_Dead Authentication</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">
    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Authentication
        </a>

        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/search/" class="auth-only" hidden>Search</a>
            <a href="/friends/" class="auth-only" hidden>Friends</a>
            <a href="/settings/" class="auth-only" hidden>Settings</a>
            <a href="/account/" class="auth-only" hidden>Account</a>

            <a href="/login/" class="guest-only">Log In</a>

            <a href="/signup/" class="guest-only button-link">
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden>
                Log Out
            </button>
        </div>

    </div>
</nav>

<main class="auth-container">

    <section class="auth-card">

        <h1>Friends</h1>

        <p class="auth-subtitle">
            Manage your Rip_Dead friends.
        </p>

        <div id="friends-message"
             class="auth-message"
             aria-live="polite">
        </div>

        <h2>Friend Requests</h2>

        <div id="requests">
            Loading...
        </div>

        <h2>Your Friends</h2>

        <div id="friends-list">
            Loading...
        </div>

    </section>

</main>

<script>
let friendsSession = null;

const requestsContainer =
    document.getElementById("requests");

const friendsContainer =
    document.getElementById("friends-list");

const friendsMessage =
    document.getElementById("friends-message");

async function initializeFriends() {

    friendsSession =
        await requireAuth();

    if (!friendsSession) {
        return;
    }

    await initNavbar();

    await loadFriendships();
}

async function loadFriendships() {

    requestsContainer.innerHTML =
        "Loading...";

    friendsContainer.innerHTML =
        "Loading...";

    const {
        data,
        error
    } =
        await supabaseClient
            .from("friendships")
            .select("*")
            .or(
                `requester_id.eq.${friendsSession.user.id},addressee_id.eq.${friendsSession.user.id}`
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

    if (error) {

        console.error(
            "Friendships error:",
            error
        );

        setMessage(
            friendsMessage,
            error.message,
            "error"
        );

        return;
    }

    requestsContainer.innerHTML = "";
    friendsContainer.innerHTML = "";

    const receivedRequests =
        data.filter(friendship =>
            friendship.addressee_id ===
            friendsSession.user.id &&
            friendship.status === "pending"
        );

    const accepted =
        data.filter(friendship =>
            friendship.status === "accepted"
        );

    if (receivedRequests.length === 0) {

        requestsContainer.textContent =
            "No pending friend requests.";

    } else {

        for (const friendship of receivedRequests) {

            const profile =
                await getProfile(
                    friendship.requester_id
                );

            if (!profile) {
                continue;
            }

            const card =
                createFriendCard(
                    profile
                );

            const accept =
                document.createElement("button");

            accept.textContent =
                "Accept";

            accept.addEventListener(
                "click",
                () =>
                    updateFriendRequest(
                        friendship.id,
                        "accepted"
                    )
            );

            const decline =
                document.createElement("button");

            decline.textContent =
                "Decline";

            decline.addEventListener(
                "click",
                () =>
                    updateFriendRequest(
                        friendship.id,
                        "declined"
                    )
            );

            card.appendChild(accept);
            card.appendChild(decline);

            requestsContainer.appendChild(
                card
            );
        }
    }

    if (accepted.length === 0) {

        friendsContainer.textContent =
            "You don't have any friends yet.";

    } else {

        for (const friendship of accepted) {

            const friendId =
                friendship.requester_id ===
                friendsSession.user.id
                    ? friendship.addressee_id
                    : friendship.requester_id;

            const profile =
                await getProfile(
                    friendId
                );

            if (!profile) {
                continue;
            }

            friendsContainer.appendChild(
                createFriendCard(profile)
            );
        }
    }
}

function createFriendCard(profile) {

    const card =
        document.createElement("div");

    card.className =
        "friend-card";

    const avatar =
        createAvatar(
            profile,
            "friend-avatar"
        );

    const information =
        document.createElement("div");

    information.className =
        "friend-info";

    const name =
        document.createElement("strong");

    name.textContent =
        profile.display_name ||
        profile.username ||
        "Unknown User";

    const username =
        document.createElement("span");

    username.textContent =
        profile.username
            ? "@" + profile.username
            : "";

    information.appendChild(name);
    information.appendChild(username);

    card.appendChild(avatar);
    card.appendChild(information);

    return card;
}

async function updateFriendRequest(
    friendshipId,
    status
) {

    const {
        error
    } =
        await supabaseClient
            .from("friendships")
            .update({
                status
            })
            .eq(
                "id",
                friendshipId
            );

    if (error) {

        console.error(
            "Friend request update error:",
            error
        );

        setMessage(
            friendsMessage,
            error.message,
            "error"
        );

        return;
    }

    await loadFriendships();
}

initializeFriends();
</script>

</body>
</html>
