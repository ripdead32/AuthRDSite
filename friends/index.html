<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends | Rip_Dead</title>
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-logo">
                <div class="logo-mark">RD</div>
                <h1>Rip_Dead</h1>
            </div>

            <div class="auth-header">
                <h2>Friends</h2>
                <p>Manage your friendships and requests.</p>
            </div>

            <h3>Friend Requests</h3>
            <div id="requests">
                <p class="search-empty">Loading...</p>
            </div>

            <h3>Your Friends</h3>
            <div id="friends">
                <p class="search-empty">Loading...</p>
            </div>

            <div class="account-links">
                <a href="../account/">My Account</a>
                <a href="../search/">Search Users</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/auth.js"></script>

    <script>
        let session;

        function profileLink(profile) {
            return "../profile/?username=" +
                encodeURIComponent(
                    profile.username || ""
                );
        }

        function createUserCard(profile) {
            const card =
                document.createElement("div");

            card.className =
                "user-result";

            const avatar =
                document.createElement("div");

            avatar.className =
                "result-avatar";

            if (profile.avatar_url) {
                avatar.innerHTML =
                    `<img src="${profile.avatar_url}" alt="">`;
            } else {
                avatar.textContent =
                    getAvatarLetter(profile);
            }

            const info =
                document.createElement("div");

            info.className =
                "result-info";

            const link =
                document.createElement("a");

            link.href =
                profileLink(profile);

            link.textContent =
                profile.display_name ||
                profile.username ||
                "Unnamed User";

            const username =
                document.createElement("span");

            username.textContent =
                profile.username
                    ? "@" + profile.username
                    : "";

            info.appendChild(link);
            info.appendChild(username);

            card.appendChild(avatar);
            card.appendChild(info);

            return card;
        }

        async function loadRequests() {
            const container =
                document.getElementById("requests");

            const { data, error } =
                await window.supabaseClient
                    .from("friendships")
                    .select(
                        "id, requester_id, status"
                    )
                    .eq(
                        "addressee_id",
                        session.user.id
                    )
                    .eq(
                        "status",
                        "pending"
                    );

            if (error) {
                console.error(error);
                container.innerHTML =
                    "<p class='search-empty'>Failed to load requests.</p>";
                return;
            }

            if (!data.length) {
                container.innerHTML =
                    "<p class='search-empty'>No pending requests.</p>";
                return;
            }

            container.innerHTML = "";

            for (const request of data) {
                const profile =
                    await getProfile(request.requester_id);

                if (!profile) {
                    continue;
                }

                const card =
                    createUserCard(profile);

                const actions =
                    document.createElement("div");

                actions.className =
                    "friend-actions";

                const accept =
                    document.createElement("button");

                accept.textContent =
                    "Accept";

                const decline =
                    document.createElement("button");

                decline.className =
                    "secondary-button";

                decline.textContent =
                    "Decline";

                accept.onclick =
                    async () => {
                        await window.supabaseClient
                            .from("friendships")
                            .update({
                                status: "accepted"
                            })
                            .eq(
                                "id",
                                request.id
                            );

                        loadRequests();
                        loadFriends();
                    };

                decline.onclick =
                    async () => {
                        await window.supabaseClient
                            .from("friendships")
                            .update({
                                status: "declined"
                            })
                            .eq(
                                "id",
                                request.id
                            );

                        loadRequests();
                    };

                actions.appendChild(accept);
                actions.appendChild(decline);
                card.appendChild(actions);

                container.appendChild(card);
            }
        }

        async function loadFriends() {
            const container =
                document.getElementById("friends");

            const { data, error } =
                await window.supabaseClient
                    .from("friendships")
                    .select(
                        "id, requester_id, addressee_id"
                    )
                    .eq(
                        "status",
                        "accepted"
                    )
                    .or(
                        `requester_id.eq.${session.user.id},addressee_id.eq.${session.user.id}`
                    );

            if (error) {
                console.error(error);
                container.innerHTML =
                    "<p class='search-empty'>Failed to load friends.</p>";
                return;
            }

            if (!data.length) {
                container.innerHTML =
                    "<p class='search-empty'>You don't have any friends yet.</p>";
                return;
            }

            container.innerHTML = "";

            for (const friendship of data) {
                const otherId =
                    friendship.requester_id === session.user.id
                        ? friendship.addressee_id
                        : friendship.requester_id;

                const profile =
                    await getProfile(otherId);

                if (!profile) {
                    continue;
                }

                const card =
                    createUserCard(profile);

                const remove =
                    document.createElement("button");

                remove.className =
                    "secondary-button";

                remove.textContent =
                    "Remove";

                remove.onclick =
                    async () => {
                        await window.supabaseClient
                            .from("friendships")
                            .delete()
                            .eq(
                                "id",
                                friendship.id
                            );

                        loadFriends();
                    };

                card.appendChild(remove);

                container.appendChild(card);
            }
        }

        async function init() {
            session = await requireAuth();

            if (!session) {
                return;
            }

            await loadRequests();
            await loadFriends();
        }

        init();
    </script>
</body>
</html>
