<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friends - Rip_Dead Account</title>

    <link rel="stylesheet" href="/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/auth.js"></script>
</head>

<body>

<nav class="site-navbar">

    <div class="navbar-inner">

        <a href="/" class="navbar-brand">
            Rip_Dead Account
        </a>

        <div class="navbar-links">

            <a href="/">
                Home
            </a>

            <a
                href="/search/"
                class="auth-only"
                hidden
            >
                Search
            </a>

            <a
                href="/friends/"
                class="auth-only"
                hidden
            >
                Friends
            </a>

            <a
                href="/chat/"
                class="auth-only"
                hidden
            >
                Chat
            </a>
            
            <a
                href="/apps/"
                class="auth-only"
                hidden
            >
                Authorized Apps
            </a>

            <a
                href="/settings/"
                class="auth-only"
                hidden
            >
                Settings
            </a>

            <a
                href="/account/"
                class="auth-only"
                hidden
            >
                Account
            </a>

            <a
                href="/login/"
                class="guest-only"
            >
                Log In
            </a>

            <a
                href="/signup/"
                class="guest-only button-link"
            >
                Create Account
            </a>

            <button
                type="button"
                id="navbar-logout"
                class="auth-only navbar-logout"
                hidden
            >
                Log Out
            </button>

        </div>

    </div>

</nav>


<main class="page">

    <div class="page-header">

        <span
            style="
                display: block;
                margin-bottom: 10px;
                color: var(--purple-hover);
                font-size: 11px;
                font-weight: 800;
                letter-spacing: 0.12em;
            "
        >
            RIP_DEAD SOCIAL
        </span>

        <h1>
            Friends
        </h1>

        <p>
            Manage your Rip_Dead connections.
        </p>

    </div>


    <div
        id="friends-message"
        class="message"
        aria-live="polite"
    ></div>


    <section class="card">

        <h2 class="card-title">
            Friend Requests
        </h2>

        <p class="card-description">
            People who want to connect with you.
        </p>

        <div id="requests">
            Loading...
        </div>

    </section>


    <section class="card">

        <h2 class="card-title">
            Your Friends
        </h2>

        <p class="card-description">
            Your current Rip_Dead connections.
        </p>

        <div id="friends-list">
            Loading...
        </div>

    </section>

</main>


<script>

let friendsSession = null;


const requestsContainer =
    document.getElementById("requests");


const friendsContainer =
    document.getElementById("friends-list");


const friendsMessage =
    document.getElementById("friends-message");


async function initializeFriends() {

    friendsSession =
        await requireAuth();


    if (!friendsSession) {
        return;
    }


    await initNavbar();

    await loadFriendships();
}


async function loadFriendships() {

    requestsContainer.innerHTML =
        "Loading...";

    friendsContainer.innerHTML =
        "Loading...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("friendships")
            .select("*")
            .or(
                `requester_id.eq.${friendsSession.user.id},addressee_id.eq.${friendsSession.user.id}`
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Friendships error:",
            error
        );


        setMessage(
            friendsMessage,
            error.message,
            "error"
        );


        return;
    }


    requestsContainer.innerHTML = "";

    friendsContainer.innerHTML = "";


    const requests =
        data.filter(
            friendship =>
                friendship.addressee_id ===
                    friendsSession.user.id &&
                friendship.status ===
                    "pending"
        );


    const accepted =
        data.filter(
            friendship =>
                friendship.status ===
                    "accepted"
        );


    /*
     * Friend Requests
     */

    if (requests.length === 0) {

        requestsContainer.innerHTML = `
            <div class="empty-state">
                No pending friend requests.
            </div>
        `;

    } else {

        for (
            const friendship of requests
        ) {

            const profile =
                await getProfile(
                    friendship.requester_id
                );


            if (!profile) {
                continue;
            }


            const card =
                createFriendCard(profile);


            const actions =
                document.createElement("div");

            actions.style.display =
                "flex";

            actions.style.flexWrap =
                "wrap";

            actions.style.gap =
                "7px";

            actions.style.marginLeft =
                "auto";


            const view =
                document.createElement("a");

            view.href =
                "/user/?id=" +
                encodeURIComponent(
                    profile.id
                );

            view.className =
                "button secondary";

            view.textContent =
                "View";


            const accept =
                document.createElement("button");

            accept.type =
                "button";

            accept.textContent =
                "Accept";

            accept.onclick =
                () =>
                    updateFriendRequest(
                        friendship.id,
                        "accepted"
                    );


            const decline =
                document.createElement("button");

            decline.type =
                "button";

            decline.className =
                "danger";

            decline.textContent =
                "Decline";

            decline.onclick =
                () =>
                    updateFriendRequest(
                        friendship.id,
                        "declined"
                    );


            actions.appendChild(view);

            actions.appendChild(accept);

            actions.appendChild(decline);


            card.appendChild(actions);

            requestsContainer.appendChild(card);
        }
    }


    /*
     * Accepted Friends
     */

    if (accepted.length === 0) {

        friendsContainer.innerHTML = `
            <div class="empty-state">
                You don't have any friends yet.
            </div>
        `;

    } else {

        for (
            const friendship of accepted
        ) {

            const friendId =
                friendship.requester_id ===
                    friendsSession.user.id
                    ? friendship.addressee_id
                    : friendship.requester_id;


            const profile =
                await getProfile(friendId);


            if (!profile) {
                continue;
            }


            const card =
                createFriendCard(profile);


            const view =
                document.createElement("a");

            view.href =
                "/user/?id=" +
                encodeURIComponent(
                    profile.id
                );

            view.className =
                "button secondary";

            view.textContent =
                "View Profile";


            card.appendChild(view);

            friendsContainer.appendChild(card);
        }
    }
}


function createFriendCard(profile) {

    const card =
        document.createElement("div");

    card.className =
        "user-card";


    const avatar =
        createAvatar(
            profile,
            "user-avatar"
        );


    const information =
        document.createElement("div");

    information.className =
        "user-info";


    const name =
        document.createElement("div");

    name.className =
        "user-name";

    name.textContent =
        profile.display_name ||
        profile.username ||
        "Unknown User";


    const username =
        document.createElement("div");

    username.className =
        "user-username";

    username.textContent =
        profile.username
            ? "@" + profile.username
            : "";


    information.appendChild(name);

    information.appendChild(username);


    if (profile.is_verified) {

        const badge =
            document.createElement("span");

        badge.className =
            "verified-badge";

        badge.textContent =
            "✓ Verified";

        badge.style.display =
            "inline-block";

        badge.style.marginTop =
            "5px";

        badge.style.color =
            "var(--purple-hover)";

        badge.style.fontSize =
            "12px";

        badge.style.fontWeight =
            "700";


        information.appendChild(badge);
    }


    card.appendChild(avatar);

    card.appendChild(information);


    return card;
}


async function updateFriendRequest(
    friendshipId,
    status
) {

    const {
        error
    } =
        await supabaseClient
            .from("friendships")
            .update({
                status
            })
            .eq(
                "id",
                friendshipId
            );


    if (error) {

        setMessage(
            friendsMessage,
            error.message,
            "error"
        );


        return;
    }


    await loadFriendships();
}


initializeFriends();

</script>

</body>

</html>
