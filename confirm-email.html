<!DOCTYPE html>
<html>
<body>
    <input id="userId" placeholder="User UUID">
    <input id="adminKey" placeholder="Admin key" type="password">
    <button onclick="confirmEmail()">Confirm Email</button>

    <pre id="result"></pre>

    <script>
        async function confirmEmail() {
            const userId = document.getElementById("userId").value.trim();
            const adminKey = document.getElementById("adminKey").value;

            const response = await fetch(
                "https://vcwfgyikbvfzgqiljmry.supabase.co/functions/v1/confirm-email",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-admin-key": adminKey
                    },
                    body: JSON.stringify({
                        user_id: userId
                    })
                }
            );

            const result = await response.json();

            document.getElementById("result").textContent =
                JSON.stringify(result, null, 2);
        }
    </script>
</body>
</html>
